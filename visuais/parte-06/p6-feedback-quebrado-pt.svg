<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="950" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="950" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUINTO ELEMENTO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O laço não sumiu. Fechou em outro lugar.</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O esquema circular de Schramm (1954) pressupõe que quem recebe é distinto de quem carrega</text><text x="60" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">ANTES</text><rect x="60" y="238" width="1480" height="132" rx="14" fill="#E6F0EA" fill-opacity="0.55"/><rect x="355.0" y="262.0" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><text x="460" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Produto</text><rect x="1035.0" y="262.0" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><text x="1140" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Usuário</text><line x1="568" y1="285" x2="1032" y2="285" stroke="#2F7D5D" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#2F7D5D" text-anchor="middle">entrega</text><line x1="1032" y1="317" x2="568" y2="317" stroke="#2F7D5D" stroke-width="2.5" marker-end="url(#a)"/><text x="800.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="italic" fill="#2F7D5D" text-anchor="middle">retorno</text><text x="60" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">AGORA</text><rect x="60" y="450" width="1480" height="336" rx="14" fill="#F5EBDD" fill-opacity="0.5"/><rect x="582" y="460" width="718" height="136" rx="14" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="598" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">A SESSÃO</text><rect x="195.0" y="490.0" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/><text x="300" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Produto</text><rect x="635.0" y="490.0" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/><text x="740" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Agente</text><rect x="1075.0" y="490.0" width="210" height="76" rx="12" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="2"/><text x="1180" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Usuário</text><line x1="408" y1="528" x2="632" y2="528" stroke="#2F5D8A" stroke-width="2.5" marker-end="url(#a)"/><text x="520.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">entrega</text><line x1="848" y1="513" x2="1072" y2="513" stroke="#2F5D8A" stroke-width="2.5" marker-end="url(#a)"/><line x1="1072" y1="545" x2="848" y2="545" stroke="#B8792E" stroke-width="2.5" marker-end="url(#a)"/><text x="960.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="italic" fill="#B8792E" text-anchor="middle">reclama</text><line x1="1180" y1="598" x2="1180" y2="658" stroke="#B8792E" stroke-width="2.5" marker-end="url(#a)"/><text x="1198" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="italic" fill="#B8792E" text-anchor="start">registro da sessão</text><rect x="1054.0" y="661.0" width="252" height="90" rx="12" fill="#FFFFFF" stroke="#B8792E" stroke-width="2"/><text x="1180" y="701" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">Quem opera</text><text x="1180" y="723" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">o modelo</text><line x1="1046" y1="706" x2="340" y2="706" stroke="#C7CDD5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#a)"/><line x1="723.0" y1="685" x2="757.0" y2="727" stroke="#9C4A3C" stroke-width="4"/><line x1="757.0" y1="685" x2="723.0" y2="727" stroke="#9C4A3C" stroke-width="4"/><text x="740.0" y="756" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">o retorno não</text><text x="740.0" y="776" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">volta até aqui</text><rect x="60" y="812" width="1480" height="62" rx="12" fill="#16213E" fill-opacity="0.06"/><rect x="60" y="812" width="1480" height="62" rx="12" fill="none" stroke="#16213E" stroke-width="1.5"/><text x="800.0" y="851" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Meio e receptor viraram a mesma entidade — e a resposta do receptor é absorvida pelo próprio canal.</text><line x1="60" y1="884" x2="1540" y2="884" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="910" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Raciocínio, não medição. Não conheço estudo que tenha quantificado o atraso entre a piora e a descoberta dela.</text></svg>