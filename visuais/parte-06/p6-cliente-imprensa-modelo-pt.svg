37.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Consome e usa o que você entrega</text><circle cx="840.0" cy="231.0" r="15" fill="#2F5D8A"/><text x="840.0" y="237.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">sim</text><circle cx="1120.0" cy="231.0" r="15" fill="none" stroke="#C7CDD5" stroke-width="1.5"/><text x="1120.0" y="237.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="middle">não</text><circle cx="1400.0" cy="231.0" r="15" fill="#B8792E"/><text x="1400.0" y="237.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">sim</text><line x1="60" y1="262" x2="1256.0" y2="262" stroke="#DEE2E7" stroke-width="0.8"/><text x="76" y="299.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Tem necessidades próprias a atender</text><circle cx="840.0" cy="293.0" r="15" fill="#2F5D8A"/><text x="840.0" y="299.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">sim</text><circle cx="1120.0" cy="293.0" r="15" fill="none" stroke="#C7CDD5" stroke-width="1.5"/><text x="1120.0" y="299.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="middle">não</text><circle cx="1400.0" cy="293.0" r="15" fill="#B8792E"/><text x="1400.0" y="299.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">sim</text><line x1="60" y1="324" x2="1256.0" y2="324" stroke="#DEE2E7" stroke-width="0.8"/><r