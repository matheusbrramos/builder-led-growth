<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="688" viewBox="0 0 1600 688"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="688" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="688" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE 1954 SKELETON</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The five elements of communication, before and now</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The classic schema, and what each element becomes under Builder-Led Growth</text><text x="316.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">BEFORE</text><text x="936.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">NOW</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="66" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Sender</text><text x="316.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the organization</text><text x="936.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the organization and everyone writing about it,</text><text x="936.0" y="262" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">machines included</text><text x="76" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Message</text><text x="316.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">what you say</text><text x="936.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">what survives the blending</text><rect x="60" y="320" width="1480" height="44" rx="10" fill="#F5EBDD"/><rect x="60" y="320" width="1480" height="44" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="76" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Medium</text><text x="316.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a vehicle that carries and dissipates</text><text x="936.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a model that absorbs, blends, retains and returns</text><rect x="60" y="364" width="1480" height="44" rx="10" fill="#F5EBDD"/><rect x="60" y="364" width="1480" height="44" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="76" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Receiver</text><text x="316.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a person</text><text x="936.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the machine — and the person behind it</text><rect x="60" y="408" width="1480" height="66" rx="10" fill="#F7F8FA"/><text x="76" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Feedback</text><text x="316.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">returns to the sender</text><text x="936.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">goes to the human; the record stays with whoever</text><text x="936.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">runs the model</text><rect x="60" y="500" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="500" width="1480" height="62" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="539" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">The two middle rows point at the same entity — which is why feedback has no way back.</text><line x1="60" y1="622" x2="1540" y2="622" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · circular schema by Wilbur Schramm (1954), answering the linear model of Shannon and Weaver (1948)</text></svg>