<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="688" viewBox="0 0 1600 688"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="688" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="688" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O ESQUELETO DE 1954</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Os cinco elementos da comunicação, antes e agora</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O esquema clássico, e o que cada elemento vira sob Builder-Led Growth</text><text x="316.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">ANTES</text><text x="936.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">AGORA</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="66" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Emissor</text><text x="316.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a organização</text><text x="936.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a organização e todo mundo que escreve sobre ela,</text><text x="936.0" y="262" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">incluindo máquinas</text><text x="76" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Mensagem</text><text x="316.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o que você diz</text><text x="936.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o que sobrevive à mistura</text><rect x="60" y="320" width="1480" height="44" rx="10" fill="#F5EBDD"/><rect x="60" y="320" width="1480" height="44" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="76" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Meio</text><text x="316.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">veículo que transporta e se dissipa</text><text x="936.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">modelo que absorve, mistura, retém e devolve</text><rect x="60" y="364" width="1480" height="44" rx="10" fill="#F5EBDD"/><rect x="60" y="364" width="1480" height="44" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="76" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Receptor</text><text x="316.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">pessoa</text><text x="936.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a máquina — e a pessoa atrás dela</text><rect x="60" y="408" width="1480" height="66" rx="10" fill="#F7F8FA"/><text x="76" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Retorno</text><text x="316.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">volta ao emissor</text><text x="936.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">vai para o humano; o registro fica com quem opera o</text><text x="936.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">modelo</text><rect x="60" y="500" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="500" width="1480" height="62" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="539" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">As duas linhas do meio apontam para a mesma entidade — e por isso o retorno não tem por onde voltar.</text><line x1="60" y1="622" x2="1540" y2="622" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · esquema circular de Wilbur Schramm (1954), resposta ao modelo linear de Shannon e Weaver (1948)</text></svg>