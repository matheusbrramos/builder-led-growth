<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">GRUNIG AND HUNT, 1984</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The most ethical model became the most effective one</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Four decades on, the field's most-taught framework — read by what the machine gets from each</text><text x="78" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Model</text><text x="508" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Today's equivalent</text><text x="1028" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">What the machine receives</text><line x1="60" y1="230" x2="1540" y2="230" stroke="#DEE2E7" stroke-width="1.5"/><rect x="66" y="252" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Press agentry</text><text x="508" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Content built to grab attention</text><text x="1028" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Noise, and noise costs context</text><line x1="60" y1="324" x2="1540" y2="324" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="344" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Public information</text><text x="508" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Docs, llms.txt, structured data</text><text x="1028" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">This is the legibility pillar</text><line x1="60" y1="416" x2="1540" y2="416" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="436" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Two-way asymmetrical</text><text x="508" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Classic growth</text><text x="1028" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Only your own copy</text><line x1="60" y1="508" x2="1540" y2="508" stroke="#DEE2E7" stroke-width="0.8"/><rect x="60" y="514" width="1480" height="80" rx="12" fill="#F5EBDD"/><rect x="60" y="514" width="1480" height="80" rx="12" fill="none" stroke="#B8792E" stroke-width="2.5"/><rect x="66" y="528" width="5" height="52" rx="3" fill="#B8792E"/><text x="86" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Two-way symmetrical</text><text x="508" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">An actual community</text><text x="1028" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Third-party text about you</text><rect x="60" y="630" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="630" width="1480" height="62" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="669" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">The argument the symmetrical model lacked was not ethical. It was economic — and it showed up.</text><line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">A bridge between a 1984 theory and a 2026 retrieval finding. The two never met in the literature.</text></svg>