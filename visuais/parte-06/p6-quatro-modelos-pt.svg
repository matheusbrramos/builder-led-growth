<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">GRUNIG E HUNT, 1984</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O modelo mais ético virou também o mais eficaz</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quatro décadas depois, o arcabouço mais ensinado da área — lido pelo que a máquina recebe de cada um</text><text x="78" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Modelo</text><text x="508" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">O equivalente hoje</text><text x="1028" y="216" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">O que a máquina recebe</text><line x1="60" y1="230" x2="1540" y2="230" stroke="#DEE2E7" stroke-width="1.5"/><rect x="66" y="252" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Agência de imprensa</text><text x="508" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Conteúdo para chamar atenção</text><text x="1028" y="284.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ruído, e ruído custa contexto</text><line x1="60" y1="324" x2="1540" y2="324" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="344" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Informação pública</text><text x="508" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Documentação, llms.txt, dado estruturado</text><text x="1028" y="376.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">É o pilar de legibilidade</text><line x1="60" y1="416" x2="1540" y2="416" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="436" width="5" height="52" rx="3" fill="#2F5D8A"/><text x="86" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Assimétrico de mão dupla</text><text x="508" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Growth clássico</text><text x="1028" y="468.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Só o seu próprio texto</text><line x1="60" y1="508" x2="1540" y2="508" stroke="#DEE2E7" stroke-width="0.8"/><rect x="60" y="514" width="1480" height="80" rx="12" fill="#F5EBDD"/><rect x="60" y="514" width="1480" height="80" rx="12" fill="none" stroke="#B8792E" stroke-width="2.5"/><rect x="66" y="528" width="5" height="52" rx="3" fill="#B8792E"/><text x="86" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Simétrico de mão dupla</text><text x="508" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Comunidade de verdade</text><text x="1028" y="560.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Texto de terceiro sobre você</text><rect x="60" y="630" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="630" width="1480" height="62" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="669" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">O argumento que faltava ao modelo simétrico não era ético. Era econômico — e ele apareceu.</text><line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Ponte entre uma teoria de 1984 e um dado de recuperação de 2026. As duas coisas nunca se encontraram na literatura.</text></svg>