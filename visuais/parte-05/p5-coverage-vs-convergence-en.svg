<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1000" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">COMMUNITY FORMATS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Coverage and convergence call for opposite designs</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Coverage is how much of the problem space the format reaches; convergence is how far the answers point at the same place</text><rect x="260" y="240" width="1080" height="500" rx="12" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><line x1="800.0" y1="240" x2="800.0" y2="740" stroke="#DEE2E7" stroke-width="1" stroke-dasharray="6 6"/><line x1="260" y1="490.0" x2="1340" y2="490.0" stroke="#DEE2E7" stroke-width="1" stroke-dasharray="6 6"/><text x="800.0" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">CONVERGENCE</text><text x="220" y="490.0" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2F5D8A" text-anchor="middle" letter-spacing="2" transform="rotate(-90 220 490.0)">COVERAGE</text><circle cx="520.0" cy="330.4" r="13" fill="#B8792E" stroke="#FFFFFF" stroke-width="2"/><text x="542.0" y="336.4" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Forum</text><circle cx="380.0" cy="439.6" r="13" fill="#9C4A3C" stroke="#FFFFFF" stroke-width="2"/><text x="402.0" y="445.6" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Discord</text><circle cx="1100.0" cy="338.8" r="13" fill="#2F5D8A" stroke="#FFFFFF" stroke-width="2"/><text x="1078.0" y="344.8" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Stack Overflow</text><circle cx="1080.0" cy="397.6" r="13" fill="#2F7D5D" stroke="#FFFFFF" stroke-width="2"/><text x="1058.0" y="403.6" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">GitHub Discussions</text><circle cx="1220.0" cy="456.4" r="13" fill="#2F7D5D" stroke="#FFFFFF" stroke-width="2"/><text x="1198.0" y="462.4" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">ArchWiki and MDN</text><circle cx="1180.0" cy="616.0" r="13" fill="#2F5D8A" stroke="#FFFFFF" stroke-width="2"/><text x="1158.0" y="622.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Changelog</text><circle cx="1250.0" cy="582.4" r="13" fill="#2F7D5D" stroke="#FFFFFF" stroke-width="2"/><text x="1228.0" y="588.4" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Cookbook</text><rect x="150" y="826" width="1300" height="68" rx="12" fill="#2F5D8A" fill-opacity="0.10"/><rect x="150" y="826" width="1300" height="68" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="190" y="869" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The pillar's design problem: getting Discord's warmth with Stack Overflow's convergence.</text><line x1="60" y1="934" x2="1540" y2="934" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="960" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Positions are qualitative, from the article's analysis. No published measurement compares formats on these two axes.</text></svg>