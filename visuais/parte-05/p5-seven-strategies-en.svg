<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">HOW TO GROW CONTENT THAT CONVERGES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Seven strategies, one principle</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Make citing the canonical cheaper than rewriting it</text><rect x="60" y="250" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="96" cy="289" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="96" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">1</text><text x="130" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Artifact ready to cite</text><text x="130" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">canonical snippet, stable URL, version</text><rect x="820" y="250" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="856" cy="289" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="856" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">2</text><text x="890" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Reward the record, not interaction</text><text x="890" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">reward what leaves a trace</text><rect x="60" y="342" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="96" cy="381" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="96" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">3</text><text x="130" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Ask in public before private</text><text x="130" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">turns a direct message into a discussion</text><rect x="820" y="342" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="856" cy="381" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="856" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">4</text><text x="890" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Publish the support</text><text x="890" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">a resolved ticket is the highest-signal material</text><rect x="60" y="434" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="96" cy="473" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="96" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">5</text><text x="130" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Close the version loop</text><text x="130" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">the anti-drift work nobody does</text><rect x="820" y="434" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="856" cy="473" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="856" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">6</text><text x="890" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Make honest comparison easy</text><text x="890" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">including where you lose</text><rect x="60" y="526" width="740" height="78" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><circle cx="96" cy="565" r="18" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><text x="96" y="572" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">7</text><text x="130" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Documentation as questions</text><text x="130" y="586" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">matches the shape retrieval takes</text><rect x="60" y="632" width="1480" height="130" rx="12" fill="#9C4A3C" fill-opacity="0.08"/><rect x="60" y="632" width="1480" height="130" rx="12" fill="none" stroke="#9C4A3C" stroke-width="1.5"/><text x="96" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">WHAT NOT TO DO</text><text x="96" y="698" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">·  Reward content volume</text><text x="836" y="698" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">·  Contest with no canonical reference</text><text x="96" y="728" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">·  Answers behind a login</text><text x="836" y="728" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">·  Docs with no date or version</text><line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">People share what's easy to share, and describe in their own words whatever didn't arrive ready-made.</text></svg>