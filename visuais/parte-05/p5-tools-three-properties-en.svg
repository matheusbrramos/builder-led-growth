<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="820" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE COLUMN NOBODY USES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The tools by the three properties</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Recordability, convergence and durability — convergence is the criterion missing from the usual comparisons</text><text x="700" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.2">RECORDABILITY</text><text x="980" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.2">CONVERGENCE</text><text x="1260" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.2">DURABILITY</text><rect x="50" y="224" width="1500" height="58" rx="8" fill="#F7F8FA"/><text x="60" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">GitHub Discussions</text><circle cx="700" cy="244" r="15" fill="#2F7D5D" stroke="#FFFFFF" strok