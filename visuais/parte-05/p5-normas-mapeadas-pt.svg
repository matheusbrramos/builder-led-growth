<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="760" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE JÁ ESTAVA RESOLVIDO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três normas, três problemas deste pilar</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Builder-Led Growth não precisa inventar um sistema de qualidade</text><rect x="60" y="240" width="480" height="300" rx="12" fill="#F7F8FA" stroke="#2F5D8A" stroke-width="1.5"/><rect x="60" y="240" width="480" height="8" rx="0" fill="#2F5D8A"/><text x="88" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ISO 9001 — requisito 7.5</text><text x="88" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Informação documentada</text><line x1="88" y1="342" x2="512" y2="342" stroke="#DEE2E7" stroke-width="1"/><circle cx="100" cy="374" r="4" fill="#C7CDD5"/><text x="118" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Análise crítica antes da divulgação</text><circle cx="100" cy="408" r="4" fill="#C7CDD5"/><text x="118" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Disponível no local de uso</text><circle cx="100" cy="442" r="4" fill="#C7CDD5"/><text x="118" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Legível</text><circle cx="100" cy="476" r="4" fill="#C7CDD5"/><text x="118" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Proteção contra versão obsoleta</text><rect x="560" y="240" width="480" height="300" rx="12" fill="#F7F8FA" stroke="#2F5D8A" stroke-width="1.5"/><rect x="560" y="240" width="480" height="8" rx="0" fill="#2F5D8A"/><text x="588" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ISO 30401 — 2018</text><text x="588" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Gestão do conhecimento</text><line x1="588" y1="342" x2="1012" y2="342" stroke="#DEE2E7" stroke-width="1"/><circle cx="600" cy="374" r="4" fill="#C7CDD5"/><text x="618" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Identificação e criação</text><circle cx="600" cy="408" r="4" fill="#B8792E"/><text x="618" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">REPRESENTAÇÃO</text><circle cx="600" cy="442" r="4" fill="#C7CDD5"/><text x="618" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Distribuição e aplicação</text><rect x="1060" y="240" width="480" height="300" rx="12" fill="#F7F8FA" stroke="#2F5D8A" stroke-width="1.5"/><rect x="1060" y="240" width="480" height="8" rx="0" fill="#2F5D8A"/><text x="1088" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ISO/IEC 19770-2 — 2015</text><text x="1088" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Identificação de software</text><line x1="1088" y1="342" x2="1512" y2="342" stroke="#DEE2E7" stroke-width="1"/><circle cx="1100" cy="374" r="4" fill="#C7CDD5"/><text x="1118" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Nome, edição e versão</text><circle cx="1100" cy="408" r="4" fill="#C7CDD5"/><text x="1118" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Procedência e artefatos</text><circle cx="1100" cy="442" r="4" fill="#C7CDD5"/><text x="1118" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Descoberta e contextualização</text><rect x="60" y="580" width="1480" height="74" rx="12" fill="#B8792E" fill-opacity="0.14"/><rect x="60" y="580" width="1480" height="74" rx="12" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="96" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O limite: a norma controla o que é seu. O resto se resolve por gravidade — tornar o canônico fácil de citar.</text><line x1="60" y1="694" x2="1540" y2="694" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">A ISO/IEC 19770-2 tem descendência viva na RFC 9393 e adoção pelo NIST. Não encontrei ninguém propondo-a como resposta ao problema de nome.</text></svg>