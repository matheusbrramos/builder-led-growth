<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE NINTH CIRCUIT CRITERION, 4 AUGUST 2026</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">It is not how autonomous the agent is, it is where the packets travel</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The design that looked more invasive is the one that ended up protected</text><rect x="120" y="250" width="660" height="344" rx="14" fill="#E6F0EA"/><rect x="120" y="250" width="660" height="344" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="450.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">AGENT IN THE BROWSER</text><text x="450.0" y="334" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">the person's instrument</text><rect x="160.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="250.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the person</text><line x1="342.0" y1="412" x2="358.0" y2="412" stroke="#2F7D5D" stroke-width="2" marker-end="url(#a)"/><rect x="360.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="360.0" y="376" width="180" height="5" rx="0" fill="#2F7D5D"/><text x="450.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">their own</text><text x="450.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">computer</text><line x1="542.0" y1="412" x2="558.0" y2="412" stroke="#2F7D5D" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="650.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the shop's</text><text x="650.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">server</text><text x="450.0" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">The party who accessed was the user, with the agent's help.</text><text x="450.0" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">The tool doesn't access; the person accesses using the tool</text><rect x="820" y="250" width="660" height="344" rx="14" fill="#F5E6E2"/><rect x="820" y="250" width="660" height="344" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="1150.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle" letter-spacing="2">HOSTED AGENT</text><text x="1150.0" y="334" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">may be an actor in its own right</text><rect x="860.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="950.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the person</text><line x1="1042.0" y1="412" x2="1058.0" y2="412" stroke="#9C4A3C" stroke-width="2" marker-end="url(#a)"/><rect x="1060.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="1150.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">their own</text><text x="1150.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">computer</text><line x1="1242.0" y1="412" x2="1258.0" y2="412" stroke="#9C4A3C" stroke-width="2" marker-end="url(#a)"/><rect x="1260.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="1350.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the shop's</text><text x="1350.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">server</text><line x1="955.0" y1="464" x2="1355.0" y2="464" stroke="#9C4A3C" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1150.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">the agent's systems speak straight to the platform</text><text x="1150.0" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">It is the design of nearly every agentic commerce platform,</text><text x="1150.0" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">and it falls on the other side of the line the court drew</text><rect x="60" y="624" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="660" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Where your agent runs stopped being only an architecture decision</text><text x="800.0" y="688" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">If refusing the agent at the door is not a guaranteed right, preparing for it stops being an option and becomes a condition</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Amazon obtained an injunction on 10 March 2026, and the Ninth Circuit reversed on 4 August.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · case 26-1444 · a reading of the published opinion, not legal advice</text></svg>