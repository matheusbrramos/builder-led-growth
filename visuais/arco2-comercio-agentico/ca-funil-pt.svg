<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">AS TRÊS ETAPAS EM COMÉRCIO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que se mede em cada uma, e com que ferramenta</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A conta concreta, e não a categoria — nenhuma delas é tráfego</text><rect x="60" y="250" width="460" height="372" rx="14" fill="#E6F0EA"/><rect x="60" y="250" width="460" height="372" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="250" width="460" height="7" rx="0" fill="#2F7D5D"/><text x="90" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Candidatura</text><text x="90" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">estar no conjunto de onde o agente tira as opções</text><line x1="90" y1="370" x2="490" y2="370" stroke="#2F7D5D" stroke-width="1.5"/><text x="90" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">O QUE SE MEDE</text><text x="90" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Presença na resposta.</text><text x="90" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Trinta perguntas da sua</text><text x="90" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">categoria, com repetição:</text><text x="90" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">em quantas você aparece</text><text x="90" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">COM QUE FERRAMENTA</text><text x="90" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">AEO e GEO, documentação</text><text x="90" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">canônica, feed de produto,</text><text x="90" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">perfil de capacidade</text><line x1="534" y1="436.0" x2="562" y2="436.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="250" width="460" height="372" rx="14" fill="#F5EBDD"/><rect x="570" y="250" width="460" height="372" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="570" y="250" width="460" height="7" rx="0" fill="#B8792E"/><text x="600" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Construção</text><text x="600" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">a decisão fechou sobre você, e tirar custa um clique</text><line x1="600" y1="370" x2="1000" y2="370" stroke="#B8792E" stroke-width="1.5"/><text x="600" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">O QUE SE MEDE</text><text x="600" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Taxa de substituição entre</text><text x="600" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a decisão e o pagamento:</text><text x="600" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">quantas vezes o agente</text><text x="600" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">trocou antes de fechar</text><text x="600" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">COM QUE FERRAMENTA</text><text x="600" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Completude do dado de</text><text x="600" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">produto, preço e estoque</text><text x="600" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">corretos, tempo de resposta</text><line x1="1044" y1="436.0" x2="1072" y2="436.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="250" width="460" height="372" rx="14" fill="#E7EEF4"/><rect x="1080" y="250" width="460" height="372" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1080" y="250" width="460" height="7" rx="0" fill="#2F5D8A"/><text x="1110" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Adoção</text><text x="1110" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">você virou premissa, e tirar custa um projeto</text><line x1="1110" y1="370" x2="1510" y2="370" stroke="#2F5D8A" stroke-width="1.5"/><text x="1110" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">O QUE SE MEDE</text><text x="1110" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A fatia de recompra que NÃO</text><text x="1110" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">reabre a comparação: dos</text><text x="1110" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">pedidos de noventa dias,</text><text x="1110" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">quantos não compararam nada</text><text x="1110" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">COM QUE FERRAMENTA</text><text x="1110" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Camada de memória:</text><text x="1110" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">assinatura, pagamento</text><text x="1110" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">guardado, um clique</text><rect x="60" y="654" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="688" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">A etapa do meio é curta, e encolhe até sumir conforme a delegação sobe</text><text x="92" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Uma recompra de um clique vai de candidatura direto a adoção: a janela em que um concorrente entraria não abre</text><rect x="1010" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1010" y="680" width="51.00000000000001" height="40" rx="8" fill="#B8792E"/><text x="1085" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">delegação baixa</text><rect x="1190" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1190" y="680" width="24.0" height="40" rx="8" fill="#B8792E"/><text x="1265" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">delegação média</text><rect x="1370" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1370" y="680" width="4.5" height="40" rx="8" fill="#B8792E"/><text x="1445" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">um clique</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Em software você trabalha para ser encontrado. Em comércio, para ser admitido.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · o Cart Mandate do padrão de 11 de janeiro de 2026 nomeia o objeto da etapa do meio</text></svg>