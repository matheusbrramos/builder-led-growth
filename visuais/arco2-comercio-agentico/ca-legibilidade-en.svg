<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="930" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="930" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">HOW MUCH THE MACHINE CAN READ</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Close to half of what the shop writes never reaches the decider</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Adobe, over more than a trillion visits · the scale runs to 100% because the argument is what's missing</text><text x="356" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Cosmetics</text><rect x="380" y="254" width="940" height="54" rx="8" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><rect x="380" y="254" width="592.2" height="54" rx="8" fill="#2F5D8A"/><text x="990.2" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">63%</text><text x="1304" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="end">what the machine can't reach</text><text x="356" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Electronics</text><rect x=