="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">Furniture and home decor</text><rect x="380" y="574" width="940" height="54" rx="8" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><rect x="380" y="574" width="441.8" height="54" rx="8" fill="#9C4A3C"/><text x="839.8" y="610" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">47%</text><text x="1304" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="end">what the machine can't reach</text><rect x="60" y="666" width="1480" height="80" rx="14" fill="#F5EBDD"/><rect x="60" y="666" width="6" height="80" rx="0" fill="#B8792E"/><text x="96" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Even in the sectors doing best, 30% to 40% of the content on the highest-value pages is not captured</text><text x="96" y="728" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Nobody wrote a bad page on purpose: they were written for a person to look at, by a team that didn't know the next reader would be a program</text><rect x="60" y="778" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="778" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="817" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The calculation is an afternoon's work: twenty pages, the facts that decide the purchase, and a model answering from that page alone.</text><line x1="60" y1="864" x2="1540" y2="864" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Adobe Analytics, via Digital Commerce 360 (17 June 2026) · vendor measurement, interested party</text></svg>