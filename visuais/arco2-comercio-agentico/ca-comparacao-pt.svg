<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="930" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="930" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DOIS FUNIS LADO A LADO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O mesmo desenho, e não é a mesma coisa que anda dentro</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Um descreve onde a pessoa está; o outro, onde o seu produto está</text><rect x="120" y="250" width="660" height="400" rx="14" fill="#F7F8FA"/><rect x="120" y="250" width="660" height="400" rx="14" fill="none" stroke="#8B93A1" stroke-width="2"/><text x="450.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle" letter-spacing="2">FUNIL DE MARKETING</text><rect x="195.0" y="342" width="510" height="66" rx="10" fill="#FFFFFF" stroke="#8B93A1" stroke-width="1.5"/><text x="450.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Descoberta</text><text x="450.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">alcance, impressão, visita</text><rect x="240.0" y="426" width="420" height="66" rx="10" fill="#FFFFFF" stroke="#8B93A1" stroke-width="1.5"/><text x="450.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Consideração</text><text x="450.0" y="478" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">lead, clique, carrinho montado</text><rect x="274.0" y="510" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#8B93A1" stroke-width="1.5"/><text x="450.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Decisão</text><text x="450.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">conversão, ticket, custo de aquisição</text><rect x="150" y="594" width="600" height="44" rx="10" fill="#8B93A1" fill-opacity="0.14"/><text x="450.0" y="624" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">quem anda: o cliente</text><rect x="820" y="250" width="660" height="400" rx="14" fill="#E7EEF4"/><rect x="820" y="250" width="660" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1150.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">FUNIL DO BUILDER-LED GROWTH</text><rect x="895.0" y="342" width="510" height="66" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="1150.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Candidatura</text><text x="1150.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">você está no conjunto de onde se escolhe</text><rect x="940.0" y="426" width="420" height="66" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="1150.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Construção</text><text x="1150.0" y="478" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">a decisão fechou, e tirar é barato</text><rect x="974.0" y="510" width="352" height="66" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="1150.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Adoção</text><text x="1150.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">virou premissa, e tirar custa um projeto</text><rect x="850" y="594" width="600" height="44" rx="10" fill="#2F5D8A" fill-opacity="0.14"/><text x="1150.0" y="624" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">quem anda: o produto, empurrado pelo par</text><rect x="60" y="684" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Em nenhum dos dois o consumidor escolhe fornecedor</text><text x="800.0" y="748" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Quem passa pelo funil do BLG é quem constrói: a plataforma, o meio de pagamento, o varejista que precisa ser escolhido</text><rect x="60" y="778" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="778" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="817" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Na resposta do agente a pessoa vê o que sobrou da curadoria, sem saber o que foi descartado.</text><line x1="60" y1="864" x2="1540" y2="864" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · funil de marketing: St. Elmo Lewis (1898), AIDA (1921), o desenho de funil (1924)</text></svg>