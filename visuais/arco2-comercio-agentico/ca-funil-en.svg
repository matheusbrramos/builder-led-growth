<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE THREE STAGES IN COMMERCE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What gets measured at each one, and with which tool</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The concrete calculation, not the category — none of them is traffic</text><rect x="60" y="250" width="460" height="372" rx="14" fill="#E6F0EA"/><rect x="60" y="250" width="460" height="372" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="250" width="460" height="7" rx="0" fill="#2F7D5D"/><text x="90" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Candidacy</text><text x="90" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">being in the set the agent draws its options from</text><line x1="90" y1="370" x2="490" y2="370" stroke="#2F7D5D" stroke-width="1.5"/><text x="90" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">WHAT GETS MEASURED</text><text x="90" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Presence in the answer.</text><text x="90" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Thirty questions from your</text><text x="90" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">category, repeated: how many</text><text x="90" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">of them you show up in</text><text x="90" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">WITH WHICH TOOL</text><text x="90" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">AEO and GEO, canonical</text><text x="90" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">documentation, product feed,</text><text x="90" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">capability profile</text><line x1="534" y1="436.0" x2="562" y2="436.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="250" width="460" height="372" rx="14" fill="#F5EBDD"/><rect x="570" y="250" width="460" height="372" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="570" y="250" width="460" height="7" rx="0" fill="#B8792E"/><text x="600" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Construction</text><text x="600" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">the decision closed around you; removal costs one click</text><line x1="600" y1="370" x2="1000" y2="370" stroke="#B8792E" stroke-width="1.5"/><text x="600" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">WHAT GETS MEASURED</text><text x="600" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Substitution rate between</text><text x="600" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the decision and payment:</text><text x="600" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">how many times the agent</text><text x="600" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">swapped before closing</text><text x="600" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">WITH WHICH TOOL</text><text x="600" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Product data completeness,</text><text x="600" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">correct price and stock,</text><text x="600" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">response time</text><line x1="1044" y1="436.0" x2="1072" y2="436.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="250" width="460" height="372" rx="14" fill="#E7EEF4"/><rect x="1080" y="250" width="460" height="372" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1080" y="250" width="460" height="7" rx="0" fill="#2F5D8A"/><text x="1110" y="312" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Adoption</text><text x="1110" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">you became a premise; removal costs a project</text><line x1="1110" y1="370" x2="1510" y2="370" stroke="#2F5D8A" stroke-width="1.5"/><text x="1110" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">WHAT GETS MEASURED</text><text x="1110" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The share of repurchase that</text><text x="1110" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">does NOT reopen the comparison:</text><text x="1110" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">of ninety days of orders, how</text><text x="1110" y="497" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">many compared nothing</text><text x="1110" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">WITH WHICH TOOL</text><text x="1110" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The memory layer:</text><text x="1110" y="579" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">subscription, stored</text><text x="1110" y="602" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">payment, one click</text><rect x="60" y="654" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="688" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">The middle stage is short, and it shrinks until it disappears as delegation rises</text><text x="92" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">A one-click repurchase goes from candidacy straight to adoption: the window a competitor would enter through never opens</text><rect x="1010" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1010" y="680" width="51.00000000000001" height="40" rx="8" fill="#B8792E"/><text x="1085" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">low delegation</text><rect x="1190" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1190" y="680" width="24.0" height="40" rx="8" fill="#B8792E"/><text x="1265" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">mid delegation</text><rect x="1370" y="680" width="150" height="40" rx="8" fill="#24365C"/><rect x="1370" y="680" width="4.5" height="40" rx="8" fill="#B8792E"/><text x="1445" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">one click</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">In software you work to be found. In commerce, to be admitted.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the Cart Mandate in the 11 January 2026 standard names the object of the middle stage</text></svg>