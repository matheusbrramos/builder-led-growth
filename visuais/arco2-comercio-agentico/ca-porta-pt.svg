<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O CRITÉRIO DO NONO CIRCUITO, EM 4 DE AGOSTO DE 2026</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Não é o quanto o agente é autônomo, é por onde os pacotes passam</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O desenho que parecia mais invasivo é o que ficou protegido</text><rect x="120" y="250" width="660" height="344" rx="14" fill="#E6F0EA"/><rect x="120" y="250" width="660" height="344" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="450.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">AGENTE NO NAVEGADOR</text><text x="450.0" y="334" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">instrumento da pessoa</text><rect x="160.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="250.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">a pessoa</text><line x1="342.0" y1="412" x2="358.0" y2="412" stroke="#2F7D5D" stroke-width="2" marker-end="url(#a)"/><rect x="360.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="360.0" y="376" width="180" height="5" rx="0" fill="#2F7D5D"/><text x="450.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">o computador</text><text x="450.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">dela</text><line x1="542.0" y1="412" x2="558.0" y2="412" stroke="#2F7D5D" stroke-width="2" marker-end="url(#a)"/><rect x="560.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="650.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">o servidor</text><text x="650.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">da loja</text><text x="450.0" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Quem acessou foi o usuário, com a ajuda do agente.</text><text x="450.0" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">A ferramenta não acessa; a pessoa acessa usando a ferramenta</text><rect x="820" y="250" width="660" height="344" rx="14" fill="#F5E6E2"/><rect x="820" y="250" width="660" height="344" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="1150.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle" letter-spacing="2">AGENTE HOSPEDADO</text><text x="1150.0" y="334" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">pode ser ator próprio</text><rect x="860.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="950.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">a pessoa</text><line x1="1042.0" y1="412" x2="1058.0" y2="412" stroke="#9C4A3C" stroke-width="2" marker-end="url(#a)"/><rect x="1060.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="1150.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">o computador</text><text x="1150.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">dela</text><line x1="1242.0" y1="412" x2="1258.0" y2="412" stroke="#9C4A3C" stroke-width="2" marker-end="url(#a)"/><rect x="1260.0" y="376" width="180" height="72" rx="10" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1"/><text x="1350.0" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">o servidor</text><text x="1350.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">da loja</text><line x1="955.0" y1="464" x2="1355.0" y2="464" stroke="#9C4A3C" stroke-width="2.5" stroke-dasharray="8 6"/><text x="1150.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">os sistemas do agente falam direto com a plataforma</text><text x="1150.0" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">É o desenho de quase toda plataforma de comércio agêntico,</text><text x="1150.0" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">e cai do outro lado da linha que a corte traçou</text><rect x="60" y="624" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="660" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Onde o seu agente roda deixou de ser só uma decisão de arquitetura</text><text x="800.0" y="688" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Se recusar o agente na porta não é direito garantido, preparar-se para ele deixa de ser opção e vira condição</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A Amazon obteve liminar em 10 de março de 2026, e o Nono Circuito reverteu em 4 de agosto.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · caso 26-1444 · leitura da opinião publicada, não aconselhamento jurídico</text></svg>