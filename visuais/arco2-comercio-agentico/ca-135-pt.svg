serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Tecnologia de agentes</text><text x="1410" y="434.33333333333337" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="end">5</text><rect x="860" y="502.6666666666667" width="580" height="82.0" rx="8" fill="#F5EBDD"/><rect x="860" y="502.6666666666667" width="6" height="82.0" rx="0" fill="#B8792E"/><text x="890" y="549.6666666666667" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Redesenho de processo</text><text x="1410" y="549.6666666666667" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="end">3</text><rect x="860" y="590.6666666666667" width="580" height="27.333333333333332" rx="8" fill="#E6F0EA"/><rect x="860" y="590.6666666666667" width="6" height="27.333333333333332" rx="0" fill="#2F7D5D"/><text x="890" y="610.3333333333334" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Capacitação e adoção</text><text x="1410" y="610.3333333333334" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="end">1</text><rect x="60" y="680" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">A fronteira entre marketing e engenharia dissolveu</text><text x="800.0" y="744" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Quando quem lê é a máquina, o artefato de engenharia e a peça de marketing são o mesmo objeto</text><rect x="60" y="778" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="778" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="817" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Se o seu investimento está invertido, o atraso na adoção é seu.</text><line x1="60" y1="864" x2="1540" y2="864" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · McKinsey, agosto de 2026 · estudo de ambiente corporativo; levá-lo ao varejo é conjectura declarada</text></svg>