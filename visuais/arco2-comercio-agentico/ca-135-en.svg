ize="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Agent technology</text><text x="1410" y="434.33333333333337" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="end">5</text><rect x="860" y="502.6666666666667" width="580" height="82.0" rx="8" fill="#F5EBDD"/><rect x="860" y="502.6666666666667" width="6" height="82.0" rx="0" fill="#B8792E"/><text x="890" y="549.6666666666667" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Process redesign</text><text x="1410" y="549.6666666666667" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="end">3</text><rect x="860" y="590.6666666666667" width="580" height="27.333333333333332" rx="8" fill="#E6F0EA"/><rect x="860" y="590.6666666666667" width="6" height="27.333333333333332" rx="0" fill="#2F7D5D"/><text x="890" y="610.3333333333334" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Enablement and adoption</text><text x="1410" y="610.3333333333334" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="end">1</text><rect x="60" y="680" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">The boundary between marketing and engineering dissolved</text><text x="800.0" y="744" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">When the reader is a machine, the engineering artefact and the marketing piece are the same object</text><rect x="60" y="778" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="778" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="817" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">If your investment is inverted, the adoption lag is yours.</text><line x1="60" y1="864" x2="1540" y2="864" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="890" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · McKinsey, August 2026 · a corporate-environment study; carrying it to retail is declared conjecture</text></svg>