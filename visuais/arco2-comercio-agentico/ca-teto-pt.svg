<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O TETO DA DELEGAÇÃO DO CONSUMIDOR</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Estreitar as opções, sim; decidir a compra, quase não</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A disposição declarada, e a ressalva de método vem junto do número</text><rect x="60.0" y="250" width="460" height="285" rx="14" fill="#F5E6E2"/><rect x="60.0" y="250" width="460" height="285" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="60.0" y="250" width="460" height="6" rx="0" fill="#9C4A3C"/><text x="88.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">11%</text><rect x="444.0" y="290" width="44" height="102.00000000000001" rx="6" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1.5"/><rect x="444.0" y="380.78" width="44" height="11.220000000000002" rx="6" fill="#9C4A3C"/><text x="88.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">deixar a IA DECIDIR a compra</text><text x="88.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">É TETO, não média, e ocorre nas</text><text x="88.0" y="445" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">categorias de menor risco</text><text x="88.0" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Gartner, campo em jan/2026, n=322</text><text x="88.0" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">autodeclaração, sem margem publicada</text><rect x="570.0" y="250" width="460" height="285" rx="14" fill="#E6F0EA"/><rect x="570.0" y="250" width="460" height="285" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="570.0" y="250" width="460" height="6" rx="0" fill="#2F7D5D"/><text x="598.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">31%</text><rect x="954.0" y="290" width="44" height="102.00000000000001" rx="6" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><rect x="954.0" y="360.38" width="44" height="31.620000000000005" rx="6" fill="#2F7D5D"/><text x="598.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">deixar a IA ESTREITAR as opções</text><text x="598.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Produto de limpeza e casa,</text><text x="598.0" y="445" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a categoria de maior aceitação</text><text x="598.0" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Gartner, campo em jan/2026, n=322</text><text x="598.0" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">autodeclaração, sem margem publicada</text><rect x="1080.0" y="250" width="460" height="285" rx="14" fill="#E7EEF4"/><rect x="1080.0" y="250" width="460" height="285" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1080.0" y="250" width="460" height="6" rx="0" fill="#2F5D8A"/><text x="1108.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">28%</text><rect x="1464.0" y="290" width="44" height="102.00000000000001" rx="6" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><rect x="1464.0" y="363.44" width="44" height="28.560000000000006" rx="6" fill="#2F5D8A"/><text x="1108.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">estreitar, em eletrônico pessoal</text><text x="1108.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Categoria de risco percebido maior,</text><text x="1108.0" y="445" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">e a aceitação cai junto</text><text x="1108.0" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Gartner, campo em jan/2026, n=322</text><text x="1108.0" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">autodeclaração, sem margem publicada</text><rect x="60" y="569" width="1480" height="82" rx="14" fill="#16213E"/><text x="800.0" y="605" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Quem está construindo autonomia total está construindo para 11% do mercado</text><text x="800.0" y="633" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Numa compra delegada a transação é o compromisso: você descobre se foi bom depois de já ter pago</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Ganha o produto que faz a delegação parecer reversível, não o que automatiza mais.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · a ansiedade que trava a troca é de Bob Moesta, na teoria do trabalho a ser feito</text></svg>