<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="720" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">AS QUATRO DIMENSÕES DA CONFIANÇA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três já têm dono. A quarta não.</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">E a quarta é a que este artigo trata</text><text x="78" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Dimensão</text><text x="478" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">A pergunta</text><text x="1098" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Quem responde hoje</text><line x1="60" y1="224" x2="1540" y2="224" stroke="#DEE2E7" stroke-width="1.5"/><rect x="66" y="244" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Segurança da informação</text><text x="478" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">dá para invadir através disto?</text><text x="1098" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">segurança</text><line x1="60" y1="308" x2="1540" y2="308" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="326" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Confiabilidade do produto</text><text x="478" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">o código faz o que a descrição promete?</text><text x="1098" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">engenharia</text><line x1="60" y1="390" x2="1540" y2="390" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="408" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Conformidade</text><text x="478" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">consigo responder por isto a um terceiro?</text><text x="1098" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">jurídico</text><line x1="60" y1="472" x2="1540" y2="472" stroke="#DEE2E7" stroke-width="0.8"/><rect x="60" y="477" width="1480" height="72" rx="12" fill="#F5EBDD"/><rect x="60" y="477" width="1480" height="72" rx="12" fill="none" stroke="#B8792E" stroke-width="2.5"/><rect x="66" y="490" width="5" height="46" rx="3" fill="#B8792E"/><text x="86" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Segurança de marca</text><text x="478" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">alguém consegue falar por mim sem eu saber?</text><text x="1098" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">ninguém</text><rect x="60" y="568" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="568" width="1480" height="62" rx="12" fill="none" stroke="#B8792E" stroke-width="1.8"/><text x="800.0" y="607" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">Enquanto não se decide de quem é, ninguém está olhando.</text><line x1="60" y1="654" x2="1540" y2="654" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Divisão proposta pelo autor. Não corresponde a nenhum arcabouço estabelecido de governança.</text></svg>