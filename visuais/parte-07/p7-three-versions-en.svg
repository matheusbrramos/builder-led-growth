<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="740" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="740" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE PILLAR DEFINITION</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three versions, and what each was missing</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The correction came mid-writing, and changed what the pillar asks for</text><rect x="60" y="224" width="1480" height="102" rx="14" fill="#F7F8FA"/><rect x="60" y="224" width="1480" height="102" rx="14" fill="none" stroke="#2F5D8A" stroke-width="1.2"/><rect x="60" y="224" width="7" height="102" rx="0" fill="#2F5D8A"/><text x="92" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">Part 1</text><text x="92" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">trustworthy enough to act without supervision</text><text x="92" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">assumes supervision goes away — it does not</text><rect x="60" y="342" width="1480" height="102" rx="14" fill="#F7F8FA"/><rect x="60" y="342" width="1480" height="102" rx="14" fill="none" stroke="#2F5D8A" stroke-width="1.2"/><rect x="60" y="342" width="7" height="102" rx="0" fill="#2F5D8A"/><text x="92" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">Correction</text><text x="92" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">verifiable enough that supervision can be automated</text><text x="92" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">assumes automatic checking catches what matters</text><rect x="60" y="460" width="1480" height="102" rx="14" fill="#F5EBDD"/><rect x="60" y="460" width="1480" height="102" rx="14" fill="none" stroke="#B8792E" stroke-width="2.5"/><rect x="60" y="460" width="7" height="102" rx="0" fill="#B8792E"/><text x="92" y="500" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">Third</text><text x="92" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">…and reversible enough that the error which slips is not expensive</text><text x="92" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">the reviewer drinks the same water as the reviewed</text><rect x="60" y="588" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="588" width="1480" height="62" rx="12" fill="none" stroke="#B8792E" stroke-width="1.8"/><text x="800.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">Trust does not come from avoiding the error. It comes from bounding it and reversing fast.</text><line x1="60" y1="674" x2="1540" y2="674" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Author's proposal. I know of no study testing these properties against agent adoption.</text></svg>