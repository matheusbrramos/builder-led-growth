<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="522" viewBox="0 0 1600 522"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="522" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="522" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT THE ADOPTER ASKS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Four questions, and none is about model quality</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Every one of them is about the design of your product</text><text x="356.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">THE QUESTION</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Verifiable</text><text x="356.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">can a machine check that it did what it said it did?</text><text x="76" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Reversible</text><text x="356.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">can it be undone without manual intervention?</text><rect x="60" y="298" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Partitionable</text><text x="356.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">can it be exposed to 1% before 100%?</text><text x="76" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Observable</text><text x="356.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">can a failure be detected without someone complaining?</text><line x1="60" y1="456" x2="1540" y2="456" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · a proposal, not a measurement — I know of no survey that tested the four against agent adoption</text></svg>