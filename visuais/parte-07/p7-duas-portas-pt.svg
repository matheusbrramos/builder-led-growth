<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="720" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">OS DOIS JULGADORES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Um produto pode passar numa porta e falhar na outra</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Critérios diferentes, evidências diferentes, prazos diferentes</text><rect x="60.0" y="216" width="720.0" height="314" rx="14" fill="#E7EEF4"/><rect x="60.0" y="216" width="720.0" height="314" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="216" width="720.0" height="54" rx="14" fill="#2F5D8A"/><rect x="60.0" y="244" width="720.0" height="26" rx="0" fill="#2F5D8A"/><text x="420.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">A MÁQUINA</text><text x="88.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">A pergunta</text><text x="88.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">funciona sem que eu precise conferir?</text><line x1="84.0" y1="356" x2="756.0" y2="356" stroke="#2F5D8A" stroke-width="0.9" stroke-dasharray="4 4"/><text x="88.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">A evidência que aceita</text><text x="88.0" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">comportamento na execução</text><line x1="84.0" y1="432" x2="756.0" y2="432" stroke="#2F5D8A" stroke-width="0.9" stroke-dasharray="4 4"/><text x="88.0" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">O prazo da decisão</text><text x="88.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">segundos</text><rect x="820.0" y="216" width="720.0" height="314" rx="14" fill="#F5EBDD"/><rect x="820.0" y="216" width="720.0" height="314" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="820.0" y="216" width="720.0" height="54" rx="14" fill="#B8792E"/><rect x="820.0" y="244" width="720.0" height="26" rx="0" fill="#B8792E"/><text x="1180.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">O COMPRADOR CORPORATIVO</text><text x="848.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">A pergunta</text><text x="848.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">posso responder por isto?</text><line x1="844.0" y1="356" x2="1516.0" y2="356" stroke="#B8792E" stroke-width="0.9" stroke-dasharray="4 4"/><text x="848.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">A evidência que aceita</text><text x="848.0" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">documento e certificação</text><line x1="844.0" y1="432" x2="1516.0" y2="432" stroke="#B8792E" stroke-width="0.9" stroke-dasharray="4 4"/><text x="848.0" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">O prazo da decisão</text><text x="848.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">trimestres</text><rect x="60" y="568" width="1480" height="62" rx="12" fill="#16213E" fill-opacity="0.06"/><rect x="60" y="568" width="1480" height="62" rx="12" fill="none" stroke="#16213E" stroke-width="1.8"/><text x="800.0" y="607" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Certificação vira critério de elegibilidade antes de o agente escolher.</text><line x1="60" y1="654" x2="1540" y2="654" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">ISO/IEC 42001 publicada em dezembro de 2023. A magnitude da exigência de mercado não foi verificada na fonte.</text></svg>