<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="522" viewBox="0 0 1600 522"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="522" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="522" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE O ADOTANTE PERGUNTA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quatro perguntas, e nenhuma é sobre qualidade de modelo</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Todas são sobre o desenho do seu produto</text><text x="356.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">A PERGUNTA</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Verificável</text><text x="356.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dá para checar por máquina que fez o que disse que fez?</text><text x="76" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Reversível</text><text x="356.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dá para desfazer sem intervenção manual?</text><rect x="60" y="298" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Particionável</text><text x="356.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dá para expor a 1% antes de expor a 100%?</text><text x="76" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Observável</text><text x="356.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dá para detectar que deu errado sem alguém reclamar?</text><line x1="60" y1="456" x2="1540" y2="456" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · proposta, e não medida — não conheço levantamento que tenha testado as quatro contra taxa de adoção</text></svg>