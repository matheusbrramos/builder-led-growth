<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="760" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE SAME PHENOMENON, TWICE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Variation where reproduction was expected</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">What scatters the corpus and what pushes away the experienced developer are one thing</text><rect x="690.0" y="300" width="220" height="130" rx="16" fill="#16213E"/><text x="800.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MODEL</text><rect x="60" y="236" width="470" height="258" rx="14" fill="#F5EBDD"/><rect x="60" y="236" width="470" height="258" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><text x="295.0" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="2">ON THE WAY IN</text><text x="295.0" y="308" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">corpus dispersion</text><text x="295.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">many incompatible</text><text x="295.0" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">formulations for</text><text x="295.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">the same task</text><text x="295.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">felt by the machine</text><line x1="542" y1="365" x2="678.0" y2="365" stroke="#B8792E" stroke-width="3" marker-end="url(#a)"/><rect x="1070" y="236" width="470" height="258" rx="14" fill="#E7EEF4"/><rect x="1070" y="236" width="470" height="258" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1305.0" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">ON THE WAY OUT</text><text x="1305.0" y="308" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">non-reproducible answer</text><text x="1305.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">the same question</text><text x="1305.0" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">twice produces</text><text x="1305.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">different answers</text><text x="1305.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">felt by the human</text><line x1="922.0" y1="365" x2="1058" y2="365" stroke="#2F5D8A" stroke-width="3" marker-end="url(#a)"/><text x="800.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" font-style="normal" fill="#C7CDD5" text-anchor="middle">↑</text><text x="800.0" y="574" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="italic" fill="#16213E" text-anchor="middle">it is the same variation</text><rect x="60" y="608" width="1480" height="62" rx="12" fill="#16213E" fill-opacity="0.06"/><rect x="60" y="608" width="1480" height="62" rx="12" fill="none" stroke="#16213E" stroke-width="1.8"/><text x="800.0" y="647" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Engineering is built on reproduction. The model operates on distribution.</text><line x1="60" y1="694" x2="1540" y2="694" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Determinism explanation per Stack Overflow; the link to dispersion is the author's proposal.</text></svg>