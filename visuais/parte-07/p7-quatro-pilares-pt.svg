<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="544" viewBox="0 0 1600 544"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="544" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="544" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">OS QUATRO PILARES, JUNTOS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que cada pilar pede, e o que derruba cada um</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O arco fecha onde a parte 1 abriu, agora com cada pilar aberto por dentro</text><text x="316.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">O QUE PEDE</text><text x="936.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">O QUE O DERRUBA</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Legibilidade</text><text x="316.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">ser lido, entendido e usado sem ambiguidade</text><text x="936.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">nome que aponta para mais de uma coisa</text><text x="76" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Acessibilidade</text><text x="316.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">começar sem parada humana no meio</text><text x="936.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">credencial antes do primeiro uso</text><rect x="60" y="298" width="1480" height="66" rx="10" fill="#F7F8FA"/><text x="76" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Comunidade</text><text x="316.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">existir material de terceiro que alimente a</text><text x="316.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">recomendação</text><text x="936.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dispersão sem âncora canônica</text><text x="76" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Confiança</text><text x="316.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">ser verificável e reversível</text><text x="936.0" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a competência do modelo, usada contra ele</text><line x1="60" y1="478" x2="1540" y2="478" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · série Builder-Led Growth, partes 1 a 7</text></svg>