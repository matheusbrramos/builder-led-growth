<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="720" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE FOUR DIMENSIONS OF TRUST</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three already have an owner. The fourth does not.</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">And the fourth is what this piece is about</text><text x="78" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Dimension</text><text x="478" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">The question</text><text x="1098" y="210" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">Who answers today</text><line x1="60" y1="224" x2="1540" y2="224" stroke="#DEE2E7" stroke-width="1.5"/><rect x="66" y="244" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Information security</text><text x="478" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">can someone break in through this?</text><text x="1098" y="273.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">security</text><line x1="60" y1="308" x2="1540" y2="308" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="326" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Product reliability</text><text x="478" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">does the code do what the description promises?</text><text x="1098" y="355.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">engineering</text><line x1="60" y1="390" x2="1540" y2="390" stroke="#DEE2E7" stroke-width="0.8"/><rect x="66" y="408" width="5" height="46" rx="3" fill="#2F5D8A"/><text x="86" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Compliance</text><text x="478" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">can I answer for this to a third party?</text><text x="1098" y="437.0" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">legal</text><line x1="60" y1="472" x2="1540" y2="472" stroke="#DEE2E7" stroke-width="0.8"/><rect x="60" y="477" width="1480" height="72" rx="12" fill="#F5EBDD"/><rect x="60" y="477" width="1480" height="72" rx="12" fill="none" stroke="#B8792E" stroke-width="2.5"/><rect x="66" y="490" width="5" height="46" rx="3" fill="#B8792E"/><text x="86" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Brand safety</text><text x="478" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">can someone speak for me without my knowing?</text><text x="1098" y="519.0" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">nobody</text><rect x="60" y="568" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="568" width="1480" height="62" rx="12" fill="none" stroke="#B8792E" stroke-width="1.8"/><text x="800.0" y="607" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">Until it is decided whose it is, nobody is watching.</text><line x1="60" y1="654" x2="1540" y2="654" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Division proposed by the author. It matches no established governance framework.</text></svg>