<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">A PERGUNTA QUE FECHA O ARCO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Duas ambiguidades, e elas pedem coisas opostas</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Eliminar onde é ruído; projetar para conviver onde é a matéria-prima</text><rect x="60.0" y="216" width="720.0" height="386" rx="14" fill="#F5E6E2"/><rect x="60.0" y="216" width="720.0" height="386" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="420.0" y="258" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle" letter-spacing="2">NA SUA SUPERFÍCIE</text><text x="420.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">nome, descrição, documentação</text><rect x="106.0" y="316" width="628.0" height="92" rx="12" fill="#FFFFFF" stroke="#9C4A3C" stroke-width="1.5"/><text x="420.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">um nome que aponta</text><text x="420.0" y="376" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">para mais de uma coisa</text><rect x="106.0" y="438" width="628.0" height="58" rx="12" fill="#9C4A3C"/><text x="420.0" y="475" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ELIMINAR</text><text x="420.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">ali ela é ruído</text><text x="420.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">o que você controla</text><rect x="820.0" y="216" width="720.0" height="386" rx="14" fill="#E6F0EA"/><rect x="820.0" y="216" width="720.0" height="386" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="1180.0" y="258" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">NO PEDIDO QUE CHEGA</text><text x="1180.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">e no caminho que a máquina escolhe</text><rect x="866.0" y="316" width="628.0" height="92" rx="12" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="1180.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">"faz isso ficar</text><text x="1180.0" y="376" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">mais rápido"</text><rect x="866.0" y="438" width="628.0" height="58" rx="12" fill="#2F7D5D"/><text x="1180.0" y="475" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PROJETAR PARA CONVIVER</text><text x="1180.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">ali ela é a matéria-prima</text><text x="1180.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">o que você não controla</text><rect x="60" y="648" width="1480" height="62" rx="12" fill="#16213E" fill-opacity="0.06"/><rect x="60" y="648" width="1480" height="62" rx="12" fill="none" stroke="#16213E" stroke-width="1.8"/><text x="800.0" y="687" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Se toda ambiguidade sumisse do pedido, o resultado seria uma linguagem de programação.</text><line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Raciocínio construído durante a escrita da parte 7. Não é prática validada.</text></svg>