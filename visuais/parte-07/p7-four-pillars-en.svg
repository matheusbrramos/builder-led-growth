<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="522" viewBox="0 0 1600 522"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="522" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="522" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE FOUR PILLARS, TOGETHER</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What each pillar asks for, and what brings each one down</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The arc closes where part 1 opened it, with each pillar now opened from the inside</text><text x="316.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">WHAT IT ASKS FOR</text><text x="936.0" y="194" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1">WHAT BRINGS IT DOWN</text><line x1="60" y1="208" x2="1540" y2="208" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="210" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Legibility</text><text x="316.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">being read, understood and used without ambiguity</text><text x="936.0" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a name that points to more than one thing</text><text x="76" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Accessibility</text><text x="316.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">starting without a human stop halfway</text><text x="936.0" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a credential before first use</text><rect x="60" y="298" width="1480" height="44" rx="10" fill="#F7F8FA"/><text x="76" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Community</text><text x="316.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">third-party material existing to feed recommendation</text><text x="936.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">dispersion with no canonical anchor</text><text x="76" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Trust</text><text x="316.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">being verifiable and reversible</text><text x="936.0" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the model's competence, turned against it</text><line x1="60" y1="456" x2="1540" y2="456" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Matheus Ramos · Builder-Led Growth series, parts 1 to 7</text></svg>