<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">A RAIZ DA DESCONFIANÇA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Regra determinística, executor probabilístico</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O que entra como contrato sai como uma variação entre muitas possíveis</text><rect x="60" y="216" width="430" height="210" rx="14" fill="#E7EEF4"/><rect x="60" y="216" width="430" height="210" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="275.0" y="252" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.5">A REGRA QUE O HUMANO ESCREVE</text><text x="275.0" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">sempre faça assim</text><text x="275.0" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">nunca faça assado</text><text x="275.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="italic" fill="#16213E" text-anchor="middle">o resultado tem que ser este</text><rect x="197.0" y="380" width="156" height="30" rx="15" fill="#2F5D8A"/><text x="275.0" y="401" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">determinística</text><rect x="560" y="216" width="300" height="210" rx="14" fill="#16213E"/><text x="710.0" y="252" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#AEB6C2" text-anchor="middle" letter-spacing="1.5">O SISTEMA QUE EXECUTA</text><circle cx="669.1292014412936" cy="295.76623556611116" r="3.5" fill="#6E9CC4"/><circle cx="745.0167977452461" cy="289.65003036006834" r="3.5" fill="#6E9CC4"/><circle cx="718.3246249991519" cy="312.5237355191817" r="3.5" fill="#6E9CC4"/><circle cx="607.455750547732" cy="323.5799871887748" r="3.5" fill="#6E9CC4"/><circle cx="602.6989927585405" cy="317.8243633256661" r="3.5" fill="#6E9CC4"/><circle cx="610.2064582693116" cy="291.07561504082145" r="3.5" fill="#6E9CC4"/><circle cx="692.4884518810633" cy="348.494465724419" r="3.5" fill="#6E9CC4"/><circle cx="622.7220549867178" cy="301.41263923934713" r="3.5" fill="#6E9CC4"/><circle cx="739.5645075980967" cy="357.92129751164646" r="3.5" fill="#6E9CC4"/><circle cx="727.8878840792597" cy="314.94107702276085" r="3.5" fill="#6E9CC4"/><circle cx="820.4911844975575" cy="287.633449088185" r="3.5" fill="#6E9CC4"/><circle cx="793.1646824992937" cy="306.58952433387077" r="3.5" fill="#6E9CC4"/><circle cx="627.4671793389255" cy="293.1877945701127" r="3.5" fill="#6E9CC4"/><circle cx="665.5677831916488" cy="347.65785601136247" r="3.5" fill="#6E9CC4"/><circle cx="635.9285201423535" cy="329.36481276567235" r="3.5" fill="#6E9CC4"/><circle cx="742.2279247908747" cy="313.04700833260705" r="3.5" fill="#6E9CC4"/><circle cx="721.0767160446175" cy="288.8975400479192" r="3.5" fill="#6E9CC4"/><circle cx="607.827471432166" cy="300.06477959990747" r="3.5" fill="#6E9CC4"/><circle cx="751.8527937781744" cy="317.3521998422134" r="3.5" fill="#6E9CC4"/><circle cx="666.8821435274157" cy="329.6738253535958" r="3.5" fill="#6E9CC4"/><circle cx="699.1387753180198" cy="307.38182575536723" r="3.5" fill="#6E9CC4"/><circle cx="778.296039713218" cy="338.5215658309066" r="3.5" fill="#6E9CC4"/><circle cx="650.6303904875394" cy="328.80504940017636" r="3.5" fill="#6E9CC4"/><circle cx="715.8455888842567" cy="352.2607246547275" r="3.5" fill="#6E9CC4"/><circle cx="763.2313071498985" cy="306.45914566143455" r="3.5" fill="#6E9CC4"/><circle cx="821.4005646182791" cy="293.20913070388707" r="3.5" fill="#6E9CC4"/><rect x="632.0" y="380" width="156" height="30" rx="15" fill="#B8792E"/><text x="710.0" y="401" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">probabilístico</text><line x1="502" y1="321" x2="548" y2="321" stroke="#2F5D8A" stroke-width="3" marker-end="url(#a)"/><rect x="930" y="216" width="610" height="210" rx="14" fill="#F5EBDD"/><rect x="930" y="216" width="610" height="210" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><text x="1235.0" y="252" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="1.5">O QUE SAI</text><line x1="872" y1="321" x2="918" y2="321" stroke="#B8792E" stroke-width="3" marker-end="url(#a)"/><rect x="976" y="336" width="46" height="26" rx="5" fill="#B8792E" fill-opacity="0.75"/><rect x="1036" y="304" width="46" height="58" rx="5" fill="#B8792E" fill-opacity="0.75"/><rect x="1096" y="322" width="46" height="40" rx="5" fill="#B8792E" fill-opacity="0.75"/><rect x="1156" y="340" width="46" height="22" rx="5" fill="#B8792E" fill-opacity="0.75"/><rect x="1216" y="350" width="46" height="12" rx="5" fill="#B8792E" fill-opacity="0.75"/><line x1="970" y1="364" x2="1500" y2="364" stroke="#B8792E" stroke-width="1.5"/><text x="1059.0" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2F7D5D" text-anchor="middle">▼</text><text x="1059.0" y="272" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">esperado</text><text x="1235.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">uma variação entre muitas</text><rect x="60" y="476" width="1480" height="96" rx="14" fill="#F5E6E2"/><rect x="60" y="476" width="1480" height="96" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="800.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">A pessoa conclui que a máquina não obedece.</text><text x="800.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#9C4A3C" text-anchor="middle">A máquina fez exatamente o que ela faz.</text><rect x="60" y="648" width="1480" height="62" rx="12" fill="#16213E" fill-opacity="0.06"/><rect x="60" y="648" width="1480" height="62" rx="12" fill="none" stroke="#16213E" stroke-width="1.8"/><text x="800.0" y="687" font-family="Liberation Sans, Arial, sans-serif" font-size="19.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Um sistema probabilístico não honra instrução. Honra restrição verificável.</text><line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Formulação de Mat, 31 de julho de 2026. Raciocínio, não medição.</text></svg>