<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/>
<rect x="0" y="0" width="10" height="820" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">OS QUATRO PILARES</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que um produto precisa fazer bem</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quatro alavancas independentes que se reforçam — não um canal a mais</text>
<rect x="60" y="200" width="358" height="540" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="100" cy="246" r="20" fill="#2F5D8A"/>
<text x="100" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="86" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Legibilidade</text>
<text x="86" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">por máquina</text>
<text x="86" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Documentação, APIs e conteúdo</text>
<text x="86" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">estruturados pra serem lidos</text>
<text x="86" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">por um agente antes de</text>
<text x="86" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">serem lidos por um humano.</text>
<line x1="86" y1="622" x2="392" y2="622" stroke="#DEE2E7" stroke-width="1"/>
<text x="86" y="656" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">16% -&gt; 54%</text>
<text x="86" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">citação correta (GPT-4)</text>
<text x="86" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">com dados estruturados · Digidop</text>
<rect x="444" y="200" width="358" height="540" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="484" cy="246" r="20" fill="#2F5D8A"/>
<text x="484" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="470" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Acessibilidade</text>
<text x="470" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">operacional</text>
<text x="470" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">MCP, CLI e SDK não são</text>
<text x="470" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">intercambiáveis — a escolha</text>
<text x="470" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">certa é por ferramenta,</text>
<text x="470" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">não por sistema.</text>
<line x1="470" y1="622" x2="776" y2="622" stroke="#DEE2E7" stroke-width="1"/>
<text x="470" y="656" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">até 32x</text>
<text x="470" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">mais tokens via MCP</text>
<text x="470" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">vs. CLI equivalente · earezki.com</text>
<rect x="828" y="200" width="358" height="540" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="868" cy="246" r="20" fill="#2F5D8A"/>
<text x="868" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="854" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Comunidade e</text>
<text x="854" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">sinal de validação</text>
<text x="854" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Alimenta dois caminhos: entrar</text>
<text x="854" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">no dado de treino (lento) e</text>
<text x="854" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">virar conteúdo comparativo</text>
<text x="854" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">de terceiros (rápido).</text>
<line x1="854" y1="622" x2="1160" y2="622" stroke="#DEE2E7" stroke-width="1"/>
<text x="854" y="656" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">32,5%</text>
<text x="854" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">das citações de IA</text>
<text x="854" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">vem de conteúdo de terceiros · Connor Kimball</text>
<rect x="1212" y="200" width="358" height="540" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="1252" cy="246" r="20" fill="#2F5D8A"/>
<text x="1252" y="253" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1238" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Confiança e</text>
<text x="1238" y="325" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">segurança do modelo</text>
<text x="1238" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Não é segurança da informação —</text>
<text x="1238" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">é o quanto o agente confia em</text>
<text x="1238" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">agir sem checagem humana</text>
<text x="1238" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">constante.</text>
<line x1="1238" y1="622" x2="1544" y2="622" stroke="#DEE2E7" stroke-width="1"/>
<text x="1238" y="656" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">fronteira</text>
<text x="1238" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">mais delicada dos 4</text>
<text x="1238" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">sem métrica pública consolidada ainda</text>
<line x1="60" y1="754" x2="1540" y2="754" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Fontes citadas individualmente no artigo completo (Digidop, Connor Kimball, earezki.com, Firecrawl, Towards AI).</text>
</svg>