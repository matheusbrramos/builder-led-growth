<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/>
<rect x="0" y="0" width="10" height="760" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">POSICIONAMENTO DA TESE</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Onde o Builder-Led Growth se encaixa</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Duas fronteiras já mapeadas por outros — e o vão real entre elas</text>
<rect x="60" y="200" width="460" height="330" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="200" width="460" height="6" rx="0" fill="#8B93A1"/>
<text x="86" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">JÁ EXISTE — COMPRA FORMAL</text>
<text x="86" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">ALG — Agent-Led Growth</text>
<text x="86" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Agente contratado avalia e</text>
<text x="86" y="343" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">compra em nome de um comprador</text>
<text x="86" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Funil: pesquisa -&gt; comparação -&gt;</text>
<text x="86" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">teste -&gt; decisão -&gt; compra</text>
<text x="86" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Pago por resultado verificado</text>
<text x="86" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#8B93A1" text-anchor="start">quem decide: um comprador</text>
<rect x="550" y="186" width="460" height="358" rx="10" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="2"/>
<rect x="550" y="186" width="460" height="8" rx="0" fill="#2F5D8A"/>
<text x="576" y="234" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O VÃO — ESTA TESE</text>
<text x="576" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Builder-Led Growth (BLG)</text>
<text x="576" y="308" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Agente está construindo</text>
<text x="576" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">algo diferente</text>
<text x="576" y="364" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Recomenda ferramenta de terceiro</text>
<text x="576" y="392" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">como efeito colateral instrumental</text>
<text x="576" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Sem comprador formal, sem funil</text>
<text x="576" y="520" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#2F5D8A" text-anchor="start">quem decide: um agente construtor</text>
<rect x="1040" y="200" width="460" height="330" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="1040" y="200" width="460" height="6" rx="0" fill="#8B93A1"/>
<text x="1066" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">JÁ EXISTE — PRODUTO PRÓPRIO</text>
<text x="1066" y="278" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">PLG 3.0 / Headless (Wes Bush)</text>
<text x="1066" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Seu próprio produto operado</text>
<text x="1066" y="343" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">por um agente sem interface</text>
<text x="1066" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Questão de design do produto</text>
<text x="1066" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">que está sendo usado</text>
<text x="1066" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Ex.: Netlify, 80% signups via agente</text>
<text x="1066" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="italic" fill="#8B93A1" text-anchor="start">quem decide: o seu produto</text>
<line x1="520" y1="365.0" x2="550" y2="365.0" stroke="#8B93A1" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="1010" y1="365.0" x2="1040" y2="365.0" stroke="#8B93A1" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="535.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">sobreposição parcial reconhecida</text>
<text x="535.0" y="588" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">(estágio de avaliação do ALG)</text>
<text x="1025.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">infraestrutura compartilhada</text>
<text x="1025.0" y="588" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">(AGENTS.md, MCP, Agent Skills)</text>
<line x1="60" y1="690" x2="1540" y2="690" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Fontes: Agent-Led Strategy (agentledstrategy.com/thesis) · Wes Bush via Userpilot (userpilot.com/blog/product-led-growth) · análise completa e ressalvas no artigo.</text>
