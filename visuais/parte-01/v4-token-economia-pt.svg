<text x="60" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">"Code execution with MCP" (Anthropic) reduz consumo de token em até 98% quando aplicável. Fonte: Towards AI.</text>
