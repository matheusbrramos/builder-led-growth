<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">REAL CASES</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Two proofs, two layers of the stack</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Funded SaaS vs. unfunded open source — the same pattern repeating</text>
<rect x="60" y="190" width="700" height="520" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="190" width="700" height="6" rx="0" fill="#2F5D8A"/>
<text x="90" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Supabase</text>
<text x="90" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">backend / database — funded SaaS</text>
<text x="90" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">$500M</text>
<text x="90" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Raised June 2026,</text>
<text x="90" y="365" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">$10.5B valuation</text>
<line x1="90" y1="396" x2="730" y2="396" stroke="#DEE2E7" stroke-width="1"/>
<text x="90" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">60%+</text>
<text x="90" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">of new databases created on</text>
<text x="90" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the platform via AI coding tools</text>
<line x1="90" y1="488" x2="730" y2="488" stroke="#DEE2E7" stroke-width="1"/>
<text x="90" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">600%</text>
<text x="90" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">year-over-year increase in databases</text>
<text x="90" y="549" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">created via Claude Code</text>
<text x="90" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Let's Data Science · SiliconANGLE · Supabase Blog</text>
<rect x="820" y="190" width="700" height="520" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="820" y="190" width="700" height="6" rx="0" fill="#2F5D8A"/>
<text x="850" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">shadcn/ui</text>
<text x="850" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">UI components — open source</text>
<text x="850" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">109k+</text>
<text x="850" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">GitHub stars in under 3 years,</text>
<text x="850" y="365" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">with no direct funding</text>
<line x1="850" y1="396" x2="1490" y2="396" stroke="#DEE2E7" stroke-width="1"/>
<text x="850" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">5</text>
<text x="850" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">independent vendors' tools</text>
<text x="850" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">generate it by default</text>
<line x1="850" y1="488" x2="1490" y2="488" stroke="#DEE2E7" stroke-width="1"/>
<text x="850" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">$0</text>
<text x="850" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">spent on sales — traction comes</text>
<text x="850" y="549" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">from being in the training data</text>
<text x="850" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">ShadcnDeck · Vibe Coder Blog</text>
<line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Individual sources in the full piece (Let's Data Science, SiliconANGLE, Supabase Blog, ShadcnDeck, Vibe Coder Blog).</text>
</svg>