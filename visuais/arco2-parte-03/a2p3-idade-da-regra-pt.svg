<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="840" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE SE PROVA, A QUEM</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A idade da regra diz qual argumento funciona</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Compliance não é a ansiedade: é a resposta institucional a ela. E envelhece para hábito</text><rect x="60.0" y="204" width="720" height="340" rx="14" fill="#E7EEF4"/><rect x="60.0" y="204" width="720" height="340" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="204" width="720" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">REGRA NOVA</text><text x="86.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A lista escrita há seis meses</text><text x="86.0" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">ainda é ansiedade — alguém lembra qual susto a criou</text><line x1="86.0" y1="354" x2="754.0" y2="354" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">RESPONDE A</text><text x="86.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Evidência, prova e reversibilidade.</text><text x="86.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">É aqui que a conformidade conferível</text><text x="86.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">faz diferença: o link para a atestação</text><text x="86.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">real, o relatório de auditoria, a</text><text x="86.0" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">página de status, o registro público</text><text x="86.0" y="528" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">do questionário</text><rect x="820.0" y="204" width="720" height="340" rx="14" fill="#F7F8FA"/><rect x="820.0" y="204" width="720" height="340" rx="14" fill="none" stroke="#8B93A1" stroke-width="2"/><rect x="820.0" y="204" width="720" height="7" rx="0" fill="#8B93A1"/><text x="846.0" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="2">REGRA VELHA</text><text x="846.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O fornecedor no contrato há cinco anos</text><text x="846.0" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">já é hábito — ninguém no time lembra o medo, só o passo</text><line x1="846.0" y1="354" x2="1514.0" y2="354" stroke="#8B93A1" stroke-width="1.2"/><text x="846.0" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">SÓ CEDE A</text><text x="846.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Convivência, troca pequena e o caminho</text><text x="846.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que não exige desfazer nada. Quem chega</text><text x="846.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">com relatório de auditoria contra uma</text><text x="846.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">regra de cinco anos fala com a</text><text x="846.0" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">ansiedade de alguém que já foi embora</text><rect x="60" y="572" width="1480" height="84" rx="14" fill="#16213E"/><text x="800.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Declarar conformidade é tática que decai. Tornar a conformidade conferível é tática que fica.</text><text x="800.0" y="636" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Afirmação num arquivo é afirmação não verificada: se todo fornecedor escrever que atende a norma, o leitor de máquina passa a ignorar</text><rect x="60" y="688" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="688" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="727" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Critério não testado, dito como tal: raciocínio sobre as quatro forças de Moesta e Spiek, sem medição.</text><line x1="60" y1="774" x2="1540" y2="774" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Moesta e Spiek (The Four Forces) · Cloud Security Alliance, AI-CAIQ (jun/2026, 247 controles) · Microsoft SSPA (abr/2025)</text></svg>