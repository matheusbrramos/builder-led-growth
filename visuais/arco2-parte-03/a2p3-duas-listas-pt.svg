<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">QUEM CORTA: A PESSOA, E AS DUAS LISTAS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A lista de compras alimenta a lista do agente, e ninguém compara produtos em nenhuma</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A segunda quase não existe ainda; a maioria das empresas está no meio, onde a lista existe e não fecha tudo</text><rect x="60" y="200" width="630" height="400" rx="14" fill="#F7F8FA"/><rect x="60" y="200" width="630" height="400" rx="14" fill="none" stroke="#16213E" stroke-width="2"/><text x="86" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="2">LISTA 1</text><text x="86" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A lista de compras</text><text x="86" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">escrita por compras, segurança e jurídico — ninguém que vá usar o serviço</text><line x1="86" y1="346" x2="664" y2="346" stroke="#16213E" stroke-width="1.2"/><rect x="80" y="366" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">O QUE ELA PERGUNTA</text><text x="96" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Tem relatório de auditoria? Onde guarda o dado? O que faz com ele?</text><rect x="80" y="440" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">O QUE ELA NÃO PERGUNTA</text><text x="96" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Se o serviço de e-mail entrega melhor que o concorrente</text><rect x="80" y="514" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">QUANTO ELA ALCANÇA</text><text x="96" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">81% do gasto em SaaS é das unidades de negócio; TI, 15%; cartão, 4%</text><rect x="910" y="200" width="630" height="400" rx="14" fill="#E7EEF4"/><rect x="910" y="200" width="630" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="936" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">LISTA 2</text><text x="936" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A lista do agente</text><text x="936" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">escrita por quem administra a plataforma ou o editor</text><line x1="936" y1="346" x2="1514" y2="346" stroke="#2F5D8A" stroke-width="1.2"/><rect x="930" y="366" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">ONDE ELA MORA</text><text x="946" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Copilot, Claude Code, Cursor (Enterprise), Codex: servidor MCP por identidade</text><rect x="930" y="440" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">O QUE A DOCUMENTAÇÃO AVISA</text><text x="946" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">"Não é uma fronteira de segurança" (Cursor); a API aberta passa por fora</text><rect x="930" y="514" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">QUANTAS EMPRESAS A TÊM</text><text x="946" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">10% têm governança para identidades não humanas; 58%: preocupação nº 1</text><line x1="700" y1="400.0" x2="900" y2="400.0" stroke="#2F5D8A" stroke-width="4"/><polygon points="902,400 880,386 880,414" fill="#2F5D8A"/><text x="800.0" y="356.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">A PRIMEIRA</text><text x="800.0" y="374.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">ALIMENTA A SEGUNDA</text><rect x="60" y="626" width="1480" height="92" rx="14" fill="#16213E"/><text x="92" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Governança plena em 30% das equipes de engenharia; 47% das grandes empresas sem visibilidade completa</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Black Duck e UserEvidence (jun/2026, n=831, fornecedor de segurança) · Protiviti (mai/2026, consultoria) · Zylo (jan/2026, base própria) · Okta (2026)</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O fornecedor de e-mail que já está no contrato da nuvem entra na lista do agente sem que ninguém compare nada.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Cursor e OpenAI (documentação oficial, set/2026) · Zylo · Okta · Black Duck · Protiviti</text></svg>