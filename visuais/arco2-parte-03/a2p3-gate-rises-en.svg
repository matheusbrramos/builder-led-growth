<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="840" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHY THE GATE RISES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The absence of governance produces the risk that will justify it</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Direction without a measure: no survey repeats the same question two years running. The mechanism does have numbers</text><rect x="81.0" y="204" width="340" height="330" rx="14" fill="#F7F8FA"/><rect x="81.0" y="204" width="340" height="7" rx="0" fill="#8B93A1"/><text x="103.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">WHERE THE MAJORITY IS</text><text x="103.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">70%</text><text x="103.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">partial or informal governance</text><line x1="103.0" y1="370" x2="399.0" y2="370" stroke="#8B93A1" stroke-width="1.2"/><text x="103.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">30% fully governed, 44%</text><text x="103.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">structured with limited</text><text x="103.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">monitoring, the rest informal</text><text x="103.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">or individual. Companies with</text><text x="103.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">more than 500 people, n=831</text><rect x="447.0" y="204" width="340" height="330" rx="14" fill="#F5E6E2"/><rect x="447.0" y="204" width="340" height="7" rx="0" fill="#9C4A3C"/><text x="469.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">THE PACKAGE THAT DOES NOT EXIST</text><text x="469.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">5.2%</text><text x="469.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">to 21.7% depending on the model, 2025</text><line x1="469.0" y1="370" x2="765.0" y2="370" stroke="#9C4A3C" stroke-width="1.2"/><text x="469.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">205,474 unique invented names</text><text x="469.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">in 576,000 samples. In 2026,</text><text x="469.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">4.62% – 6.10% on frontier</text><text x="469.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">models; 127 names five models</text><text x="469.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">invent identically</text><rect x="813.0" y="204" width="340" height="330" rx="14" fill="#F5EBDD"/><rect x="813.0" y="204" width="340" height="7" rx="0" fill="#B8792E"/><text x="835.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">WHAT THE COMPANY DOES NOT SEE</text><text x="835.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">69%</text><text x="835.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">suspect prohibited AI use</text><line x1="835.0" y1="370" x2="1131.0" y2="370" stroke="#B8792E" stroke-width="1.2"/><text x="835.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Security leaders, n=302</text><text x="835.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(Gartner, 2025). Among</text><text x="835.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">developers, 35% access AI</text><text x="835.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">through a personal account</text><text x="835.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(Sonar, Jan 2026)</text><rect x="1179.0" y="204" width="340" height="330" rx="14" fill="#E7EEF4"/><rect x="1179.0" y="204" width="340" height="7" rx="0" fill="#2F5D8A"/><text x="1201.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">WHO REGISTERED THE AGENT</text><text x="1201.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">10%</text><text x="1201.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">with identity governance for agents</text><line x1="1201.0" y1="370" x2="1497.0" y2="370" stroke="#2F5D8A" stroke-width="1.2"/><text x="1201.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The company knows it has agents</text><text x="1201.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">running, does not know how</text><text x="1201.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">many, and does not know what</text><text x="1201.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">they can connect to (Okta, 2026)</text><rect x="60" y="562" width="1480" height="84" rx="14" fill="#16213E"/><text x="800.0" y="598" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">The incident lands on someone's desk, and the answer is to write the list</text><text x="800.0" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Whoever writes it has a name and a title, and is almost never a committee: a president, an executive board, whoever administers the platform</text><rect x="60" y="688" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="688" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="727" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Whoever sells to that company today is selling to a list that has not been written yet.</text><line x1="60" y1="774" x2="1540" y2="774" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Black Duck (Jun 2026) · Spracklen et al. (USENIX Security 2025) · Churilov (May 2026) · Gartner via Infosecurity (Nov 2025) · Sonar · Okta</text></svg>