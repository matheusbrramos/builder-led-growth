<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#101A30"/><line x1="1180" y1="0" x2="940" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1272" y1="0" x2="1032" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1364" y1="0" x2="1124" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1456" y1="0" x2="1216" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1548" y1="0" x2="1308" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1640" y1="0" x2="1400" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1732" y1="0" x2="1492" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1824" y1="0" x2="1584" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><line x1="1916" y1="0" x2="1676" y2="1080" stroke="#2F5D8A" stroke-opacity="0.10" stroke-width="2"/><text x="120" y="186" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#6E9CC4" text-anchor="start" letter-spacing="4">BUILDER-LED GROWTH — ARCO 2, PARTE 3</text><line x1="120" y1="214" x2="470" y2="214" stroke="#2F5D8A" stroke-width="3"/><text x="120" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="76" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Ninguém recusou você.</text><text x="120" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="76" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Você nunca esteve na lista</text><text x="120" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Compliance: como entrar na lista de onde a IA pode escolher</text><rect x="120" y="574" width="1680" height="250" rx="16" fill="#B8792E" fill-opacity="0.13"/><rect x="120" y="574" width="1680" height="250" rx="16" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="120" y="574" width="7" height="250" rx="0" fill="#B8792E"/><text x="172" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="400" font-style="normal" fill="#E8DCC8" text-anchor="start">Um CRM montado com IA numa empresa de 2.500 pessoas, e o serviço de e-mail</text><text x="172" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">decidido seis meses antes do primeiro prompt, por quem nunca vai comparar fornecedores.</text><text x="172" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" font-style="italic" fill="#AEB6C2" text-anchor="start">Três cortadores, duas listas, uma norma lida por máquina, e a idade da regra</text><line x1="120" y1="990" x2="1800" y2="990" stroke="#2F5D8A" stroke-width="1.5"/><text x="120" y="1032" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Matheus Ramos · arco 2, parte 3</text></svg>