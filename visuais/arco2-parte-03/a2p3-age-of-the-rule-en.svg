<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="840" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT TO PROVE, TO WHOM</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The age of the rule says which argument works</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Compliance is not the anxiety: it is the institutional answer to it. And it ages into habit</text><rect x="60.0" y="204" width="720" height="340" rx="14" fill="#E7EEF4"/><rect x="60.0" y="204" width="720" height="340" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="204" width="720" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">NEW RULE</text><text x="86.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The list written six months ago</text><text x="86.0" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">still anxiety — someone remembers which scare created it</text><line x1="86.0" y1="354" x2="754.0" y2="354" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">RESPONDS TO</text><text x="86.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Evidence, proof and reversibility.</text><text x="86.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">This is where checkable compliance</text><text x="86.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">makes the difference: the link to the</text><text x="86.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">actual attestation, the audit report,</text><text x="86.0" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the status page, the public register</text><text x="86.0" y="528" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">of the questionnaire</text><rect x="820.0" y="204" width="720" height="340" rx="14" fill="#F7F8FA"/><rect x="820.0" y="204" width="720" height="340" rx="14" fill="none" stroke="#8B93A1" stroke-width="2"/><rect x="820.0" y="204" width="720" height="7" rx="0" fill="#8B93A1"/><text x="846.0" y="254" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="2">OLD RULE</text><text x="846.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The vendor in the contract for five years</text><text x="846.0" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">already habit — nobody on the team remembers the fear, only the step</text><line x1="846.0" y1="354" x2="1514.0" y2="354" stroke="#8B93A1" stroke-width="1.2"/><text x="846.0" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">YIELDS ONLY TO</text><text x="846.0" y="418" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Coexistence, the small switch and the</text><text x="846.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">path that requires undoing nothing.</text><text x="846.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Whoever arrives with an audit report</text><text x="846.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">against a five-year-old rule speaks</text><text x="846.0" y="506" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">to the anxiety of someone who has left</text><rect x="60" y="572" width="1480" height="84" rx="14" fill="#16213E"/><text x="800.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Declaring compliance is a tactic that decays. Making compliance checkable is a tactic that lasts.</text><text x="800.0" y="636" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">A claim in a file is an unverified claim: if every vendor writes that it meets the standard, the machine reader starts ignoring it</text><rect x="60" y="688" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="688" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="727" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">An untested criterion, said as such: reasoning over Moesta and Spiek's four forces, without measurement.</text><line x1="60" y1="774" x2="1540" y2="774" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Moesta and Spiek (The Four Forces) · Cloud Security Alliance, AI-CAIQ (Jun 2026, 247 controls) · Microsoft SSPA (Apr 2025)</text></svg>