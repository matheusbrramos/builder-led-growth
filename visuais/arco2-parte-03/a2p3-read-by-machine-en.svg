<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE GATE READ BY MACHINE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The questionnaire the vendor answers with AI is read by the buyer's AI</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A product sold since October 2024, not a forecast. The person comes in afterwards, to decide on what the two machines agreed</text><rect x="60" y="204" width="560" height="360" rx="14" fill="#E6F0EA"/><rect x="60" y="204" width="560" height="360" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="86" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">VENDOR SIDE</text><text x="86" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AI answers the questionnaire</text><text x="86" y="364" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">98%</text><text x="86" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">of suggestions accepted (UpGuard); 95% acceptance (Vanta)</text><line x1="86" y1="416" x2="594" y2="416" stroke="#2F7D5D" stroke-width="1.2"/><text x="86" y="446" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Reads its own audit report (SOC 2,</text><text x="86" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">ISO 27001) and answers each buyer's</text><text x="86" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">questionnaire, dozens of times a</text><text x="86" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">year. The percentages are the</text><text x="86" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">tool vendors' own</text><rect x="980" y="204" width="560" height="360" rx="14" fill="#E7EEF4"/><rect x="980" y="204" width="560" height="360" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1006" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">BUYER SIDE</text><text x="1006" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AI reads the report</text><text x="1006" y="364" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">77%</text><text x="1006" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">of a 100+ question questionnaire filled in from the SOC 2</text><line x1="1006" y1="416" x2="1514" y2="416" stroke="#2F5D8A" stroke-width="1.2"/><text x="1006" y="446" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Agents that "read vendor evidence,</text><text x="1006" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">answer controls with citations" and</text><text x="1006" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">surface what to approve or escalate</text><text x="1006" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(Whistic). A buyer's first AI</text><text x="1006" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">question: do you train on my data?</text><rect x="650.0" y="244" width="300" height="280" rx="14" fill="#FFFFFF"/><rect x="650.0" y="244" width="300" height="280" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><text x="800.0" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="1.5">THE DECISION</text><text x="800.0" y="360" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">69%</text><text x="800.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">of buyers validate what</text><text x="800.0" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the AI said with a sales</text><text x="800.0" y="436" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">rep (Gartner, n=645).</text><text x="800.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">The person decides;</text><text x="800.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">the machine prepares</text><line x1="628" y1="384.0" x2="642.0" y2="384.0" stroke="#8B93A1" stroke-width="3"/><line x1="958.0" y1="384.0" x2="972" y2="384.0" stroke="#8B93A1" stroke-width="3"/><rect x="60" y="590" width="1480" height="92" rx="14" fill="#16213E"/><text x="92" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">In the human buyer's shortlist: 51% start with a chatbot, and comparing vendors is use no. 1 (41%)</text><text x="92" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">G2 (Mar 2026, n=1,076, a review site) · procurement is a decision-maker in 53% of cycles, from the start (Forrester, Jan 2026)</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Certification replaces the questionnaire, not the process. What the machine reads is partly what you publish, partly what you hand over under NDA.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · UpGuard (Oct 2024) · Whistic · Vanta · GitLab (public handbook) · G2 (Apr 2026) · Gartner (May 2026, read in a copy) · Forrester (Jan 2026)</text></svg>