<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">ADMISSIBILITY — BEFORE PREFERENCE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three things cut the set before the machine chooses</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A product that fails here is not a weak competitor: it is absent, and the agent never knew it existed</text><rect x="60.0" y="210" width="470" height="380" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">CUTTER 1</text><text x="86.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A person</text><text x="86.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">with a list</text><line x1="86.0" y1="372" x2="504.0" y2="372" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Writes where the agent may pull</text><text x="86.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">vendors from, out of what the company</text><text x="86.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">already has under contract, what the</text><text x="86.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">platform already catalogues and what</text><text x="86.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">security already reviewed. Never</text><text x="86.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">compares e-mail products. Writes it</text><text x="86.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">six months before the first prompt</text><rect x="565.0" y="210" width="470" height="380" rx="14" fill="#F5EBDD"/><rect x="565.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">CUTTER 2</text><text x="591.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A standard</text><text x="591.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">with a process</text><line x1="591.0" y1="372" x2="1009.0" y2="372" stroke="#B8792E" stroke-width="1.2"/><text x="591.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">ISO/IEC 42001 applies to whoever uses</text><text x="591.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">AI, not only to whoever builds it.</text><text x="591.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Annex A requires a process about</text><text x="591.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">suppliers, not a requirement. The gate</text><text x="591.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">is as concrete as the buyer makes it —</text><text x="591.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">and one named buyer has made it</text><rect x="1070.0" y="210" width="470" height="380" rx="14" fill="#F5E6E2"/><rect x="1070.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">CUTTER 3</text><text x="1096.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Your own past</text><text x="1096.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">in the corpus</text><line x1="1096.0" y1="372" x2="1514.0" y2="372" stroke="#9C4A3C" stroke-width="1.2"/><text x="1096.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The issue, the forum reply and the</text><text x="1096.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">article with the workaround, published</text><text x="1096.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the day of a 2024 defect. The code was</text><text x="1096.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fixed in hours; the material survives</text><text x="1096.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">for years, and it is what the 2025</text><text x="1096.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">model reads. The only cutter the</text><text x="1096.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">vendor controls</text><rect x="60" y="620" width="1480" height="84" rx="14" fill="#16213E"/><text x="92" y="654" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Ahead of Porter's five forces a question is missing: who decides the set, and by what criterion?</text><text x="92" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">On the agent-building side the stage is called tool eligibility (Zhu, May 2026); on the buying side, vendor approval (Wright and Barbour, 1977)</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Losing a sale leaves a trace. Being cut from the set leaves none.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Porter (HBR, 1979) · Zhu (May 2026) · Wright and Barbour (1977) · ISO/IEC 42001:2023, Annex A</text></svg>