<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="840" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">POR QUE O PORTÃO SOBE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A ausência de governança produz o risco que vai justificá-la</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Direção sem medida: nenhum levantamento repete a mesma pergunta em dois anos. O mecanismo, sim, tem número</text><rect x="81.0" y="204" width="340" height="330" rx="14" fill="#F7F8FA"/><rect x="81.0" y="204" width="340" height="7" rx="0" fill="#8B93A1"/><text x="103.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">ONDE ESTÁ A MAIORIA</text><text x="103.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">70%</text><text x="103.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">governança parcial ou informal</text><line x1="103.0" y1="370" x2="399.0" y2="370" stroke="#8B93A1" stroke-width="1.2"/><text x="103.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">30% plenamente governado, 44%</text><text x="103.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">estruturado com monitoramento</text><text x="103.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">limitado, o resto informal ou</text><text x="103.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">individual. Empresas com mais</text><text x="103.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">de 500 pessoas, n=831</text><rect x="447.0" y="204" width="340" height="330" rx="14" fill="#F5E6E2"/><rect x="447.0" y="204" width="340" height="7" rx="0" fill="#9C4A3C"/><text x="469.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">O PACOTE QUE NÃO EXISTE</text><text x="469.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">5,2%</text><text x="469.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">a 21,7% conforme o modelo, 2025</text><line x1="469.0" y1="370" x2="765.0" y2="370" stroke="#9C4A3C" stroke-width="1.2"/><text x="469.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">205.474 nomes únicos inventados</text><text x="469.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">em 576 mil amostras. Em 2026,</text><text x="469.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">4,62% – 6,10% nos modelos de</text><text x="469.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fronteira; 127 nomes que cinco</text><text x="469.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">modelos inventam igual</text><rect x="813.0" y="204" width="340" height="330" rx="14" fill="#F5EBDD"/><rect x="813.0" y="204" width="340" height="7" rx="0" fill="#B8792E"/><text x="835.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">O QUE A EMPRESA NÃO VÊ</text><text x="835.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">69%</text><text x="835.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">suspeitam de uso proibido de IA</text><line x1="835.0" y1="370" x2="1131.0" y2="370" stroke="#B8792E" stroke-width="1.2"/><text x="835.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Líderes de segurança, n=302</text><text x="835.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(Gartner, 2025). Entre</text><text x="835.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">desenvolvedores, 35% acessam</text><text x="835.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">IA por conta pessoal</text><text x="835.0" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(Sonar, jan/2026)</text><rect x="1179.0" y="204" width="340" height="330" rx="14" fill="#E7EEF4"/><rect x="1179.0" y="204" width="340" height="7" rx="0" fill="#2F5D8A"/><text x="1201.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">QUEM CADASTROU O AGENTE</text><text x="1201.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="50" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">10%</text><text x="1201.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">com governança de identidade para agentes</text><line x1="1201.0" y1="370" x2="1497.0" y2="370" stroke="#2F5D8A" stroke-width="1.2"/><text x="1201.0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A empresa sabe que tem agentes</text><text x="1201.0" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">rodando, não sabe quantos, e</text><text x="1201.0" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">não sabe o que eles podem</text><text x="1201.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conectar (Okta, 2026)</text><rect x="60" y="562" width="1480" height="84" rx="14" fill="#16213E"/><text x="800.0" y="598" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">O incidente chega à mesa de alguém, e a resposta é escrever a lista</text><text x="800.0" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Quem escreve tem nome e cargo, quase nunca é um comitê: presidente, conselho executivo, quem administra a plataforma</text><rect x="60" y="688" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="688" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="727" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Quem vende para essa empresa hoje está vendendo para uma lista que ainda não foi escrita.</text><line x1="60" y1="774" x2="1540" y2="774" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Black Duck (jun/2026) · Spracklen et al. (USENIX Security 2025) · Churilov (mai/2026) · Gartner via Infosecurity (nov/2025) · Sonar · Okta</text></svg>