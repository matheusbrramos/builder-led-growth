<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">ADMISSIBILIDADE — ANTES DA PREFERÊNCIA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três coisas cortam o conjunto antes de a máquina escolher</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Um produto reprovado aqui não é concorrente fraco: é ausente, e o agente nunca soube que ele existia</text><rect x="60.0" y="210" width="470" height="380" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">CORTADOR 1</text><text x="86.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Uma pessoa</text><text x="86.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">com uma lista</text><line x1="86.0" y1="372" x2="504.0" y2="372" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Escreve de onde o agente pode</text><text x="86.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">puxar fornecedores, a partir do que</text><text x="86.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a empresa já tem contrato, do que a</text><text x="86.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">plataforma já cataloga e do que a</text><text x="86.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">segurança já revisou. Nunca compara</text><text x="86.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">produtos de e-mail. Escreve seis</text><text x="86.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">meses antes do primeiro prompt</text><rect x="565.0" y="210" width="470" height="380" rx="14" fill="#F5EBDD"/><rect x="565.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">CORTADOR 2</text><text x="591.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Uma norma</text><text x="591.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">com um processo</text><line x1="591.0" y1="372" x2="1009.0" y2="372" stroke="#B8792E" stroke-width="1.2"/><text x="591.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">ISO/IEC 42001 vale para quem usa IA,</text><text x="591.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">não só para quem desenvolve. O Anexo</text><text x="591.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A manda existir um processo sobre</text><text x="591.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fornecedor, não uma exigência. O</text><text x="591.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">portão é tão concreto quanto o</text><text x="591.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">comprador o fizer — e um comprador</text><text x="591.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">nomeado já o fez</text><rect x="1070.0" y="210" width="470" height="380" rx="14" fill="#F5E6E2"/><rect x="1070.0" y="210" width="470" height="380" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">CORTADOR 3</text><text x="1096.0" y="304" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O seu passado</text><text x="1096.0" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">no corpus</text><line x1="1096.0" y1="372" x2="1514.0" y2="372" stroke="#9C4A3C" stroke-width="1.2"/><text x="1096.0" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A issue, a resposta no fórum e o</text><text x="1096.0" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">artigo com a solução alternativa,</text><text x="1096.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">publicados no dia de um defeito de</text><text x="1096.0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">2024. O código foi corrigido em</text><text x="1096.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">horas; o material sobrevive por anos,</text><text x="1096.0" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e é ele que o modelo de 2025 lê.</text><text x="1096.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">É o único que o fornecedor controla</text><rect x="60" y="620" width="1480" height="84" rx="14" fill="#16213E"/><text x="92" y="654" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Antes das cinco forças de Porter falta uma pergunta: quem decide o conjunto, e com que critério?</text><text x="92" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Do lado de quem constrói agentes o estágio se chama tool eligibility (Zhu, mai/2026); do lado de quem compra, homologação de fornecedores (Wright e Barbour, 1977)</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Perder uma venda deixa rastro. Ser cortado do conjunto não deixa nenhum.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Porter (HBR, 1979) · Zhu (mai/2026) · Wright e Barbour (1977) · ISO/IEC 42001:2023, Anexo A</text></svg>