<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHO CUTS: THE PERSON, AND THE TWO LISTS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The procurement list feeds the agent's list, and nobody compares products in either</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The second barely exists yet; most companies sit in the middle, where the list exists and does not close everything</text><rect x="60" y="200" width="630" height="400" rx="14" fill="#F7F8FA"/><rect x="60" y="200" width="630" height="400" rx="14" fill="none" stroke="#16213E" stroke-width="2"/><text x="86" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="2">LIST 1</text><text x="86" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The procurement list</text><text x="86" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">written by procurement, security and legal — nobody who will use the service</text><line x1="86" y1="346" x2="664" y2="346" stroke="#16213E" stroke-width="1.2"/><rect x="80" y="366" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">WHAT IT ASKS</text><text x="96" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Is there an audit report? Where is the data kept? What is done with it?</text><rect x="80" y="440" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">WHAT IT DOES NOT ASK</text><text x="96" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Whether the e-mail service delivers better than the competitor's</text><rect x="80" y="514" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="96" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start" letter-spacing="1.5">HOW FAR IT REACHES</text><text x="96" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">81% of SaaS spend is business units'; IT, 15%; the card, 4%</text><rect x="910" y="200" width="630" height="400" rx="14" fill="#E7EEF4"/><rect x="910" y="200" width="630" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="936" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">LIST 2</text><text x="936" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The agent's list</text><text x="936" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">written by whoever administers the platform or the editor</text><line x1="936" y1="346" x2="1514" y2="346" stroke="#2F5D8A" stroke-width="1.2"/><rect x="930" y="366" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">WHERE IT LIVES</text><text x="946" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Copilot, Claude Code, Cursor (Enterprise), Codex: MCP server by identity</text><rect x="930" y="440" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">WHAT THE DOCS WARN</text><text x="946" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">"Not a security boundary" (Cursor); the open API goes around it</text><rect x="930" y="514" width="590" height="62" rx="10" fill="#FFFFFF"/><text x="946" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">HOW MANY COMPANIES HAVE ONE</text><text x="946" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">10% have governance for non-human identities; 58%: concern no. 1</text><line x1="700" y1="400.0" x2="900" y2="400.0" stroke="#2F5D8A" stroke-width="4"/><polygon points="902,400 880,386 880,414" fill="#2F5D8A"/><text x="800.0" y="356.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">THE FIRST</text><text x="800.0" y="374.0" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">FEEDS THE SECOND</text><rect x="60" y="626" width="1480" height="92" rx="14" fill="#16213E"/><text x="92" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Full governance at 30% of engineering teams; 47% of large enterprises without full visibility</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Black Duck and UserEvidence (Jun 2026, n=831, security vendor) · Protiviti (May 2026, consultancy) · Zylo (Jan 2026, own base) · Okta (2026)</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">The e-mail vendor already in the cloud contract enters the agent's list without anyone comparing anything.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Cursor and OpenAI (official docs, Sep 2026) · Zylo · Okta · Black Duck · Protiviti</text></svg>