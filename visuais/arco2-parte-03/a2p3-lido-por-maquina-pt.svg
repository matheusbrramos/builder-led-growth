<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O PORTÃO LIDO POR MÁQUINA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O questionário que o fornecedor responde com IA é lido pela IA do comprador</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Produto vendido desde outubro de 2024, não previsão. A pessoa entra depois, para decidir sobre o que as duas máquinas concordaram</text><rect x="60" y="204" width="560" height="360" rx="14" fill="#E6F0EA"/><rect x="60" y="204" width="560" height="360" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="86" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">LADO DO FORNECEDOR</text><text x="86" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A IA responde o questionário</text><text x="86" y="364" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">98%</text><text x="86" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">das sugestões aceitas (UpGuard); 95% de aceitação (Vanta)</text><line x1="86" y1="416" x2="594" y2="416" stroke="#2F7D5D" stroke-width="1.2"/><text x="86" y="446" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Lê o próprio relatório de auditoria</text><text x="86" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">(SOC 2, ISO 27001) e responde o</text><text x="86" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">questionário de cada comprador,</text><text x="86" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">dezenas de vezes por ano. Os</text><text x="86" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">percentuais são das próprias</text><text x="86" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">empresas que vendem a ferramenta</text><rect x="980" y="204" width="560" height="360" rx="14" fill="#E7EEF4"/><rect x="980" y="204" width="560" height="360" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1006" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">LADO DO COMPRADOR</text><text x="1006" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A IA lê o relatório</text><text x="1006" y="364" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">77%</text><text x="1006" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">de um questionário de 100+ perguntas preenchido a partir do SOC 2</text><line x1="1006" y1="416" x2="1514" y2="416" stroke="#2F5D8A" stroke-width="1.2"/><text x="1006" y="446" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Agentes que "leem evidência do</text><text x="1006" y="468" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fornecedor, respondem controles</text><text x="1006" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">com citações" e apontam o que</text><text x="1006" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">aprovar ou escalar (Whistic).</text><text x="1006" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Primeira pergunta de IA de um</text><text x="1006" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">comprador: você treina com meu dado?</text><rect x="650.0" y="244" width="300" height="280" rx="14" fill="#FFFFFF"/><rect x="650.0" y="244" width="300" height="280" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><text x="800.0" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="1.5">A DECISÃO</text><text x="800.0" y="360" font-family="Liberation Sans, Arial, sans-serif" font-size="54" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">69%</text><text x="800.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">dos compradores validam</text><text x="800.0" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">o que a IA disse com</text><text x="800.0" y="436" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">um vendedor (Gartner,</text><text x="800.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">n=645). A pessoa decide;</text><text x="800.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">a máquina prepara</text><line x1="628" y1="384.0" x2="642.0" y2="384.0" stroke="#8B93A1" stroke-width="3"/><line x1="958.0" y1="384.0" x2="972" y2="384.0" stroke="#8B93A1" stroke-width="3"/><rect x="60" y="590" width="1480" height="92" rx="14" fill="#16213E"/><text x="92" y="626" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Na lista curta do comprador humano: 51% começam por chatbot, e comparar fornecedores é o uso nº 1 (41%)</text><text x="92" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">G2 (mar/2026, n=1.076, site de avaliações) · compras é decisor em 53% dos ciclos, desde o início (Forrester, jan/2026)</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Certificação substitui o questionário, não o processo. O que a máquina lê é em parte o que você publica, em parte o que você entrega sob NDA.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · UpGuard (out/2024) · Whistic · Vanta · GitLab (manual público) · G2 (abr/2026) · Gartner (mai/2026, lido em cópia) · Forrester (jan/2026)</text></svg>