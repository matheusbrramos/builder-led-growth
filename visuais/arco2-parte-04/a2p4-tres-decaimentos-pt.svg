<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">OS TRÊS DECAIMENTOS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três caminhos de uma tática decair</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Dois todo mundo prevê. O terceiro chega sem aviso: a plataforma absorve a tática e entrega a todo mundo de uma vez</text><rect x="60.0" y="210" width="470" height="400" rx="14" fill="#F5EBDD"/><rect x="60.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">CAMINHO 1</text><text x="86.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O defeito consertado</text><text x="86.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">relógio: o ciclo de versão do harness</text><text x="86.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">VELOCIDADE DO DECAIMENTO</text><rect x="86.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="86.0" y="396" width="188.1" height="12" rx="6" fill="#B8792E"/><line x1="86.0" y1="434" x2="504.0" y2="434" stroke="#B8792E" stroke-width="1.2"/><text x="86.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Previsível: o grupo que mediu o</text><text x="86.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">viés propôs a correção no mesmo</text><text x="86.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">trabalho. A data é que ninguém</text><text x="86.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">anuncia: a tática para de render</text><text x="86.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">sem que nada tenha mudado do</text><text x="86.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">seu lado</text><rect x="565.0" y="210" width="470" height="400" rx="14" fill="#E7EEF4"/><rect x="565.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">CAMINHO 2</text><text x="591.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O concorrente copiando</text><text x="591.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">relógio: o ritmo do que é acumulável</text><text x="591.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">VELOCIDADE DO DECAIMENTO</text><rect x="591.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="591.0" y="396" width="104.5" height="12" rx="6" fill="#2F5D8A"/><line x1="591.0" y1="434" x2="1009.0" y2="434" stroke="#2F5D8A" stroke-width="1.2"/><text x="591.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O mais lento dos três, e o único</text><text x="591.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que a literatura de estratégia já</text><text x="591.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">tratava antes de qualquer agente.</text><text x="591.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Tem freio conhecido: copiar custa,</text><text x="591.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e quanto mais a tática depender de</text><text x="591.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">acúmulo, mais devagar a cópia anda</text><rect x="1070.0" y="210" width="470" height="400" rx="14" fill="#F5E6E2"/><rect x="1070.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">CAMINHO 3</text><text x="1096.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A plataforma absorvendo</text><text x="1096.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">relógio: um lançamento de produto de terceiro</text><text x="1096.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">VELOCIDADE DO DECAIMENTO</text><rect x="1096.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="1096.0" y="396" width="418.0" height="12" rx="6" fill="#9C4A3C"/><line x1="1096.0" y1="434" x2="1514.0" y2="434" stroke="#9C4A3C" stroke-width="1.2"/><text x="1096.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Nenhum concorrente agiu, nenhum</text><text x="1096.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">defeito foi consertado. Em 16 de julho de 2026</text><text x="1096.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o Ghost passou a gerar o llms.txt</text><text x="1096.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e a servir Markdown por URL, como</text><text x="1096.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">recurso nativo — desligado por</text><text x="1096.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">padrão, e ligado em Configurações</text><rect x="60" y="636" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">A absorção não é automática: é uma caixa de seleção, e cada site perde a vantagem na data em que o seu administrador clicou</text><text x="92" y="702" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Para quem vendia a tática como serviço, o mercado não encolheu de uma vez: encolheu em pedaços, sem aviso e sem curva</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">O que a plataforma consegue gerar por você, ela vai gerar — e no dia em que gerar, entrega a todo mundo junto.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Ghost, registro de mudanças (16 de julho de 2026) · First Round, llms.txt conferido em 16 de setembro de 2026 · a data de ativação do site não é pública</text></svg>