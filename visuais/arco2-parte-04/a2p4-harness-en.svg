<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE HARNESS — BEFORE THE MODEL HAS AN OPINION</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three engineering decisions narrow the set before the choice</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The people making all three are not the market, and will never compare your product with your competitor's</text><rect x="60.0" y="210" width="470" height="390" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DECISION 1</text><text x="86.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Catalogue</text><text x="86.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">32.1% → 85.7%</text><text x="86.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">task success, from everything exposed to a filtered menu</text><line x1="86.0" y1="398" x2="504.0" y2="398" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Seven models, three menu sizes and</text><text x="86.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">six filtering methods, with 98% fewer</text><text x="86.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">tokens on the minimum menu. Being in</text><text x="86.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the large catalogue can be worth less</text><text x="86.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">than being in the small menu: the</text><text x="86.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">large catalogue drives down the odds</text><text x="86.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">of anyone being picked properly</text><rect x="565.0" y="210" width="470" height="390" rx="14" fill="#E6F0EA"/><rect x="565.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F7D5D"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">DECISION 2</text><text x="591.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Retrieval</text><text x="591.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">1.4 vs 7.4</text><text x="591.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">candidates seen, embeddings versus BM25, same data</text><line x1="591.0" y1="398" x2="1009.0" y2="398" stroke="#2F7D5D" stroke-width="1.2"/><text x="591.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">5 times as many candidates over the</text><text x="591.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">same dataset, with the same question.</text><text x="591.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Nothing changed in the market or in</text><text x="591.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the product: a search component</text><text x="591.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">changed. Exposing the whole catalogue</text><text x="591.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">gives 13.62% accuracy; searching first</text><text x="591.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">gives 43.13%, with 50% fewer tokens</text><rect x="1070.0" y="210" width="470" height="390" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">DECISION 3</text><text x="1096.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Order</text><text x="1096.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">7 models</text><text x="1096.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">over real APIs grouped by equivalent function</text><line x1="1096.0" y1="398" x2="1514.0" y2="398" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The models either fixate on a single</text><text x="1096.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">provider or disproportionately favour</text><text x="1096.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the tools appearing earlier in the</text><text x="1096.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">context. It is the cleanest example</text><text x="1096.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">of a tactic that works today and will</text><text x="1096.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">not last — because what it exploits</text><text x="1096.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">is called bias</text><rect x="60" y="628" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Whoever writes the harness defines catalogue, order and retrieval — and is, in part, also a selectable product</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">A description of position, not of conduct: the precedent is app stores and operating systems, with the difference that this layer is opaque and probabilistic</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">The size of the shortlist you compete in is not a property of your market: it is a decision made by whoever assembled the agent.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Babu and Iyer (Jun 2026, preprint) · Gan and Sun (May 2025, preprint) · Repantis et al. (May 2026, preprint) · Blankenstein et al. (ICLR 2026)</text></svg>