<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O CRITÉRIO — A ESPINHA DA PEÇA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Tática que explora a implementação decai; tática que explora a estrutura fica</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Viés de posição é defeito, e defeito é consertado. Alinhamento semântico entre pedido e descrição não é defeito, e não vai ser corrigido</text><rect x="60" y="200" width="730" height="176" rx="14" fill="#F5E6E2"/><rect x="60" y="200" width="730" height="176" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="88" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">EXPLORA A IMPLEMENTAÇÃO ATUAL</text><text x="88" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Decai quando consertam</text><text x="88" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A tática de otimizar para a posição e a correção que a destrói</text><text x="88" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">nasceram no mesmo artigo, com poucas páginas de distância:</text><text x="88" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">filtrar para o subconjunto relevante e amostrar uniformemente</text><rect x="810" y="200" width="730" height="176" rx="14" fill="#E6F0EA"/><rect x="810" y="200" width="730" height="176" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="838" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">EXPLORA A ESTRUTURA DO JOGO</text><text x="838" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Sobrevive à mudança</text><text x="838" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Alinhamento semântico entre o que o usuário pediu e o metadado</text><text x="838" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">da ferramenta é o fator mais forte da seleção. Corrigir a ordem</text><text x="838" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">torna o alinhamento MAIS decisivo, não menos</text><rect x="60.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="60.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="86.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">PERGUNTA 1</text><text x="86.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quem construiu o</text><text x="86.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">mecanismo chamaria</text><text x="86.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">isso de defeito?</text><line x1="86.0" y1="578" x2="504.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="86.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Se sim, você está com prazo de</text><text x="86.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">validade. Viés de posição,</text><text x="86.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">degradação por catálogo grande e</text><text x="86.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">sensibilidade a formatação são</text><text x="86.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">defeitos, e há equipes pagas</text><text x="86.0" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">para consertá-los</text><rect x="565.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="565.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="565.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="591.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">PERGUNTA 2</text><text x="591.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A vantagem some se</text><text x="591.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">todo mundo fizer</text><text x="591.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">igual?</text><line x1="591.0" y1="578" x2="1009.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="591.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Se sim, é vantagem de escassez,</text><text x="591.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">não de estrutura. Ela dura</text><text x="591.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">enquanto poucos souberem, e o</text><text x="591.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">relógio dela é o da difusão da</text><text x="591.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">notícia, não o do seu roteiro</text><text x="591.0" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">de produto</text><rect x="1070.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="1070.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="1070.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="1096.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">PERGUNTA 3</text><text x="1096.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A tática continua</text><text x="1096.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">fazendo sentido se o</text><text x="1096.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">mecanismo virar outro?</text><line x1="1096.0" y1="578" x2="1514.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="1096.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Descrever com precisão o que o</text><text x="1096.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">produto faz vale para busca,</text><text x="1096.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">para agente, para catálogo de</text><text x="1096.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">plataforma e para a pessoa que</text><text x="1096.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">lê a documentação. Vale no dia</text><text x="1096.0" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">em que nada disso existir assim</text><rect x="60" y="702" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="702" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Ninguém publicou quanto tempo dura a vantagem de uma tática: o critério serve para decidir, não para prever data.</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Uma ferramenta escolhida porque a descrição dela é inequívoca continua sendo escolhida depois do conserto.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Blankenstein et al., BiasBusters (ICLR 2026) — o achado, a ressalva e a própria correção estão no mesmo artigo</text></svg>