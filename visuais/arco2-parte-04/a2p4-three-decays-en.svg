<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE THREE DECAYS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three paths for a tactic to decay</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Everyone sees two coming. The third arrives unannounced: the platform absorbs the tactic and hands it to everybody at once</text><rect x="60.0" y="210" width="470" height="400" rx="14" fill="#F5EBDD"/><rect x="60.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">PATH 1</text><text x="86.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The patched defect</text><text x="86.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">clock: the harness release cycle</text><text x="86.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">SPEED OF THE DECAY</text><rect x="86.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="86.0" y="396" width="188.1" height="12" rx="6" fill="#B8792E"/><line x1="86.0" y1="434" x2="504.0" y2="434" stroke="#B8792E" stroke-width="1.2"/><text x="86.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Predictable: the group that measured</text><text x="86.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the bias proposed the fix in the</text><text x="86.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">same work. Only the date goes</text><text x="86.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">unannounced: the tactic stops paying</text><text x="86.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">with nothing having changed on</text><text x="86.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">your side</text><rect x="565.0" y="210" width="470" height="400" rx="14" fill="#E7EEF4"/><rect x="565.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">PATH 2</text><text x="591.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The competitor copying</text><text x="591.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">clock: the pace of what can be accumulated</text><text x="591.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">SPEED OF THE DECAY</text><rect x="591.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="591.0" y="396" width="104.5" height="12" rx="6" fill="#2F5D8A"/><line x1="591.0" y1="434" x2="1009.0" y2="434" stroke="#2F5D8A" stroke-width="1.2"/><text x="591.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The slowest of the three, and the</text><text x="591.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">only one strategy literature already</text><text x="591.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">handled before any agent existed. It</text><text x="591.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">has a known brake: copying costs, and</text><text x="591.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the more a tactic depends on what is</text><text x="591.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">accumulated, the slower the copy moves</text><rect x="1070.0" y="210" width="470" height="400" rx="14" fill="#F5E6E2"/><rect x="1070.0" y="210" width="470" height="400" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">PATH 3</text><text x="1096.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The platform absorbing</text><text x="1096.0" y="342" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">clock: somebody else's product launch</text><text x="1096.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">SPEED OF THE DECAY</text><rect x="1096.0" y="396" width="418" height="12" rx="6" fill="#FFFFFF"/><rect x="1096.0" y="396" width="418.0" height="12" rx="6" fill="#9C4A3C"/><line x1="1096.0" y1="434" x2="1514.0" y2="434" stroke="#9C4A3C" stroke-width="1.2"/><text x="1096.0" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">No competitor acted, no defect was</text><text x="1096.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">patched. On 16 July 2026 Ghost began</text><text x="1096.0" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">generating llms.txt and serving</text><text x="1096.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Markdown by URL as a native feature —</text><text x="1096.0" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">shipped off by default, and turned</text><text x="1096.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">on in Settings</text><rect x="60" y="636" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Absorption is not automatic: it is a checkbox, and each site loses the advantage on the date its administrator clicked</text><text x="92" y="702" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">For anyone selling the tactic as a service, the market did not shrink all at once: it shrank in pieces, with no warning and no curve</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Whatever a platform can generate for you, it will generate — and on the day it does, it hands it to everybody at once.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Ghost changelog (16 July 2026) · First Round llms.txt checked on 16 September 2026 · the site's activation date is not public</text></svg>