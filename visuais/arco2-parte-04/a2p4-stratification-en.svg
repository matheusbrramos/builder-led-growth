<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT DECIDES AMONG THOSE LEFT</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Same question, different buyers, and the set only moves for whoever does not lead</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">2,000 runs across 10 buyer personas, 8 prompts and 3 model configurations — the design's first prompt is "best CRM software"</text><rect x="60" y="206" width="630" height="380" rx="14" fill="#E6F0EA"/><rect x="60" y="206" width="630" height="380" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="206" width="630" height="7" rx="0" fill="#2F7D5D"/><text x="88" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">CATEGORY LEADER</text><text x="88" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Persona-resistant</text><text x="88" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">80%</text><text x="88" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">same-brand consistency from one buyer to the next</text><line x1="88" y1="426" x2="662" y2="426" stroke="#2F7D5D" stroke-width="1.2"/><text x="88" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Whoever is already the category</text><text x="88" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">default is barely contested. The</text><text x="88" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">model's memory holds them up, and</text><text x="88" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">repeated exposure to a single API</text><text x="88" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">endpoint in pre-training amplifies</text><text x="88" y="568" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the bias in that provider's favour</text><rect x="910" y="206" width="630" height="380" rx="14" fill="#F5E6E2"/><rect x="910" y="206" width="630" height="380" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="910" y="206" width="630" height="7" rx="0" fill="#9C4A3C"/><text x="938" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">MID-MARKET BRAND</text><text x="938" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Swapped out</text><text x="938" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">75%</text><text x="938" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">of the set swapped as the asking persona changes</text><line x1="938" y1="426" x2="1512" y2="426" stroke="#9C4A3C" stroke-width="1.2"/><text x="938" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Three out of every four times</text><text x="938" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">someone with a different context</text><text x="938" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">asks the same question, you drop</text><text x="938" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">out of the set. Not on merit, not</text><text x="938" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">by comparison: because your place</text><text x="938" y="568" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">was never firm</text><rect x="712" y="302" width="176" height="190" rx="12" fill="#F7F8FA"/><rect x="712" y="302" width="176" height="5" rx="0" fill="#16213E"/><text x="800.0" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">A BUYER PERSONA</text><text x="800.0" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">IN THE PROMPT</text><text x="800.0" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">drops the similarity</text><text x="800.0" y="423" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">between the sets</text><text x="800.0" y="444" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">by 0.12 to 0.20 points</text><text x="800.0" y="465" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">(Jaccard index)</text><rect x="60" y="612" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Text moves the choice when the model has nothing else to work with — and moves it less the more the model already holds</text><text x="92" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">With identical specifications, the brand owning the word the request asked for was chosen in 100% of runs on the smaller model and between 63% and 95% on the larger (own measurement, 1 September 2026)</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Popular libraries used in up to 45% of cases where they were not required; Python dominant in 58% of tasks where it is not the right choice.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Jack, Lehman, Maloney and Xu (May 2026, audit preprint) · Twist et al. (Findings of ACL 2026, 8 models) · Blankenstein et al. (ICLR 2026)</text></svg>