<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O HARNESS — ANTES DE O MODELO OPINAR</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três decisões de engenharia estreitam o conjunto antes da escolha</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quem toma as três não é o mercado, e nunca vai comparar o seu produto com o do concorrente</text><rect x="60.0" y="210" width="470" height="390" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DECISÃO 1</text><text x="86.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Catálogo</text><text x="86.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">32,1% → 85,7%</text><text x="86.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">sucesso de tarefa, de tudo exposto a menu filtrado</text><line x1="86.0" y1="398" x2="504.0" y2="398" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Sete modelos, três tamanhos de menu</text><text x="86.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e seis métodos de filtragem, com</text><text x="86.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">98% menos tokens no menu mínimo.</text><text x="86.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Estar no catálogo grande pode valer</text><text x="86.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">menos que estar no menu pequeno:</text><text x="86.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o catálogo grande derruba a chance</text><text x="86.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">de qualquer um ser escolhido direito</text><rect x="565.0" y="210" width="470" height="390" rx="14" fill="#E6F0EA"/><rect x="565.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F7D5D"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">DECISÃO 2</text><text x="591.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Recuperação</text><text x="591.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">1,4 vs 7,4</text><text x="591.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">candidatos vistos, embeddings contra BM25, mesmos dados</text><line x1="591.0" y1="398" x2="1009.0" y2="398" stroke="#2F7D5D" stroke-width="1.2"/><text x="591.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">5 vezes mais candidatos sobre o</text><text x="591.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">mesmo conjunto de dados, com a mesma</text><text x="591.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">pergunta. Nada mudou no mercado nem</text><text x="591.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">no produto: mudou um componente de</text><text x="591.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">busca. Expor o catálogo inteiro dá</text><text x="591.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">13,62% de acurácia; buscar antes dá</text><text x="591.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">43,13%, com 50% menos tokens</text><rect x="1070.0" y="210" width="470" height="390" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="210" width="470" height="390" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">DECISÃO 3</text><text x="1096.0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Ordem</text><text x="1096.0" y="352" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">7 modelos</text><text x="1096.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">sobre APIs reais agrupadas por função equivalente</text><line x1="1096.0" y1="398" x2="1514.0" y2="398" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="430" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Os modelos ou fixam num único</text><text x="1096.0" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fornecedor ou favorecem</text><text x="1096.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">desproporcionalmente as ferramentas</text><text x="1096.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que aparecem mais cedo no contexto.</text><text x="1096.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">É o exemplo mais limpo de tática</text><text x="1096.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que funciona hoje e não vai durar —</text><text x="1096.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">porque isso se chama viés</text><rect x="60" y="628" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Quem escreve o harness define catálogo, ordem e recuperação — e em parte também é produto selecionável</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Descrição de posição, não de conduta: o precedente é loja de aplicativo e sistema operacional, com a diferença de a camada aqui ser opaca e probabilística</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O tamanho da lista curta em que você disputa não é propriedade do seu mercado: é decisão de quem montou o agente.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Babu e Iyer (jun/2026, preprint) · Gan e Sun (mai/2025, preprint) · Repantis et al. (mai/2026, preprint) · Blankenstein et al. (ICLR 2026)</text></svg>