<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE CRITERION — THE SPINE OF THE PIECE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A tactic exploiting the implementation decays; one exploiting the structure lasts</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Position bias is a defect, and defects get patched. Semantic alignment between request and description is not a defect, and will not be corrected</text><rect x="60" y="200" width="730" height="176" rx="14" fill="#F5E6E2"/><rect x="60" y="200" width="730" height="176" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><text x="88" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">EXPLOITS THE CURRENT IMPLEMENTATION</text><text x="88" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Decays when patched</text><text x="88" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The tactic of optimising for position and the correction that</text><text x="88" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">destroys it were born in the same paper, a few pages apart:</text><text x="88" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">filter to the relevant subset, then sample uniformly</text><rect x="810" y="200" width="730" height="176" rx="14" fill="#E6F0EA"/><rect x="810" y="200" width="730" height="176" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="838" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">EXPLOITS THE STRUCTURE OF THE GAME</text><text x="838" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Survives the change</text><text x="838" y="324" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Semantic alignment between what the user asked for and the</text><text x="838" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">tool's metadata is the strongest driver of selection. Fixing the</text><text x="838" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">ordering makes alignment MORE decisive, not less</text><rect x="60.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="60.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="86.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">QUESTION 1</text><text x="86.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Would whoever built</text><text x="86.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">the mechanism call</text><text x="86.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">this a defect?</text><line x1="86.0" y1="578" x2="504.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="86.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">If yes, you are on borrowed time.</text><text x="86.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Position bias, degradation under a</text><text x="86.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">large catalogue and sensitivity to</text><text x="86.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">prompt formatting are defects, and</text><text x="86.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">there are teams paid to fix them</text><rect x="565.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="565.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="565.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="591.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">QUESTION 2</text><text x="591.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Does the advantage</text><text x="591.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">vanish if everyone</text><text x="591.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">does the same?</text><line x1="591.0" y1="578" x2="1009.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="591.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">If yes, it is an advantage of</text><text x="591.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">scarcity, not of structure. It</text><text x="591.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">lasts as long as few people know,</text><text x="591.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and its clock is the spread of the</text><text x="591.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">news, not your product roadmap</text><rect x="1070.0" y="410" width="470" height="268" rx="14" fill="#F7F8FA"/><rect x="1070.0" y="410" width="470" height="268" rx="14" fill="none" stroke="#DEE2E7" stroke-width="1.5"/><rect x="1070.0" y="410" width="6" height="268" rx="0" fill="#2F5D8A"/><text x="1096.0" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">QUESTION 3</text><text x="1096.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Does it still make</text><text x="1096.0" y="517" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">sense if the mechanism</text><text x="1096.0" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">becomes something else?</text><line x1="1096.0" y1="578" x2="1514.0" y2="578" stroke="#DEE2E7" stroke-width="1.2"/><text x="1096.0" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Describing precisely what a product</text><text x="1096.0" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">does holds for search, for agents,</text><text x="1096.0" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">for a platform catalogue and for the</text><text x="1096.0" y="665" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">person reading the docs. It holds on</text><text x="1096.0" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the day none of those exist this way</text><rect x="60" y="702" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="702" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Nobody has published how long a tactic's advantage lasts: the criterion is good for deciding, not for predicting a date.</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">A tool chosen because its description is unambiguous keeps being chosen after the patch.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Blankenstein et al., BiasBusters (ICLR 2026) — the finding, the caveat and the correction itself are in the same paper</text></svg>