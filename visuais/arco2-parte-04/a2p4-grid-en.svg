<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1150" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1150" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT TO DO FIRST</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Horizon and durability are two axes, not one</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Horizon answers when the effect shows up; durability answers whether it survives the mechanism changing</text><rect x="262" y="204" width="635" height="38" rx="8" fill="#2F7D5D"/><text x="579.5" y="229" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SURVIVES THE PATCH</text><rect x="917" y="204" width="635" height="38" rx="8" fill="#9C4A3C"/><text x="1234.5" y="229" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">DECAYS WHEN PATCHED</text><rect x="60" y="254" width="186" height="272" rx="12" fill="#F7F8FA"/><rect x="60" y="254" width="6" height="272" rx="0" fill="#16213E"/><text x="82" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Fast</text><text x="82" y="335" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">effect</text><text x="82" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">days to weeks</text><rect x="262" y="254" width="635" height="272" rx="12" fill="#E6F0EA"/><rect x="262" y="254" width="635" height="272" rx="12" fill="none" stroke="#2F7D5D" stroke-width="1.8"/><text x="286" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Do this first</text><line x1="286" y1="318" x2="873" y2="318" stroke="#2F7D5D" stroke-width="1.2"/><text x="286" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Unambiguous description where the agent reads</text><text x="286" y="369" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A single definition of the product, in the same words</text><text x="286" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Letting someone start without talking to a person</text><text x="286" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Canonical documentation at one address</text><text x="286" y="432" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Measuring and publishing the pair's friction</text><text x="286" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="286" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Best ratio of effort to permanence in the arc</text><rect x="917" y="254" width="635" height="272" rx="12" fill="#F5E6E2"/><rect x="917" y="254" width="635" height="272" rx="12" fill="none" stroke="#9C4A3C" stroke-width="1.8"/><text x="941" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Use knowingly, with the expiry written down</text><line x1="941" y1="318" x2="1528" y2="318" stroke="#9C4A3C" stroke-width="1.2"/><text x="941" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Position in the catalogue</text><text x="941" y="369" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Being few tools rather than many</text><text x="941" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Anything exploiting selection bias</text><text x="941" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A format only today's harness reads that way</text><text x="941" y="432" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="941" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Where nearly all current commentary lives. The mistake</text><text x="941" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">is not executing: it is not marking the expiry</text><rect x="60" y="590" width="186" height="272" rx="12" fill="#F7F8FA"/><rect x="60" y="590" width="6" height="272" rx="0" fill="#16213E"/><text x="82" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Slow</text><text x="82" y="671" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">effect</text><text x="82" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">months, or the model's</text><text x="82" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">next training run</text><rect x="262" y="590" width="635" height="272" rx="12" fill="#E6F0EA"/><rect x="262" y="590" width="635" height="272" rx="12" fill="none" stroke="#2F7D5D" stroke-width="1.8"/><text x="286" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">The real investment</text><line x1="286" y1="654" x2="873" y2="654" stroke="#2F7D5D" stroke-width="1.2"/><text x="286" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Accumulated corpus presence</text><text x="286" y="705" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Comparative material written by a third party</text><text x="286" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Becoming the default way to solve the problem</text><text x="286" y="747" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Getting into the corporate vendor registry</text><text x="286" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Certification</text><text x="286" y="789" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="286" y="810" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The only quadrant that needs a budget defence</text><rect x="917" y="590" width="635" height="272" rx="12" fill="#F5E6E2"/><rect x="917" y="590" width="635" height="272" rx="12" fill="none" stroke="#9C4A3C" stroke-width="1.8"/><text x="941" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Avoid</text><line x1="941" y1="654" x2="1528" y2="654" stroke="#9C4A3C" stroke-width="1.2"/><text x="941" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Costs months and dies with the change.</text><text x="941" y="705" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="941" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">No use.</text><line x1="579.5" y1="538" x2="579.5" y2="570" stroke="#2F5D8A" stroke-width="4"/><polygon points="579,584 566,564 592,564" fill="#2F5D8A"/><text x="605.5" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">FUNDS</text><rect x="60" y="888" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="924" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Fund the slow with the fast: the first quadrant produces an effect on acquisition cost inside the quarter the company measures</text><text x="92" y="954" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Anyone trying to approve the slow investment without the fast one in front is asking for faith; anyone executing only the fast one builds an advantage that expires</text><rect x="60" y="998" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="998" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="1037" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Legibility becomes a commodity. Consistency does not — no generator produces the same definition repeated over years.</text><line x1="60" y1="1084" x2="1540" y2="1084" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="1110" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the right-hand column is made of properties of today's mechanism; the left-hand one, of the product and what is known of it</text></svg>