<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1150" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1150" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE FAZER PRIMEIRO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Horizonte e durabilidade são dois eixos, não um</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Horizonte responde quando o efeito aparece; durabilidade responde se ele sobrevive ao mecanismo mudar</text><rect x="262" y="204" width="635" height="38" rx="8" fill="#2F7D5D"/><text x="579.5" y="229" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SOBREVIVE AO CONSERTO</text><rect x="917" y="204" width="635" height="38" rx="8" fill="#9C4A3C"/><text x="1234.5" y="229" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">DECAI QUANDO CONSERTAM</text><rect x="60" y="254" width="186" height="272" rx="12" fill="#F7F8FA"/><rect x="60" y="254" width="6" height="272" rx="0" fill="#16213E"/><text x="82" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Efeito</text><text x="82" y="335" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">rápido</text><text x="82" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">dias a semanas</text><rect x="262" y="254" width="635" height="272" rx="12" fill="#E6F0EA"/><rect x="262" y="254" width="635" height="272" rx="12" fill="none" stroke="#2F7D5D" stroke-width="1.8"/><text x="286" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Fazer primeiro</text><line x1="286" y1="318" x2="873" y2="318" stroke="#2F7D5D" stroke-width="1.2"/><text x="286" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Descrição inequívoca no lugar onde o agente lê</text><text x="286" y="369" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Uma única definição do produto, com as mesmas palavras</text><text x="286" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Começar sem falar com uma pessoa</text><text x="286" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Documentação canônica num endereço só</text><text x="286" y="432" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Medir e publicar o atrito do par</text><text x="286" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="286" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Melhor relação entre esforço e permanência do arco</text><rect x="917" y="254" width="635" height="272" rx="12" fill="#F5E6E2"/><rect x="917" y="254" width="635" height="272" rx="12" fill="none" stroke="#9C4A3C" stroke-width="1.8"/><text x="941" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Usar sabendo, com a validade anotada</text><line x1="941" y1="318" x2="1528" y2="318" stroke="#9C4A3C" stroke-width="1.2"/><text x="941" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Posição no catálogo</text><text x="941" y="369" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ser poucas ferramentas em vez de muitas</text><text x="941" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Qualquer coisa que explore viés de seleção</text><text x="941" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Formato que só o harness de hoje lê assim</text><text x="941" y="432" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="941" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">É onde mora quase todo o conteúdo corrente sobre</text><text x="941" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o assunto. O erro não é executar: é não marcar o prazo</text><rect x="60" y="590" width="186" height="272" rx="12" fill="#F7F8FA"/><rect x="60" y="590" width="6" height="272" rx="0" fill="#16213E"/><text x="82" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Efeito</text><text x="82" y="671" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">lento</text><text x="82" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">meses, ou o treino</text><text x="82" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">seguinte do modelo</text><rect x="262" y="590" width="635" height="272" rx="12" fill="#E6F0EA"/><rect x="262" y="590" width="635" height="272" rx="12" fill="none" stroke="#2F7D5D" stroke-width="1.8"/><text x="286" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">O investimento real</text><line x1="286" y1="654" x2="873" y2="654" stroke="#2F7D5D" stroke-width="1.2"/><text x="286" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Presença acumulada no corpus</text><text x="286" y="705" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Material comparativo escrito por terceiro</text><text x="286" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Virar o jeito padrão de resolver o problema</text><text x="286" y="747" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Entrar no registro corporativo de fornecedores</text><text x="286" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Certificação</text><text x="286" y="789" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="286" y="810" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O único quadrante que precisa de defesa orçamentária</text><rect x="917" y="590" width="635" height="272" rx="12" fill="#F5E6E2"/><rect x="917" y="590" width="635" height="272" rx="12" fill="none" stroke="#9C4A3C" stroke-width="1.8"/><text x="941" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Evitar</text><line x1="941" y1="654" x2="1528" y2="654" stroke="#9C4A3C" stroke-width="1.2"/><text x="941" y="684" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Custa meses e morre com a mudança.</text><text x="941" y="705" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start"></text><text x="941" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Não tem uso.</text><line x1="579.5" y1="538" x2="579.5" y2="570" stroke="#2F5D8A" stroke-width="4"/><polygon points="579,584 566,564 592,564" fill="#2F5D8A"/><text x="605.5" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">FINANCIA</text><rect x="60" y="888" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="924" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Financiar o lento com o rápido: o primeiro quadrante produz efeito no custo de aquisição dentro do trimestre que a empresa mede</text><text x="92" y="954" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Quem tenta aprovar o investimento lento sem o rápido na frente está pedindo fé; quem executa só o rápido está construindo uma vantagem que expira</text><rect x="60" y="998" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="998" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="1037" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">A legibilidade vira commodity. A consistência não — nenhum gerador produz a mesma definição repetida por anos.</text><line x1="60" y1="1084" x2="1540" y2="1084" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="1110" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · a coluna da direita é feita de propriedades do mecanismo de hoje; a da esquerda, do produto e do que se sabe dele</text></svg>