<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE DECIDE ENTRE OS QUE SOBRARAM</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A mesma pergunta, compradores diferentes, e o conjunto só se mexe para quem não lidera</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">2.000 execuções sobre 10 perfis de comprador, 8 perguntas e 3 configurações de modelo — a primeira pergunta do desenho é "best CRM software"</text><rect x="60" y="206" width="630" height="380" rx="14" fill="#E6F0EA"/><rect x="60" y="206" width="630" height="380" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="206" width="630" height="7" rx="0" fill="#2F7D5D"/><text x="88" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">LÍDER DE CATEGORIA</text><text x="88" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Resistente ao perfil</text><text x="88" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">80%</text><text x="88" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">de consistência de marca de um comprador para o outro</text><line x1="88" y1="426" x2="662" y2="426" stroke="#2F7D5D" stroke-width="1.2"/><text x="88" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Quem já é o padrão da categoria</text><text x="88" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">quase não é disputado. A memória</text><text x="88" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">do modelo o sustenta, e exposição</text><text x="88" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">repetida a um mesmo endereço de API</text><text x="88" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">no pré-treino amplifica o viés a</text><text x="88" y="568" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">favor daquele fornecedor</text><rect x="910" y="206" width="630" height="380" rx="14" fill="#F5E6E2"/><rect x="910" y="206" width="630" height="380" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="910" y="206" width="630" height="7" rx="0" fill="#9C4A3C"/><text x="938" y="256" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">MARCA DE MEIO DE MERCADO</text><text x="938" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Troca de lugar</text><text x="938" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="62" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">75%</text><text x="938" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">do conjunto trocado conforme o perfil de quem pergunta muda</text><line x1="938" y1="426" x2="1512" y2="426" stroke="#9C4A3C" stroke-width="1.2"/><text x="938" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Três em cada quatro vezes que</text><text x="938" y="480" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">alguém com outro contexto faz a</text><text x="938" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">mesma pergunta, você sai do</text><text x="938" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conjunto. Não por mérito, não por</text><text x="938" y="546" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">comparação: porque o seu lugar</text><text x="938" y="568" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">nunca foi firme</text><rect x="712" y="302" width="176" height="190" rx="12" fill="#F7F8FA"/><rect x="712" y="302" width="176" height="5" rx="0" fill="#16213E"/><text x="800.0" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">PERFIL DE COMPRADOR</text><text x="800.0" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">NO PROMPT</text><text x="800.0" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">derruba a similaridade</text><text x="800.0" y="423" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">entre os conjuntos</text><text x="800.0" y="444" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">em 0,12 a 0,20 ponto</text><text x="800.0" y="465" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">(índice de Jaccard)</text><rect x="60" y="612" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">O texto move a escolha quando o modelo não tem outra coisa para usar — e move menos quanto mais ele já tem formado</text><text x="92" y="678" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Com especificações idênticas, a marca dona da palavra do pedido foi escolhida em 100% das rodadas no modelo menor e entre 63% e 95% no maior (medição própria, 1º de setembro de 2026)</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Bibliotecas populares usadas em até 45% dos casos em que não eram necessárias; Python dominante em 58% das tarefas onde não é a melhor escolha.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Jack, Lehman, Maloney e Xu (mai/2026, preprint de auditoria) · Twist et al. (Findings of ACL 2026, 8 modelos) · Blankenstein et al. (ICLR 2026)</text></svg>