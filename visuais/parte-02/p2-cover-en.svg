<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101A30"/><line x1="1300" y1="0" x2="1640" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1346" y1="0" x2="1686" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1392" y1="0" x2="1732" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1438" y1="0" x2="1778" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1484" y1="0" x2="1824" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1530" y1="0" x2="1870" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1576" y1="0" x2="1916" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1622" y1="0" x2="1962" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1668" y1="0" x2="2008" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1714" y1="0" x2="2054" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1760" y1="0" x2="2100" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1806" y1="0" x2="2146" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1852" y1="0" x2="2192" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><line x1="1898" y1="0" x2="2238" y2="340" stroke="#2F5D8A" stroke-opacity="0.14" stroke-width="2"/><rect x="0" y="0" width="14" height="1080" fill="#2F5D8A"/><text x="120" y="196" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#6E9CC4" letter-spacing="4">BUILDER-LED GROWTH — PART 2</text><line x1="120" y1="224" x2="560" y2="224" stroke="#2F5D8A" stroke-width="3"/><text x="114" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">How the machine decides,</text><text x="114" y="436" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">and where it stops deciding</text><text x="118" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">The mechanism, the price and what to measure</text><rect x="120" y="660" width="400" height="150" rx="14" fill="none" fill-opacity="0" stroke="#AEB6C2" stroke-opacity="0.45" stroke-width="2"/><text x="320.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#AEB6C2" text-anchor="middle">CANDIDACY</text><text x="320.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#AEB6C2" text-anchor="middle">parametric knowledge</text><line x1="528" y1="735.0" x2="558" y2="735.0" stroke="#6E9CC4" stroke-width="2.5" stroke-dasharray="7,7"/><rect x="566" y="660" width="400" height="150" rx="14" fill="none" fill-opacity="0" stroke="#AEB6C2" stroke-opacity="0.45" stroke-width="2"/><text x="766.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#AEB6C2" text-anchor="middle">RECOMMENDATION</text><text x="766.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#AEB6C2" text-anchor="middle">retrieval + community</text><line x1="974" y1="735.0" x2="1004" y2="735.0" stroke="#6E9CC4" stroke-width="2.5" stroke-dasharray="7,7"/><rect x="1012" y="660" width="400" height="150" rx="14" fill="#2F5D8A" fill-opacity="0.18" stroke="#6E9CC4" stroke-opacity="1" stroke-width="3"/><text x="1212.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">ADOPTION</text><text x="1212.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#6E9CC4" text-anchor="middle">execution friction</text><rect x="120" y="854" width="1292" height="76" rx="12" fill="#C68B3E" fill-opacity="0.16" stroke="#C68B3E" stroke-width="2"/><text x="150" y="902" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#FFFFFF" text-anchor="start">The limit of the thesis is the invoice — BLG decides who enters, human economics decides who stays.</text><line x1="120" y1="990" x2="1800" y2="990" stroke="#2F5D8A" stroke-opacity="0.5" stroke-width="1.5"/><text x="120" y="1032" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Matheus Ramos · with Supabase, shadcn/ui, Drizzle, Better Auth, Firecrawl and Tailwind</text></svg>