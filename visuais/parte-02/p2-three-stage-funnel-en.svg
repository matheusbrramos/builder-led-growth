<text x="580" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">02</text>
<text x="654" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Recommendation</text>
<text x="580" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">THE QUESTION</text>
<text x="580" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Among the candidates,</text>
<text x="580" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">does the agent pick you?</text>
<text x="580" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">DOMINANT MECHANISM</text>
<text x="580" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Retrieval + community signal</text>
<text x="580" y="472" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">HOW YOU LOSE HERE</text>
<text x="580" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Absence from the third-party</text>
<text x="580" y="519" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">comparative content that carries</text>
<text x="580" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the largest share of citations</text>
<line x1="580" y1="624" x2="996" y2="624" stroke="#DEE2E7" stroke-width="1"/>
<text x="580" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">32.5% vs &lt;5%</text>
<text x="580" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">third-party vs. your own page</text>
