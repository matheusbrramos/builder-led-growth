<text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Sources: Digidop (structured data) · Connor Kimball (citation provenance) · full analysis in the article.</text></svg>