<text x="88" y="786" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">THE LIMIT OF THE THESIS</text>
<text x="88" y="812" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">BLG decides who enters. What decides whether they stay is human economics — the limit of the thesis is the invoice.</text>
