<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect x="0" y="0" width="1600" height="780" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="780" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">QUADRO CONSOLIDADO</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que cada métrica responde — e o que não responde</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O erro mais comum é reportar menção em IA como se fosse adoção</text>
<rect x="60" y="175" width="1480" height="44" rx="6" fill="#E7EEF4"/>
<text x="76" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ESTÁGIO</text>
<text x="316" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ONDE MEDIR</text>
<text x="606" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">MÉTRICA</text>
<text x="1046" y="205" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O QUE ELA NÃO RESPONDE</text>
<rect x="60" y="225" width="1480" height="62" rx="6" fill="#F7F8FA"/>
<text x="76" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Candidatura</text>
<text x="316" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Dentro do modelo</text>
<text x="606" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Share of Model</text>
<text x="1046" y="251" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz se a citação está correta</text>
<text x="76" y="313" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Candidatura</text>
<text x="316" y="313" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Dentro do modelo</text>
<text x="606" y="313" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Taxa de acerto de citação</text>
<text x="1046" y="313" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz se você é o escolhido</text>
<rect x="60" y="349" width="1480" height="62" rx="6" fill="#F7F8FA"/>
<text x="76" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Recomendação</text>
<text x="316" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Na comunidade</text>
<text x="606" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Presença em comparativos</text>
<text x="1046" y="375" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz se a integração funciona</text>
<text x="76" y="437" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Recomendação</text>
<text x="316" y="437" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Na comunidade</text>
<text x="606" y="437" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Dependentes, downloads, scaffolds</text>
<text x="1046" y="437" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz se o uso é recorrente</text>
<rect x="60" y="473" width="1480" height="62" rx="6" fill="#F7F8FA"/>
<text x="76" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Adoção</text>
<text x="316" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Dentro do produto</text>
<text x="606" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Primeira chamada bem-sucedida</text>
<text x="1046" y="499" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz se o cliente permanece</text>
<text x="76" y="561" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Atravessa os 3</text>
<text x="316" y="561" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Dentro do produto</text>
<text x="606" y="561" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Taxa de adoção arquitetural</text>
<text x="1046" y="561" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não diz por que o agente escolheu</text>
<rect x="60" y="629" width="1480" height="70" rx="10" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/>
<text x="88" y="661" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">O PRIMEIRO NÚMERO A LEVANTAR</text>
<text x="88" y="685" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Se você não sabe qual proporção dos recursos do seu produto é criada por agente, não sabe se o BLG já é relevante para você.</text>
<line x1="60" y1="714" x2="1540" y2="714" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Referências: Supabase (60%+ dos bancos via ferramentas de IA) · Vercel (de &lt;3% para mais da metade dos deploys).</text></svg>