<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O QUE COMPETE NA DECISÃO DE UM AGENTE</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">As três entradas</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Poder, velocidade de influência e prazo de retorno não coincidem</text>
<rect x="60" y="195" width="468" height="545" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="100" cy="241" r="20" fill="#2F5D8A"/>
<text x="100" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="86" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Conhecimento</text>
<text x="86" y="321" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">paramétrico</text>
<text x="86" y="363" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O que o modelo aprendeu no</text>
<text x="86" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">treino e carrega nos pesos.</text>
<text x="86" y="405" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Responde mesmo sem acesso</text>
<text x="86" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">à internet.</text>
<text x="86" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">poder relativo</text>
<rect x="86" y="480" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="86" y="480" width="416.0" height="18" rx="5" fill="#2F5D8A"/>
<text x="86" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">velocidade de influência</text>
<rect x="86" y="536" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="86" y="536" width="49.92" height="18" rx="5" fill="#B8792E"/>
<line x1="86" y1="612" x2="502" y2="612" stroke="#DEE2E7" stroke-width="1"/>
<text x="86" y="640" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">prazo de retorno</text>
<text x="86" y="668" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">18 a 36 meses</text>
<text x="86" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Explica o shadcn/ui: volume de</text>
<text x="86" y="718" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">código público virou default</text>
<rect x="554" y="195" width="468" height="545" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="594" cy="241" r="20" fill="#2F5D8A"/>
<text x="594" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="580" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Recuperação</text>
<text x="580" y="321" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">em tempo real</text>
<text x="580" y="363" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O que o agente busca durante</text>
<text x="580" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a tarefa: docs, resultados de</text>
<text x="580" y="405" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">busca, arquivos do repo,</text>
<text x="580" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">llms.txt.</text>
<text x="580" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">poder relativo</text>
<rect x="580" y="480" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="580" y="480" width="228.8" height="18" rx="5" fill="#2F5D8A"/>
<text x="580" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">velocidade de influência</text>
<rect x="580" y="536" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="580" y="536" width="353.59999999999997" height="18" rx="5" fill="#B8792E"/>
<line x1="580" y1="612" x2="996" y2="612" stroke="#DEE2E7" stroke-width="1"/>
<text x="580" y="640" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">prazo de retorno</text>
<text x="580" y="668" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">semanas</text>
<text x="580" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Só alcança quem já sabe</text>
<text x="580" y="718" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">procurar por você</text>
<rect x="1048" y="195" width="468" height="545" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<circle cx="1088" cy="241" r="20" fill="#2F5D8A"/>
<text x="1088" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1074" y="295" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Atrito</text>
<text x="1074" y="321" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">de execução</text>
<text x="1074" y="363" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O que acontece quando o</text>
<text x="1074" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">agente tenta usar. DSL própria,</text>
<text x="1074" y="405" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">passos manuais, custo de</text>
<text x="1074" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">token do schema.</text>
<text x="1074" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">poder relativo</text>
<rect x="1074" y="480" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="1074" y="480" width="312.0" height="18" rx="5" fill="#2F5D8A"/>
<text x="1074" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">velocidade de influência</text>
<rect x="1074" y="536" width="416" height="18" rx="5" fill="#EEF0F3"/>
<rect x="1074" y="536" width="291.2" height="18" rx="5" fill="#B8792E"/>
<line x1="1074" y1="612" x2="1490" y2="612" stroke="#DEE2E7" stroke-width="1"/>
<text x="1074" y="640" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">prazo de retorno</text>
<text x="1074" y="668" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">sprint</text>
<text x="1074" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Só age depois de vencidas</text>
<text x="1074" y="718" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">as duas primeiras batalhas</text>
<line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Tratar as três como uma só coisa — "otimizar para IA" — é o que faz times investirem seis meses no lugar errado.</text></svg>