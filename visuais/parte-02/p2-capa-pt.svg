al" fill="#FFFFFF" text-anchor="start">Como a máquina decide,</text><text x="114" y="436" font-family="Liberation Sans, Arial, sans-serif" font-size="88" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">e onde ela para de decidir</text><text x="118" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">O mecanismo, o preço e o que medir</text><rect x="120" y="660" width="400" height="150" rx="14" fill="none" fill-opacity="0" stroke="#AEB6C2" stroke-opacity="0.45" stroke-width="2"/><text x="320.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#AEB6C2" text-anchor="middle">CANDIDATURA</text><text x="320.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#AEB6C2" text-anchor="middle">conhecimento paramétrico</text><line x1="528" y1="735.0" x2="558" y2="735.0" stroke="#6E9CC4" stroke-width="2.5" stroke-dasharray="7,7"/><rect x="566" y="660" width="400" height="150" rx="14" fill="none" fill-opacity="0" stroke="#AEB6C2" stroke-opacity="0.45" stroke-width="2"/><text x="766.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#AEB6C2" text-anchor="middle">RECOMENDAÇÃO</text><text x="766.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#AEB6C2" text-anchor="middle">recuperação + comunidade</text><line x1="974" y1="735.0" x2="1004" y2="735.0" stroke="#6E9CC4" stroke-width="2.5" stroke-dasharray="7,7"/><rect x="1012" y="660" width="400" height="150" rx="14" fill="#2F5D8A" fill-opacity="0.18" stroke="#6E9CC4" stroke-opacity="1" stroke-width="3"/><text x="1212.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">ADOÇÃO</text><text x="1212.0" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" font-style="italic" fill="#6E9CC4" text-anchor="middle">atrito de execução</text><rect x="120" y="854" width="1292" height="76" rx="12" fill="#C68B3E" fill-opacity="0.16" stroke="#C68B3E" stroke-width="2"/><text x="150" y="902" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" font-style="normal" fill="#FFFFFF" text-anchor="start">O limite da tese é o boleto — o BLG decide quem entra, a economia humana decide quem fica.</text><line x1="120" y1="990" x2="1800" y2="990" stroke="#2F5D8A" stroke-opacity="0.5" stroke-width="1.5"/><text x="120" y="1032" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Matheus Ramos · com Supabase, shadcn/ui, Drizzle, Better Auth, Firecrawl e Tailwind</text></svg>