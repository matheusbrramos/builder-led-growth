<rect x="1048" y="200" width="468" height="6" rx="0" fill="#2F5D8A"/>
<text x="1074" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">03</text>
<text x="1148" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Adoção</text>
<text x="1074" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">A PERGUNTA</text>
<text x="1074" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A recomendação virou</text>
<text x="1074" y="345" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">integração funcionando?</text>
<text x="1074" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">MECANISMO DOMINANTE</text>
<text x="1074" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Atrito de execução</text>
<text x="1074" y="472" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">COMO SE PERDE AQUI</text>
<text x="1074" y="498" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Passos manuais no meio do</text>
<text x="1074" y="519" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">fluxo. Nenhuma métrica de</text>
<text x="1074" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">marketing acusa a perda</text>
<line x1="1074" y1="624" x2="1490" y2="624" stroke="#DEE2E7" stroke-width="1"/>
<text x="1074" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">o estágio cego</text>
<text x="1074" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">"fui recomendado" já foi cumprido</text>
<rect x="60" y="754" width="1480" height="74" rx="10" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/>
<text x="88" y="786" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">O LIMITE DA TESE</text>
<text x="88" y="812" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O BLG decide quem entra. Quem decide se permanece é a economia humana — o limite da tese é o boleto.</text>
