<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O CONJUNTO E OS RELÓGIOS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três portas para o conjunto de onde a máquina tira as opções</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Cada porta tem um relógio, e nenhum dos três marca a mesma hora</text><rect x="60.0" y="210" width="470" height="372" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">PORTA 1</text><text x="86.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O corpus</text><text x="86.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">meses</text><text x="86.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">corte de conhecimento + lançamento + confiabilidade</text><line x1="86.0" y1="408" x2="504.0" y2="408" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A memória do modelo, formada no</text><text x="86.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">treinamento. Entra-se por presença</text><text x="86.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">acumulada por terceiros: 85,7% das</text><text x="86.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">citações vêm de sites que a marca</text><text x="86.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">não controla. Definição igual em todo</text><text x="86.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">lugar, nome que não colide, pacote</text><text x="86.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que instala. Horizonte: um ano ou mais</text><rect x="565.0" y="210" width="470" height="372" rx="14" fill="#E6F0EA"/><rect x="565.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F7D5D"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">PORTA 2</text><text x="591.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A busca</text><text x="591.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">dias</text><text x="591.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">o agente lê por dois segundos, em uma requisição</text><line x1="591.0" y1="408" x2="1009.0" y2="408" stroke="#2F7D5D" stroke-width="1.2"/><text x="591.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O que o agente lê na hora: página em</text><text x="591.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Markdown, índice para máquina, preço</text><text x="591.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">legível, distância até a primeira</text><text x="591.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">chamada, e a descrição da skill. Só</text><text x="591.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">alcança quem já sabe procurar por você:</text><text x="591.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">57,8% das repetições no ChatGPT não</text><text x="591.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">acionaram busca nenhuma</text><rect x="1070.0" y="210" width="470" height="372" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">PORTA 3</text><text x="1096.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A plataforma</text><text x="1096.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">um contrato</text><text x="1096.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">avança quando alguém assina ou revisa um catálogo</text><line x1="1096.0" y1="408" x2="1514.0" y2="408" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O padrão da casa, decidido antes de</text><text x="1096.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a conversa começar. Em cinco de sete</text><text x="1096.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">plataformas o cliente nunca vê o nome.</text><text x="1096.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Dois caminhos: ser o substrato (por</text><text x="1096.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">contato) ou entrar no catálogo (só o</text><text x="1096.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Vercel Marketplace documenta como).</text><text x="1096.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Calendário que ninguém publica</text><rect x="60" y="612" width="1480" height="84" rx="14" fill="#16213E"/><text x="92" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">No terminal ou no editor (Claude Code, Codex, Cursor) a terceira porta muda de forma</text><text x="92" y="676" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Não há casa embutindo padrão: a porta é o que quem constrói instalou — servidores MCP, skills, arquivo do projeto — e o resto vem inteiro do corpus</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que você publica hoje age em dias por uma porta, em um ano por outra, e nunca sozinho pela terceira.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Anthropic (cortes, ago/2026) · Semrush (dez/2025) · arXiv 2604.07585 via Martinez · Zatuchin (jun/2026)</text></svg>