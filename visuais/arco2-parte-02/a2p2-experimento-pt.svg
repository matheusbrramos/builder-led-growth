fill="#5B6472" text-anchor="start">C · dono de "confiabilidade"</text><rect x="800" y="646" width="16" height="16" rx="3" fill="#2F7D5D"/><text x="824" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">S · dono de "simplicidade"</text><rect x="1170" y="646" width="16" height="16" rx="3" fill="#9C4A3C"/><text x="1194" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A · autoridade sem prova</text><rect x="60" y="684" width="1480" height="78" rx="14" fill="#16213E"/><text x="92" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Sem documentação nenhuma: Haiku escolheu SendGrid 40 vezes em 40; Sonnet, Resend 40 em 40</text><text x="92" y="744" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">É a porta do corpus em um número — monolítica dentro de um modelo, divergente entre modelos. Rodado no Claude Code, sem nada instalado</text><rect x="60" y="808" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="808" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="847" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O texto de marca decide enquanto o modelo não percebe que os produtos são iguais; quando percebe, a posição volta a mandar.</text><line x1="60" y1="894" x2="1540" y2="894" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="920" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · protocolo congelado antes da rodada; dados no repositório público · dois modelos de uma família, em português — limite declarado</text></svg>