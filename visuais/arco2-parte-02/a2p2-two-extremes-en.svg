<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="920" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="920" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE TWO EXTREMES, AND THE MIDDLE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Who decides at each door, by how much is delegated and how much is governed</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The extremes are a laboratory design. Day to day sits in the middle</text><rect x="60.0" y="200" width="470" height="410" rx="14" fill="#F5E6E2"/><rect x="60.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="60.0" y="200" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="86.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">NO GOVERNANCE, TOTAL DELEGATION</text><text x="86.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The 25-person company</text><rect x="80.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="96.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The model's default decides.</text><text x="96.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Nobody asked for the vendor</text><rect x="80.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">SEARCH</text><text x="96.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The agent reads what it finds on the</text><text x="96.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">spot, if it searches at all</text><rect x="80.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">PLATFORM / CATALOGUE</text><text x="96.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The house default, decided before the</text><text x="96.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conversation. Nobody sees the name</text><rect x="565.0" y="200" width="470" height="410" rx="14" fill="#F5EBDD"/><rect x="565.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="565.0" y="200" width="470" height="7" rx="0" fill="#B8792E"/><text x="591.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">THE MIDDLE, WHERE ALMOST EVERYTHING HAPPENS</text><text x="591.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Names what she knows</text><rect x="585.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="601.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">What the person delegates, the corpus</text><text x="601.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">decides: the size of what she doesn't know</text><rect x="585.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">SEARCH</text><text x="601.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">What the person names, the description</text><text x="601.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">read on the spot decides</text><rect x="585.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">PLATFORM / CATALOGUE</text><text x="601.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">What the list allows, the catalogue</text><text x="601.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">decides. The open API goes around it</text><rect x="1070.0" y="200" width="470" height="410" rx="14" fill="#E7EEF4"/><rect x="1070.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1070.0" y="200" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="1096.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WITH GOVERNANCE</text><text x="1096.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A person pins the list</text><rect x="1090.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="1106.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The model knows you exist</text><text x="1106.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">and cannot connect you</text><rect x="1090.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">SEARCH</text><text x="1106.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The agent reads the documentation</text><text x="1106.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">and does not install</text><rect x="1090.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">PLATFORM / CATALOGUE</text><text x="1106.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The list belongs to a person, among</text><text x="1106.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">what the platform already catalogued</text><rect x="60" y="638" width="1480" height="78" rx="14" fill="#16213E"/><text x="800.0" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">At both extremes, candidacy happens before the first prompt</text><text x="800.0" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">No list covers everything: the corpus stays open from inside the code, and governance closes catalogue and installation</text><rect x="60" y="768" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="768" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="807" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">The vendor who tends one door only is betting on which of the three will hold for that customer — in a proportion nobody publishes.</text><line x1="60" y1="854" x2="1540" y2="854" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Lovable and Bolt (admin controls) · GitHub (Nov 2025) · Anthropic (managed MCP) · Nylas (Mar 2025)</text></svg>