<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1030" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1030" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THREE LOGICS, THREE READERS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Who reads, and what gets measured, in each practice of being found</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">In the first four rows, someone asked. In the last, nobody asked for the vendor</text><text x="76" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">PRACTICE</text><text x="356" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">WHO COINED IT, WHEN</text><text x="796" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">WHO READS</text><text x="1166" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">WHAT GETS MEASURED</text><line x1="60" y1="236" x2="1540" y2="236" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="248" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="248" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">SEO</text><text x="356" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Disputed authorship, 1995–1997. Dated</text><text x="356" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">record: Usenet, 26 Jul 1997 (traced by</text><text x="356" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Danny Sullivan in 2004, who popularised it)</text><text x="796" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A person who types a question</text><text x="796" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and clicks a result</text><text x="1166" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Position, click and organic traffic</text><text x="1166" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Search Console)</text><rect x="60" y="368" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="368" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="408" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AEO</text><text x="356" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Jason Barnard, with Chee Lo (Trustpilot).</text><text x="356" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">White paper at BrightonSEO, 15 Sep 2017</text><text x="796" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A person who asks and hears or</text><text x="796" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">reads the ready answer, no click</text><text x="1166" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Being the featured answer.</text><text x="1166" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">In 2026, merged with GEO</text><rect x="60" y="488" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="488" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="528" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">GEO</text><text x="356" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Aggarwal, Murahari, Rajpurohit, Kalyan,</text><text x="356" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Narasimhan and Deshpande, 16 Nov 2023</text><text x="356" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(arXiv 2311.09735, KDD 2024)</text><text x="796" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A person asking</text><text x="796" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a chatbot</text><text x="1166" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Citation, mention and share of voice,</text><text x="1166" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">measured by tooling vendors.</text><text x="1166" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Google: no new metric</text><rect x="60" y="608" width="1480" height="112" rx="12" fill="#F5EBDD"/><rect x="60" y="608" width="6" height="112" rx="0" fill="#B8792E"/><text x="82" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AX · Agentic Engine</text><text x="82" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Optimization · AAO</text><text x="356" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Biilmann (Netlify), 28 Jan 2025 · Osmani</text><text x="356" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Cloud), 11 Apr 2026 · Barnard,</text><text x="356" y="682" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">24 Feb 2026</text><text x="796" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">An agent that builds (AX, Osmani)</text><text x="796" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">or acts for someone (AAO)</text><text x="1166" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">No public metric</text><rect x="60" y="728" width="1480" height="112" rx="12" fill="#E7EEF4"/><rect x="60" y="728" width="6" height="112" rx="0" fill="#2F5D8A"/><text x="82" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Builder-Led</text><text x="82" y="792" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Growth</text><text x="356" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">This series. Precedents credited;</text><text x="356" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the reader and the metric differ</text><text x="796" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The pair of person and machine that</text><text x="796" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">is building. The decision happens</text><text x="796" y="802" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">inside the build, with no question</text><text x="1166" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Incorporation: installed, imported,</text><text x="1166" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">called. Nobody publishes that rate</text><rect x="60" y="878" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="878" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="917" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">More pages on the site is the lowest correlation anyone has measured: 0.17 / 0.19, last of eleven.</text><line x1="60" y1="964" x2="1540" y2="964" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="990" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Search Engine Land (Sep 2025) · Barnard (2017) · arXiv 2311.09735 · Ahrefs (May and Dec 2025, 75,000 brands)</text></svg>