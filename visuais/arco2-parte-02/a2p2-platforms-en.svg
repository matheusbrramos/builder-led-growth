<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1070" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1070" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DOOR 3 — THE HOUSE DEFAULT</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Seven AI build platforms on 1 September 2026</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Documentation read that day. It changes without notice</text><text x="76" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">PLATFORM</text><text x="346" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">BUILT-IN DEFAULT</text><text x="846" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">VENDOR VISIBLE TO CUSTOMER?</text><text x="1146" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">CHOICE OFFERED</text><line x1="60" y1="236" x2="1540" y2="236" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="248" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="248" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Lovable</text><text x="346" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Lovable Cloud (Supabase underneath), built-in e-mails with</text><text x="346" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">no vendor named, payments via Paddle or Stripe</text><text x="846" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">no</text><text x="1146" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Cloud or a Supabase of your own;</text><text x="1146" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">"Do I need SendGrid or Resend? No"</text><rect x="60" y="340" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="340" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Bolt</text><text x="346" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Bolt Database (Supabase), Resend for e-mail when no</text><text x="346" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">provider is chosen, Bolt Cloud hosting (Netlify)</text><text x="846" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">partly</text><text x="1146" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Bolt Database or Supabase,</text><text x="1146" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">at project creation</text><rect x="60" y="432" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="432" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Replit</text><text x="346" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Replit Database, Replit Auth, App Storage</text><text x="346" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Cloud Storage underneath)</text><text x="846" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">no</text><text x="1146" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A short list of connectors when</text><text x="1146" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">no vendor is named</text><rect x="60" y="524" width="1480" height="84" rx="12" fill="#E6F0EA"/><rect x="60" y="524" width="6" height="84" rx="0" fill="#2F7D5D"/><text x="82" y="574" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">v0 (Vercel)</text><text x="346" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">No default database. The exception in the set,</text><text x="346" y="578" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and the one with the most technical audience</text><text x="846" y="574" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">yes</text><text x="1146" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Upstash, Neon, Supabase, Vercel Blob;</text><text x="1146" y="578" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">human pause before any paid plan</text><rect x="60" y="616" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="616" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Base44 (Wix)</text><text x="346" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Database, login, hosting and e-mail sending built in,</text><text x="346" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">no vendor named</text><text x="846" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">no</text><text x="1146" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Resend from a paid plan up;</text><text x="1146" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Stripe in payments</text><rect x="60" y="708" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="708" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="758" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Emergent</text><text x="346" y="742" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Single stack: React, FastAPI and MongoDB Atlas</text><text x="346" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(named by MongoDB, not by the platform)</text><text x="846" y="758" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">no</text><text x="1146" y="742" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">No documented database</text><text x="1146" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">alternative</text><rect x="60" y="800" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="800" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="850" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Google AI Studio</text><text x="346" y="834" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Firestore and Firebase Authentication:</text><text x="346" y="854" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the default is the house itself</text><text x="846" y="850" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">it is the house</text><text x="1146" y="834" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">An approval button</text><text x="1146" y="854" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">("Enable Firebase")</text><rect x="60" y="918" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="918" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="957" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Where a choice exists, it has one design: the house default and one alternative. Never an open list.</text><line x1="60" y1="1004" x2="1540" y2="1004" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="1030" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · each platform's official documentation, read on 1 September 2026 · Supabase (Sep and Dec 2025) · MongoDB (case study)</text></svg>