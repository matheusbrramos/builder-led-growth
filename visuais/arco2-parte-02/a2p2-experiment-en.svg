mily="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle">N</text><rect x="952" y="394.8" width="54" height="151.2" rx="4" fill="#2F5D8A"/><text x="979" y="386.8" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">63%</text><text x="979" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">R</text><rect x="1024" y="526.8" width="54" height="19.2" rx="4" fill="#2F7D5D"/><text x="1051" y="518.8" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">8%</text><text x="1051" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">S</text><rect x="1096" y="529.2" width="54" height="16.8" rx="4" fill="#9C4A3C"/><text x="1123" y="521.2" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">7%</text><text x="1123" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">A</text><text x="1015" y="592" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">tone: "no e-mail can fail to arrive"</text><rect x="1220" y="534.0" width="54" height="12.0" rx="4" fill="#8B93A1"/><text x="1247" y="526.0" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle">5%</text><text x="1247" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle">N</text><rect x="1292" y="543" width="54" height="3" rx="4" fill="#2F5D8A"/><text x="1319" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle">0%</text><text x="1319" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">R</text><rect x="1364" y="318.0" width="54" height="228.0" rx="4" fill="#2F7D5D"/><text x="1391" y="310.0" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">95%</text><text x="1391" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">S</text><rect x="1436" y="543" width="54" height="3" rx="4" fill="#9C4A3C"/><text x="1463" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="middle">0%</text><text x="1463" y="566" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="middle">A</text><text x="1355" y="592" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">tone: "working today, with no configuration"</text><line x1="870" y1="546" x2="1510" y2="546" stroke="#DEE2E7" stroke-width="1.2"/><rect x="60" y="646" width="16" height="16" rx="3" fill="#8B93A1"/><text x="84" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">N · neutral and descriptive</text><rect x="430" y="646" width="16" height="16" rx="3" fill="#2F5D8A"/><text x="454" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">R · owns "reliability"</text><rect x="800" y="646" width="16" height="16" rx="3" fill="#2F7D5D"/><text x="824" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">S · owns "simplicity"</text><rect x="1170" y="646" width="16" height="16" rx="3" fill="#9C4A3C"/><text x="1194" y="659" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A · authority without proof</text><rect x="60" y="684" width="1480" height="78" rx="14" fill="#16213E"/><text x="92" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">With no documentation at all: Haiku picked SendGrid 40 times out of 40; Sonnet, Resend 40 out of 40</text><text x="92" y="744" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">It is the corpus door in a single number — monolithic within one model, divergent between models. Run in Claude Code, with nothing installed</text><rect x="60" y="808" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="808" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="847" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The brand text decides as long as the model doesn't notice the products are identical; once it notices, position takes over.</text><line x1="60" y1="894" x2="1540" y2="894" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="920" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · protocol frozen before the run; data in the public repository · two models from one family, in Portuguese — declared limit</text></svg>