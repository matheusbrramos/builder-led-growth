<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE SET AND THE CLOCKS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three doors into the set the machine draws its options from</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Each door has a clock, and none of the three keeps the same time</text><rect x="60.0" y="210" width="470" height="372" rx="14" fill="#E7EEF4"/><rect x="60.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="210" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="86.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DOOR 1</text><text x="86.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The corpus</text><text x="86.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">months</text><text x="86.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">knowledge cutoff + launch + reliability</text><line x1="86.0" y1="408" x2="504.0" y2="408" stroke="#2F5D8A" stroke-width="1.2"/><text x="86.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The model's memory, formed in</text><text x="86.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">training. You enter by presence built</text><text x="86.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">by third parties: 85.7% of citations</text><text x="86.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">point to sites the brand does not</text><text x="86.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">control. Same definition everywhere,</text><text x="86.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a name that doesn't collide, a package</text><text x="86.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">that installs. Horizon: a year or more</text><rect x="565.0" y="210" width="470" height="372" rx="14" fill="#E6F0EA"/><rect x="565.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="565.0" y="210" width="470" height="7" rx="0" fill="#2F7D5D"/><text x="591.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">DOOR 2</text><text x="591.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Search</text><text x="591.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">days</text><text x="591.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">the agent reads for two seconds, in one request</text><line x1="591.0" y1="408" x2="1009.0" y2="408" stroke="#2F7D5D" stroke-width="1.2"/><text x="591.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">What the agent reads on the spot:</text><text x="591.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Markdown page, machine index,</text><text x="591.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">readable price, distance to the first</text><text x="591.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">call, and the skill's description. It</text><text x="591.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">only reaches whoever already knows to</text><text x="591.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">look for you: 57.8% of ChatGPT</text><text x="591.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">repetitions triggered no search at all</text><rect x="1070.0" y="210" width="470" height="372" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="210" width="470" height="372" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="210" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="260" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">DOOR 3</text><text x="1096.0" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The platform</text><text x="1096.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">a contract</text><text x="1096.0" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">moves when someone signs or revises a catalogue</text><line x1="1096.0" y1="408" x2="1514.0" y2="408" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The house default, decided before the</text><text x="1096.0" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conversation begins. In five of seven</text><text x="1096.0" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">platforms the customer never sees the</text><text x="1096.0" y="504" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">name. Two paths: be the substrate (by</text><text x="1096.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">contact) or enter the catalogue (only</text><text x="1096.0" y="548" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the Vercel Marketplace documents how).</text><text x="1096.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A calendar nobody publishes</text><rect x="60" y="612" width="1480" height="84" rx="14" fill="#16213E"/><text x="92" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">In the terminal or the editor (Claude Code, Codex, Cursor) the third door changes shape</text><text x="92" y="676" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">No house embeds a default: the door is what the builder installed — MCP servers, skills, the project file — and the rest comes entirely from the corpus</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What you publish today acts in days through one door, in a year through another, and never on its own through the third.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Anthropic (cutoffs, Aug 2026) · Semrush (Dec 2025) · arXiv 2604.07585 via Martinez · Zatuchin (Jun 2026)</text></svg>