<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="920" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="920" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">OS DOIS EXTREMOS, E O MEIO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quem decide em cada porta, conforme quanto se delega e quanto se governa</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Os extremos são desenho de laboratório. O dia a dia fica no meio</text><rect x="60.0" y="200" width="470" height="410" rx="14" fill="#F5E6E2"/><rect x="60.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="60.0" y="200" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="86.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">SEM GOVERNANÇA, DELEGAÇÃO TOTAL</text><text x="86.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A empresa de 25 pessoas</text><rect x="80.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="96.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O padrão do modelo decide.</text><text x="96.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ninguém perguntou pelo fornecedor</text><rect x="80.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">BUSCA</text><text x="96.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O agente lê o que encontra na hora,</text><text x="96.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">se chegar a buscar</text><rect x="80.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="96.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">PLATAFORMA / CATÁLOGO</text><text x="96.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O padrão da casa, decidido antes</text><text x="96.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">da conversa. Ninguém vê o nome</text><rect x="565.0" y="200" width="470" height="410" rx="14" fill="#F5EBDD"/><rect x="565.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="565.0" y="200" width="470" height="7" rx="0" fill="#B8792E"/><text x="591.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">O MEIO, ONDE QUASE TUDO ACONTECE</text><text x="591.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Nomeia o que conhece</text><rect x="585.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="601.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O que a pessoa delega, o corpus</text><text x="601.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">decide: o tamanho do que ela não conhece</text><rect x="585.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">BUSCA</text><text x="601.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O que a pessoa nomeia, a descrição</text><text x="601.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">lida na hora decide</text><rect x="585.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="601.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">PLATAFORMA / CATÁLOGO</text><text x="601.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O que a lista permite, o catálogo</text><text x="601.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">decide. A API aberta passa por fora</text><rect x="1070.0" y="200" width="470" height="410" rx="14" fill="#E7EEF4"/><rect x="1070.0" y="200" width="470" height="410" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1070.0" y="200" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="1096.0" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">COM GOVERNANÇA</text><text x="1096.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Uma pessoa fixa a lista</text><rect x="1090.0" y="324" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="350" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">CORPUS</text><text x="1106.0" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O modelo sabe que você existe</text><text x="1106.0" y="393" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e não pode conectar você</text><rect x="1090.0" y="412" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">BUSCA</text><text x="1106.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O agente lê a documentação</text><text x="1106.0" y="481" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e não instala</text><rect x="1090.0" y="500" width="430" height="76" rx="10" fill="#FFFFFF"/><text x="1106.0" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">PLATAFORMA / CATÁLOGO</text><text x="1106.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A lista é de uma pessoa, entre</text><text x="1106.0" y="569" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o que a plataforma já catalogou</text><rect x="60" y="638" width="1480" height="78" rx="14" fill="#16213E"/><text x="800.0" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Nos dois extremos, a candidatura acontece antes do primeiro prompt</text><text x="800.0" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Nenhuma lista cobre tudo: o corpus continua aberto por dentro do código, e a governança fecha catálogo e instalação</text><rect x="60" y="768" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="768" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="807" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">O fornecedor que cuida de uma porta só aposta em qual das três vai valer para aquele cliente — numa proporção que ninguém publica.</text><line x1="60" y1="854" x2="1540" y2="854" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Lovable e Bolt (controles de admin) · GitHub (nov/2025) · Anthropic (managed MCP) · Nylas (mar/2025)</text></svg>