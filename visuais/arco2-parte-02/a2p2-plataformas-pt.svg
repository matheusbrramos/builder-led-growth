<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1070" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1070" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">PORTA 3 — O PADRÃO DA CASA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Sete plataformas de construção assistida em 1º de setembro de 2026</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Documentação lida naquele dia. Muda sem aviso</text><text x="76" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">PLATAFORMA</text><text x="346" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">PADRÃO EMBUTIDO</text><text x="846" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">CLIENTE VÊ O FORNECEDOR?</text><text x="1146" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">ESCOLHA OFERECIDA</text><line x1="60" y1="236" x2="1540" y2="236" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="248" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="248" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Lovable</text><text x="346" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Lovable Cloud (Supabase por baixo), e-mails embutidos sem</text><text x="346" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">fornecedor nomeado, pagamentos Paddle ou Stripe</text><text x="846" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">não</text><text x="1146" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Cloud ou uma Supabase própria;</text><text x="1146" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">"Preciso de SendGrid ou Resend? Não"</text><rect x="60" y="340" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="340" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Bolt</text><text x="346" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Bolt Database (Supabase), Resend para e-mail sem</text><text x="346" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">provedor escolhido, hospedagem Bolt Cloud (Netlify)</text><text x="846" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">em parte</text><text x="1146" y="374" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Bolt Database ou Supabase,</text><text x="1146" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">na criação do projeto</text><rect x="60" y="432" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="432" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Replit</text><text x="346" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Replit Database, Replit Auth, App Storage</text><text x="346" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Cloud Storage por baixo)</text><text x="846" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">não</text><text x="1146" y="466" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Lista curta de conectores quando</text><text x="1146" y="486" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o fornecedor não é nomeado</text><rect x="60" y="524" width="1480" height="84" rx="12" fill="#E6F0EA"/><rect x="60" y="524" width="6" height="84" rx="0" fill="#2F7D5D"/><text x="82" y="574" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">v0 (Vercel)</text><text x="346" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Nenhum banco padrão. A exceção do conjunto,</text><text x="346" y="578" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">e a de público mais técnico</text><text x="846" y="574" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">sim</text><text x="1146" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Upstash, Neon, Supabase, Vercel Blob;</text><text x="1146" y="578" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">pausa humana antes de plano pago</text><rect x="60" y="616" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="616" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Base44 (Wix)</text><text x="346" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Banco, login, hospedagem e envio de e-mail embutidos,</text><text x="346" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">nenhum fornecedor nomeado</text><text x="846" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">não</text><text x="1146" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Resend a partir de plano pago;</text><text x="1146" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Stripe nos pagamentos</text><rect x="60" y="708" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="708" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="758" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Emergent</text><text x="346" y="742" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Pilha única: React, FastAPI e MongoDB Atlas</text><text x="346" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(nomeado pela MongoDB, não pela plataforma)</text><text x="846" y="758" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">não</text><text x="1146" y="742" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Nenhuma alternativa de banco</text><text x="1146" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">documentada</text><rect x="60" y="800" width="1480" height="84" rx="12" fill="#F7F8FA"/><rect x="60" y="800" width="6" height="84" rx="0" fill="#8B93A1"/><text x="82" y="850" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Google AI Studio</text><text x="346" y="834" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Firestore e Firebase Authentication:</text><text x="346" y="854" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o padrão é a própria casa</text><text x="846" y="850" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">é a casa</text><text x="1146" y="834" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Botão de aprovação</text><text x="1146" y="854" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">("Enable Firebase")</text><rect x="60" y="918" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="918" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="957" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Onde existe escolha, o desenho é um só: o padrão da casa e uma alternativa. Nunca lista aberta.</text><line x1="60" y1="1004" x2="1540" y2="1004" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="1030" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · documentação oficial de cada plataforma, lida em 1º de setembro de 2026 · Supabase (set e dez/2025) · MongoDB (case study)</text></svg>