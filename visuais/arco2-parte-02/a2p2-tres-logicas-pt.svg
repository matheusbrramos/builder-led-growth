<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="1030" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="1030" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">TRÊS LÓGICAS, TRÊS LEITORES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quem lê, e o que se mede em cada prática de ser encontrado</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Nas quatro primeiras linhas, alguém perguntou. Na última, ninguém perguntou pelo fornecedor</text><text x="76" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">PRÁTICA</text><text x="356" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">QUEM CUNHOU, QUANDO</text><text x="796" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">QUEM LÊ</text><text x="1166" y="220" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start" letter-spacing="1.5">O QUE SE MEDE</text><line x1="60" y1="236" x2="1540" y2="236" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60" y="248" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="248" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">SEO</text><text x="356" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Autoria disputada, 1995–1997. Registro</text><text x="356" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">datado: Usenet, 26 jul 1997 (apurado por</text><text x="356" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Danny Sullivan em 2004), que o popularizou</text><text x="796" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Uma pessoa que digita uma</text><text x="796" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">pergunta e clica num resultado</text><text x="1166" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Posição, clique e tráfego orgânico</text><text x="1166" y="302" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Search Console)</text><rect x="60" y="368" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="368" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="408" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AEO</text><text x="356" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Jason Barnard, com Chee Lo (Trustpilot).</text><text x="356" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">White paper na BrightonSEO, 15 set 2017</text><text x="796" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Uma pessoa que pergunta e ouve</text><text x="796" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">ou lê a resposta pronta, sem clicar</text><text x="1166" y="402" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Ser a resposta destacada.</text><text x="1166" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Em 2026, fundido com GEO</text><rect x="60" y="488" width="1480" height="112" rx="12" fill="#F7F8FA"/><rect x="60" y="488" width="6" height="112" rx="0" fill="#8B93A1"/><text x="82" y="528" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">GEO</text><text x="356" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Aggarwal, Murahari, Rajpurohit, Kalyan,</text><text x="356" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Narasimhan e Deshpande, 16 nov 2023</text><text x="356" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(arXiv 2311.09735, KDD 2024)</text><text x="796" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Uma pessoa que pergunta</text><text x="796" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">a um chatbot</text><text x="1166" y="522" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Citação, menção e share of voice,</text><text x="1166" y="542" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">medidos por fornecedor de ferramenta.</text><text x="1166" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Google: nenhuma métrica nova</text><rect x="60" y="608" width="1480" height="112" rx="12" fill="#F5EBDD"/><rect x="60" y="608" width="6" height="112" rx="0" fill="#B8792E"/><text x="82" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">AX · Agentic Engine</text><text x="82" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Optimization · AAO</text><text x="356" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Biilmann (Netlify), 28 jan 2025 · Osmani</text><text x="356" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">(Google Cloud), 11 abr 2026 · Barnard,</text><text x="356" y="682" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">24 fev 2026</text><text x="796" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Um agente que constrói (AX, Osmani)</text><text x="796" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">ou que age por alguém (AAO)</text><text x="1166" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Nenhuma métrica pública</text><rect x="60" y="728" width="1480" height="112" rx="12" fill="#E7EEF4"/><rect x="60" y="728" width="6" height="112" rx="0" fill="#2F5D8A"/><text x="82" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Builder-Led</text><text x="82" y="792" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Growth</text><text x="356" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Esta série. Precedentes creditados;</text><text x="356" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o leitor e a métrica são outros</text><text x="796" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O par de pessoa e máquina que está</text><text x="796" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">construindo. A decisão acontece dentro</text><text x="796" y="802" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">da construção, sem pergunta</text><text x="1166" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Incorporação: instalado, importado,</text><text x="1166" y="782" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">chamado. Ninguém publica essa taxa</text><rect x="60" y="878" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="878" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="917" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Mais páginas no site é o fator de correlação mais baixa que alguém mediu: 0,17 / 0,19, último de onze.</text><line x1="60" y1="964" x2="1540" y2="964" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="990" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Search Engine Land (set/2025) · Barnard (2017) · arXiv 2311.09735 · Ahrefs (mai e dez/2025, 75 mil marcas)</text></svg>