<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">WHERE A MODEL'S UNCERTAINTY ABOUT YOUR PRODUCT COMES FROM</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The three sources — and who controls each</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Of the three reasons a model might get you wrong, one is entirely in your hands</text>
<rect x="60" y="190" width="468" height="500" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="190" width="468" height="6" rx="0" fill="#C7CDD5"/>
<text x="86" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">Knowledge</text>
<text x="86" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">gaps</text>
<text x="86" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Insufficient training coverage,</text>
<text x="86" y="351" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">or outdated information.</text>
<line x1="86" y1="412" x2="502" y2="412" stroke="#DEE2E7" stroke-width="1"/>
<text x="86" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">WHO CONTROLS IT</text>
<text x="86" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">You, indirectly</text>
<text x="86" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">ON WHAT TIMELINE</text>
<text x="86" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">months to years</text>
<line x1="86" y1="608" x2="502" y2="608" stroke="#DEE2E7" stroke-width="1"/>
<text x="86" y="638" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Depends on accumulated adoption.</text>
<text x="86" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Effort does not speed it up.</text>
<rect x="554" y="190" width="468" height="500" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="554" y="190" width="468" height="6" rx="0" fill="#C7CDD5"/>
<text x="580" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">Decoding</text>
<text x="580" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">randomness</text>
<text x="580" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Noise from the model's own</text>
<text x="580" y="351" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">sampling process.</text>
<line x1="580" y1="412" x2="996" y2="412" stroke="#DEE2E7" stroke-width="1"/>
<text x="580" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">WHO CONTROLS IT</text>
<text x="580" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">The harness, not you</text>
<text x="580" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">ON WHAT TIMELINE</text>
<text x="580" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">—</text>
<line x1="580" y1="608" x2="996" y2="608" stroke="#DEE2E7" stroke-width="1"/>
<text x="580" y="638" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">Outside your reach.</text>
<text x="580" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">It belongs to whoever runs the agent.</text>
<rect x="1048" y="190" width="468" height="500" rx="10" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="2.5"/>
<rect x="1048" y="190" width="468" height="6" rx="0" fill="#2F5D8A"/>
<text x="1074" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Input</text>
<text x="1074" y="275" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">ambiguity</text>
<text x="1074" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">What you hand over admits</text>
<text x="1074" y="351" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">more than one valid reading:</text>
<text x="1074" y="372" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">docs, schema, name, API.</text>
<line x1="1074" y1="412" x2="1490" y2="412" stroke="#DEE2E7" stroke-width="1"/>
<text x="1074" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">WHO CONTROLS IT</text>
<text x="1074" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">YOU, directly</text>
<text x="1074" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">ON WHAT TIMELINE</text>
<text x="1074" y="554" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">now</text>
<line x1="1074" y1="608" x2="1490" y2="608" stroke="#DEE2E7" stroke-width="1"/>
<text x="1074" y="638" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">The only lever that</text>
<text x="1074" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">responds to a change made today.</text>
<rect x="60" y="720" width="1480" height="62" rx="10" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/>
<text x="88" y="759" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">And it is exactly where almost nobody works: the public conversation is about showing up, not about being unambiguous.</text>
<line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Decomposition from The Anatomy of Uncertainty in LLMs (arXiv 2603.24967). The mapping to distribution is the author's.</text></svg>