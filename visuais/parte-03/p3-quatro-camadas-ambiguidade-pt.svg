<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="980" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">ONDE A AMBIGUIDADE AGE</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quatro camadas, quatro literaturas</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Medidas por campos que não se citam entre si — o que sugere um mecanismo comum por baixo</text>
<rect x="60" y="186" width="1480" height="134" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="186" width="6" height="134" rx="0" fill="#2F5D8A"/>
<circle cx="112" cy="228" r="20" fill="#2F5D8A"/>
<text x="112" y="235" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="150" y="222" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A máquina consegue usar você sem errar?</text>
<text x="150" y="248" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">geração de código</text>
<text x="150" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A variável não é familiaridade. É quantos caminhos válidos você deixa em aberto.</text>
<line x1="1010" y1="208" x2="1010" y2="298" stroke="#DEE2E7" stroke-width="1"/>
<text x="1046" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">+40 pontos</text>
<text x="1046" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">linguagem restrita sobre Python, em tarefas multi-passo</text>
<rect x="60" y="334" width="1480" height="134" rx="10" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="334" width="6" height="134" rx="0" fill="#2F5D8A"/>
<circle cx="112" cy="376" r="20" fill="#2F5D8A"/>
<text x="112" y="383" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="150" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A máquina distingue você do concorrente?</text>
<text x="150" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">seleção de ferramenta</text>
<text x="150" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Sua distinção depende do que os outros nomearam. Não existe equivalente disso no PLG.</text>
<line x1="1010" y1="356" x2="1010" y2="446" stroke="#DEE2E7" stroke-width="1"/>
<text x="1046" y="386" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">73%</text>
<text x="1046" y="416" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">dos servidores analisados têm nome de ferramenta repetido</text>
<rect x="60" y="482" width="1480" height="134" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="482" width="6" height="134" rx="0" fill="#2F5D8A"/>
<circle cx="112" cy="524" r="20" fill="#2F5D8A"/>
<text x="112" y="531" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="150" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A máquina sabe quem você é?</text>
<text x="150" y="544" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">ligação de entidade</text>
<text x="150" y="586" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O resultado não é ser citado errado. É não ser citado — falha silenciosa.</text>
<line x1="1010" y1="504" x2="1010" y2="594" stroke="#DEE2E7" stroke-width="1"/>
<text x="1046" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">atribuição suprimida</text>
<text x="1046" y="564" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">quando a desambiguação de nome falha</text>
<rect x="60" y="630" width="1480" height="134" rx="10" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="630" width="6" height="134" rx="0" fill="#2F5D8A"/>
<circle cx="112" cy="672" r="20" fill="#2F5D8A"/>
<text x="112" y="679" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="150" y="666" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que a máquina aprende sobre você?</text>
<text x="150" y="692" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">qualidade de corpus</text>
<text x="150" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Duas versões da sua API no corpus ensinam versões concorrentes de você mesmo.</text>
<line x1="1010" y1="652" x2="1010" y2="742" stroke="#DEE2E7" stroke-width="1"/>
<text x="1046" y="682" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">conflito intra-memória</text>
<text x="1046" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">incongruência no treino vira inconsistência nos pesos</text>
<rect x="60" y="790" width="1480" height="72" rx="10" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="88" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O QUE AMBIGUIDADE NÃO EXPLICA</text>
<text x="88" y="846" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Comunidade, economia e presença acumulada em dado de treino. Uma variável que explica tudo não explica nada.</text>
<line x1="60" y1="914" x2="1540" y2="914" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="940" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Fontes: arXiv 2512.23214 (Anka) · arXiv 2602.18914 (descrições MCP, preprint) · literatura de entity disambiguation · arXiv 2403.08319.</text></svg>