<text x="76" y="660" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Separate the human and canonical circuits</text>
<text x="716" y="660" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">Author's reasoning</text>
<text x="1026" y="660" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">no published conversion data</text>
<text x="76" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ambiguity affects parametric knowledge</text>
<text x="716" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="start">Open question</text>
<text x="1026" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">found no study measuring it</text>
<rect x="60" y="770" width="1480" height="66" rx="10" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/>
<text x="88" y="798" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">WHAT THAT COSTS</text>
<text x="88" y="822" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Three of the ten claims are my own reasoning or open questions. I would rather say so than present everything with equal confidence.</text>
