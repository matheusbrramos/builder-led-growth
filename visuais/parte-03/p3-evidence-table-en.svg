<text x="76" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Markdown reduces tokens</text>
<text x="716" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Range without a standard</text>
<text x="1026" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">25% to 87% across studies — not a margin of error</text>
<text x="76" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Context cost is a retention decision</text>
