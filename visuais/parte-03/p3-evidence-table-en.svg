<text x="716" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Literature review</text>
<text x="1026" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">arXiv 2403.08319</text>
<rect x="60" y="428" width="1480" height="52" rx="6" fill="#F7F8FA"/>
<text x="76" y="452" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Facts compete for model capacity</text>
