<text x="1026" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">arXiv 2512.23214, validated on 2 models</text>
<text x="76" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">73% of MCP servers have repeated names</text>
<text x="716" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Survey</text>
<text x="1026" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">arXiv 2602.18914 — preprint, 10,000+ servers</text>
<rect x="60" y="324" width="1480" height="52" rx="6" fill="#F7F8FA"/>
<text x="76" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Failed disambiguation suppresses attribution</text>
<text x="716" y="348" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">Documented mechanism</text>
