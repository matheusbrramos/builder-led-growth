<rect x="60" y="220" width="1480" height="52" rx="6" fill="#F7F8FA"/>
<text x="76" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Constrained syntax beats a familiar language</text>
