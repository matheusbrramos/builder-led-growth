<text x="60" y="910" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, parte 3 — pilar 1, legibilidade por máquina.</text></svg>