<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810"><rect x="0" y="0" width="1600" height="810" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="810" rx="0" fill="#2F5D8A"/>
<text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O PONTO EM QUE AS DUAS OTIMIZAÇÕES DIVERGEM</text>
<text x="60" y="104" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que atrai o humano confunde a máquina</text>
<text x="60" y="136" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Até aqui os dois interesses vinham convergindo. Na estratégia de conteúdo, não</text>
<rect x="60" y="200" width="620" height="340" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="60" y="200" width="620" height="6" rx="0" fill="#2F7D5D"/>
<text x="90" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">O HUMANO PRECISA DE</text>
<text x="90" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Repetição em formatos</text>
<text x="90" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">variados</text>
<text x="90" y="376" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Ele esquece e se distrai. A mesma ideia precisa</text>
<text x="90" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">encontrá-lo no feed, no e-mail e no vídeo curto,</text>
<text x="90" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">e cada encontro reforça o anterior.</text>
<text x="90" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start"></text>
<text x="90" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Atomização é alcance.</text>
<rect x="920" y="200" width="620" height="340" rx="10" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/>
<rect x="920" y="200" width="620" height="6" rx="0" fill="#9C4A3C"/>
<text x="950" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">A MÁQUINA PRECISA DE</text>
<text x="950" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Afirmação única</text>
<text x="950" y="322" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">e consistente</text>
<text x="950" y="376" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Doze peças que dizem o mesmo ocupam capacidade.</text>
<text x="950" y="398" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Cada adaptação simplifica diferente, e simplificações</text>
<text x="950" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">incompatíveis viram conflito nos pesos.</text>
<text x="950" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start"></text>
<text x="950" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Atomização é ruído com custo.</text>
<path d="M760.0,356.0 l-28,0 m5,-5 l-5,5 l5,5" stroke="#8B93A1" stroke-width="2.5" fill="none"/>
<path d="M840.0,356.0 l28,0 m-5,-5 l5,5 l-5,5" stroke="#8B93A1" stroke-width="2.5" fill="none"/>
<rect x="60" y="576" width="1480" height="108" rx="10" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/>
<text x="88" y="608" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">A VERSÃO PRECISA — E O CONTRAPONTO QUE A PRODUZIU</text>
<text x="88" y="638" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Não é que menos conteúdo seja melhor. É que conteúdo que diz coisas diferentes vale mais que conteúdo que diz o mesmo de doze jeitos.</text>
<text x="88" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Há pesquisa mostrando que remover quase-duplicatas piora o treino — elas diferem em semântica. O que pesa é variação de conteúdo, não de formato.</text>
<line x1="60" y1="744" x2="1540" y2="744" stroke="#DEE2E7" stroke-width="1"/>
<text x="60" y="770" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Encaminhamento proposto: separar os circuitos. Conteúdo humano nos canais humanos; fonte canônica única na superfície de máquina.</text></svg>