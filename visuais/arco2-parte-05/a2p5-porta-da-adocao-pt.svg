<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="920" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="920" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">NA PORTA DA ADOÇÃO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Na adoção, o produto vira premissa, e quem decide se ele fica deixa de ser o par</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">De um lado da porta, tirar custa horas; do outro, custa um projeto</text><rect x="60" y="196" width="675.0" height="420" rx="14" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="2"/><rect x="60" y="196" width="675.0" height="7" rx="0" fill="#2F5D8A"/><text x="90" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">CONSTRUÇÃO</text><text x="90" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">TIRAR CUSTA</text><text x="90" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">horas de retrabalho</text><text x="90" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">QUEM DECIDE</text><text x="90" y="408" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">o par, e quem paga quando o custo aparece</text><line x1="90" y1="458" x2="705.0" y2="458" stroke="#2F5D8A" stroke-width="1.2"/><text x="90" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">O QUE MEDIR</text><text x="90" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a primeira chamada bem-sucedida</text><text x="90" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">quem parou depois de funcionar e depois de errar</text><text x="90" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">por que um fornecedor foi trocado</text><rect x="865.0" y="196" width="675.0" height="420" rx="14" fill="#F5EBDD" stroke="#B8792E" stroke-width="2"/><rect x="865.0" y="196" width="675.0" height="7" rx="0" fill="#B8792E"/><text x="895.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">ADOÇÃO</text><text x="895.0" y="294" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">TIRAR CUSTA</text><text x="895.0" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">um projeto</text><text x="895.0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">QUEM DECIDE</text><text x="895.0" y="408" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">a economia humana: contrato, preço,</text><text x="895.0" y="432" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">suporte, a dor de migrar</text><line x1="895.0" y1="458" x2="1510.0" y2="458" stroke="#B8792E" stroke-width="1.2"/><text x="895.0" y="492" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">O QUE MEDIR</text><text x="895.0" y="524" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">entregas sem parar para consertar a integração</text><text x="895.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">vezes que o agente relê a documentação</text><text x="895.0" y="576" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">tempo sem aparecer num plano como problema</text><rect x="755.0" y="196" width="90" height="420" rx="10" fill="#16213E"/><circle cx="823.0" cy="406.0" r="6" fill="#B8792E"/><text x="794.0" y="406.0" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="3" transform="rotate(-90 794.0 406.0)">PORTA DA ADOÇÃO</text><rect x="60" y="644" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Ativos coespecializados (David Teece, 1986): um depende do outro, nos dois sentidos</text><text x="92" y="710" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Valor no BLG é uma taxa: quanto o par avança com o seu produto por unidade de atrito — não quantos ficaram</text><rect x="60" y="768" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="768" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="807" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O Builder-Led Growth decide quem entra; a economia humana decide quem fica.</text><line x1="60" y1="854" x2="1540" y2="854" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Teece (1986), via Springer · valor como taxa, a definição usada nesta série</text></svg>