<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE LANGUAGE THE GATE ALREADY SPEAKS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What ISO/IEC 25010 changed in November 2023</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The software product quality standard gained words for integrating without breaking things</text><rect x="60" y="196" width="600" height="250" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="88" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="2">RENAMED</text><text x="88" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Usability</text><text x="298" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">→</text><text x="338" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Interaction capability</text><text x="88" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Portability</text><text x="298" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">→</text><text x="338" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Flexibility</text><rect x="690" y="196" width="850" height="250" rx="14" fill="#E6F0EA" stroke="#2F7D5D" stroke-width="2"/><rect x="690" y="196" width="850" height="7" rx="0" fill="#2F7D5D"/><text x="718" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">ADDED AS A NEW CHARACTERISTIC</text><text x="718" y="280" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Safety, with five subcharacteristics</text><rect x="718" y="312" width="242.8" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="839.4" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Operational constraint</text><rect x="974.8" y="312" width="214.6" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="1082.1" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Risk identification</text><rect x="1203.3999999999999" y="312" width="120.60000000000001" height="42" rx="21" fill="#2F7D5D" stroke="#2F7D5D" stroke-width="1.5"/><text x="1263.6999999999998" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Fail safe</text><rect x="1338.0" y="312" width="167.6" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="1421.8" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Hazard warning</text><rect x="718" y="370" width="186.4" height="42" rx="21" fill="#2F7D5D" stroke="#2F7D5D" stroke-width="1.5"/><text x="811.2" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Safe integration</text><rect x="60.0" y="472" width="725.0" height="170" rx="14" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="60.0" y="472" width="6" height="170" rx="0" fill="#2F7D5D"/><text x="90.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">SAFE INTEGRATION</text><text x="90.0" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Degree to which a product can maintain safety</text><text x="90.0" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">during and after integration with other components</text><rect x="815.0" y="472" width="725.0" height="170" rx="14" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="815.0" y="472" width="6" height="170" rx="0" fill="#2F7D5D"/><text x="845.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">FAIL SAFE</text><text x="845.0" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Degree to which a product can place itself in a safe</text><text x="845.0" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">mode, or revert to a safe condition, when it fails</text><rect x="60" y="668" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="704" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Caveat: the standard's safety concerns risk to life, health, property and the environment</text><text x="92" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">That is narrower than "what breaks when the agent integrates". The vocabulary serves; the scope is not identical</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Saying that when the call fails no e-mail goes out twice and nothing is left half done is speaking the gate's language.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · ISO/IEC 25010:2023, foreword (official preview) · definitions via iso25000.com, a specialist portal</text></svg>