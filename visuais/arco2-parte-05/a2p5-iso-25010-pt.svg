<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">A LÍNGUA QUE O PORTÃO JÁ FALA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O que a ISO/IEC 25010 mudou em novembro de 2023</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A norma de qualidade de produto de software ganhou palavras para integrar sem quebrar</text><rect x="60" y="196" width="600" height="250" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="88" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="2">MUDARAM DE NOME</text><text x="88" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Usabilidade</text><text x="298" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">→</text><text x="338" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Capacidade de interação</text><text x="88" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Portabilidade</text><text x="298" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">→</text><text x="338" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Flexibilidade</text><rect x="690" y="196" width="850" height="250" rx="14" fill="#E6F0EA" stroke="#2F7D5D" stroke-width="2"/><rect x="690" y="196" width="850" height="7" rx="0" fill="#2F7D5D"/><text x="718" y="240" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">ENTROU COMO CARACTERÍSTICA NOVA</text><text x="718" y="280" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Safety, com cinco subcaracterísticas</text><rect x="718" y="312" width="233.4" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="834.7" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Restrição operacional</text><rect x="965.4" y="312" width="242.8" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="1086.8" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Identificação de risco</text><rect x="1222.2" y="312" width="148.8" height="42" rx="21" fill="#2F7D5D" stroke="#2F7D5D" stroke-width="1.5"/><text x="1296.6000000000001" y="339" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Falha segura</text><rect x="718" y="370" width="177.0" height="42" rx="21" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="806.5" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">Aviso de perigo</text><rect x="909.0" y="370" width="195.8" height="42" rx="21" fill="#2F7D5D" stroke="#2F7D5D" stroke-width="1.5"/><text x="1006.9" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Integração segura</text><rect x="60.0" y="472" width="725.0" height="170" rx="14" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="60.0" y="472" width="6" height="170" rx="0" fill="#2F7D5D"/><text x="90.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">INTEGRAÇÃO SEGURA</text><text x="90.0" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Grau em que o produto mantém a segurança durante</text><text x="90.0" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e depois da integração com um ou mais componentes</text><rect x="815.0" y="472" width="725.0" height="170" rx="14" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="2"/><rect x="815.0" y="472" width="6" height="170" rx="0" fill="#2F7D5D"/><text x="845.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">FALHA SEGURA</text><text x="845.0" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Grau em que o produto se põe sozinho num modo</text><text x="845.0" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">seguro, ou volta a uma condição segura, quando falha</text><rect x="60" y="668" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="704" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Ressalva: o safety da norma trata de risco a vida, saúde, patrimônio e ambiente</text><text x="92" y="734" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">É mais estreito do que "o que quebra quando o agente integra". O vocabulário serve; o escopo não é idêntico</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#E6F0EA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#2F7D5D"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Dizer que, quando a chamada falha, nenhum e-mail sai duplicado e nada fica pela metade é falar a língua do portão.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · ISO/IEC 25010:2023, prefácio (prévia oficial) · definições via iso25000.com, portal especializado</text></svg>