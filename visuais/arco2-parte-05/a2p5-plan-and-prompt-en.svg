<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE BUILDER'S VETO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The decision to take a product out happens in the plan, not the permission prompt</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The person building approves nearly every permission prompt and rejects four out of ten plans</text><rect x="60" y="200" width="800" height="400" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="90" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHERE THE REJECTION HAPPENS</text><text x="90" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Rejected by the person, in Claude Code</text><text x="90" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Permission prompts</text><rect x="90" y="340" width="717.8" height="46" rx="0" fill="#C7CDD5"/><rect x="807.8" y="340" width="22.200000000000045" height="46" rx="0" fill="#9C4A3C"/><text x="106" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">97% approved</text><text x="830" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="end">3% rejected</text><text x="90" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Plans presented for approval</text><rect x="90" y="450" width="451.4" height="46" rx="0" fill="#C7CDD5"/><rect x="541.4" y="450" width="288.6" height="46" rx="0" fill="#9C4A3C"/><text x="830" y="520" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="end">39% rejected</text><text x="90" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">In the company's own reading, an approval rate that high suggests</text><text x="90" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">many users click through reflexively rather than reviewing each command</text><rect x="890" y="200" width="650" height="400" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="920" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">ATTENTION DROPS WITH VOLUME</text><text x="920" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Dangerous commands blocked</text><rect x="980" y="347.0" width="130" height="153.0" rx="6" fill="#B8792E" stroke="#B8792E" stroke-width="1.5"/><text x="1045" y="333.0" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">~17%</text><text x="1045" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">early in a session</text><rect x="1240" y="455.0" width="130" height="45.0" rx="6" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/><text x="1305" y="441.0" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">~5%</text><text x="1305" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">after 50 prompts</text><line x1="950" y1="500" x2="1500" y2="500" stroke="#DEE2E7" stroke-width="1.5"/><text x="920" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">13.6% blocked overall · 1,053 paid testers in a</text><text x="920" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">controlled experiment; they knew they were evaluated</text><rect x="60" y="628" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">In the plan, your product does not appear as a product: it appears as a step</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">"Step 3: add the e-mail service", followed by the technical specifications it requires — and every line depending on another person is a reason to reject</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">Auto mode takes the person out of the permission prompt. It does not take them out of the plan, where they should be.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Anthropic, 7 August 2026 — the agent's maker, in the post announcing auto mode as the default</text></svg>