1480" height="104" rx="12" fill="#E6F0EA"/><rect x="60" y="444" width="6" height="104" rx="0" fill="#2F7D5D"/><text x="88" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">TRACE 3</text><text x="88" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Successful calls,</text><text x="88" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">then silence</text><rect x="490" y="483.0" width="26" height="26" rx="4" fill="#16213E"/><circle cx="546" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="580" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="614" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="648" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="682" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="716" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="750" cy="496.0" r="11" fill="#2F7D5D"/><line x1="784" y1="496.0" x2="1110" y2="496.0" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="1140" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Integrated and taken out</text><text x="1140" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the discard</text><rect x="60" y="566" width="20" height="20" rx="3" fill="#16213E"/><text x="104" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">key created</text><circle cx="243.6" cy="576" r="9" fill="#2F7D5D"/><text x="277.6" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">successful call</text><circle cx="447.6" cy="576" r="9" fill="#9C4A3C"/><text x="481.6" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">error</text><line x1="565.6" y1="576" x2="599.6" y2="576" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="609.6" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">silence</text><rect x="60" y="610" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Telling the three apart takes little that is new</text><text x="92" y="676" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Flag the first successful call, when usage stopped and whether the caller is an agent or a person; count weekly who stopped after working and after failing</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">In construction, what is missing is a measure of the exit that happened and nobody saw.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the author's proposal from the mechanism; as of 6 October 2026, no agent-measurement platform measures removal from real code</text></svg>