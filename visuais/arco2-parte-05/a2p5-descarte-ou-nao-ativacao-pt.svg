<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O DESCARTE QUE SE CONFUNDE COM A NÃO ATIVAÇÃO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três rastros que o funil de ativação conta como um só</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">No painel, as três contas viram o mesmo número: conta criada que não ativou</text><rect x="60" y="200" width="1480" height="104" rx="12" fill="#F7F8FA"/><rect x="60" y="200" width="6" height="104" rx="0" fill="#5B6472"/><text x="88" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="2">RASTRO 1</text><text x="88" y="266" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Chave criada, nenhuma</text><text x="88" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">chamada bem-sucedida</text><rect x="490" y="239.0" width="26" height="26" rx="4" fill="#16213E"/><circle cx="546" cy="252.0" r="11" fill="#FFFFFF" stroke="#8B93A1" stroke-width="2"/><line x1="580" y1="252.0" x2="1110" y2="252.0" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="1140" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start">Nunca chegou à construção</text><text x="1140" y="272" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">problema de aquisição</text><rect x="60" y="322" width="1480" height="104" rx="12" fill="#F5E6E2"/><rect x="60" y="322" width="6" height="104" rx="0" fill="#9C4A3C"/><text x="88" y="360" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">RASTRO 2</text><text x="88" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Sequência de erros,</text><text x="88" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">depois silêncio</text><rect x="490" y="361.0" width="26" height="26" rx="4" fill="#16213E"/><circle cx="546" cy="374.0" r="11" fill="#9C4A3C"/><circle cx="580" cy="374.0" r="11" fill="#9C4A3C"/><circle cx="614" cy="374.0" r="11" fill="#9C4A3C"/><circle cx="648" cy="374.0" r="11" fill="#9C4A3C"/><circle cx="682" cy="374.0" r="11" fill="#9C4A3C"/><circle cx="716" cy="374.0" r="11" fill="#9C4A3C"/><line x1="750" y1="374.0" x2="1110" y2="374.0" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="1140" y="368" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Veto da máquina</text><text x="1140" y="394" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">assinatura provável</text><rect x="60" y="444" width="1480" height="104" rx="12" fill="#E6F0EA"/><rect x="60" y="444" width="6" height="104" rx="0" fill="#2F7D5D"/><text x="88" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="2">RASTRO 3</text><text x="88" y="510" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Chamadas bem-sucedidas,</text><text x="88" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">depois silêncio</text><rect x="490" y="483.0" width="26" height="26" rx="4" fill="#16213E"/><circle cx="546" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="580" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="614" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="648" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="682" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="716" cy="496.0" r="11" fill="#2F7D5D"/><circle cx="750" cy="496.0" r="11" fill="#2F7D5D"/><line x1="784" y1="496.0" x2="1110" y2="496.0" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="1140" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Integrado e tirado</text><text x="1140" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">o descarte</text><rect x="60" y="566" width="20" height="20" rx="3" fill="#16213E"/><text x="104" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">chave criada</text><circle cx="251.2" cy="576" r="9" fill="#2F7D5D"/><text x="285.2" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">chamada bem-sucedida</text><circle cx="493.2" cy="576" r="9" fill="#9C4A3C"/><text x="527.2" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">erro</text><line x1="603.6" y1="576" x2="637.6" y2="576" stroke="#8B93A1" stroke-width="2.5" stroke-dasharray="6 8"/><text x="647.6" y="581" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">silêncio</text><rect x="60" y="610" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Separar os três exige pouca coisa nova</text><text x="92" y="676" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Marcar a primeira chamada bem-sucedida, quando o uso parou e se quem chama é agente ou pessoa; contar por semana quem parou depois de funcionar e depois de errar</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F5E6E2"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#9C4A3C"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">Na construção, falta medir a saída que aconteceu e ninguém viu.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · proposta do autor a partir do mecanismo; até 6 de outubro de 2026, nenhuma plataforma de medição de agentes mede remoção em código real</text></svg>