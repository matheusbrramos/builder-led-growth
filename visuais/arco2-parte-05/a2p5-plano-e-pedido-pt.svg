<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O VETO DE QUEM CONSTRÓI</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A decisão de tirar um produto acontece no plano, não no pedido de permissão</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quem constrói aprova quase todo pedido de permissão e recusa quatro em cada dez planos</text><rect x="60" y="200" width="800" height="400" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="90" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">ONDE A RECUSA ACONTECE</text><text x="90" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Recusado pela pessoa, no Claude Code</text><text x="90" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Pedidos de permissão</text><rect x="90" y="340" width="717.8" height="46" rx="0" fill="#C7CDD5"/><rect x="807.8" y="340" width="22.200000000000045" height="46" rx="0" fill="#9C4A3C"/><text x="106" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">97% aprovados</text><text x="830" y="410" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="end">3% recusados</text><text x="90" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Planos apresentados para aprovação</text><rect x="90" y="450" width="451.4" height="46" rx="0" fill="#C7CDD5"/><rect x="541.4" y="450" width="288.6" height="46" rx="0" fill="#9C4A3C"/><text x="830" y="520" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="end">39% recusados</text><text x="90" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Na leitura da própria empresa, uma taxa de aprovação tão alta sugere</text><text x="90" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">que muita gente clica por reflexo em vez de revisar cada comando</text><rect x="890" y="200" width="650" height="400" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="920" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">A ATENÇÃO CAI COM O VOLUME</text><text x="920" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Comandos perigosos barrados</text><rect x="980" y="347.0" width="130" height="153.0" rx="6" fill="#B8792E" stroke="#B8792E" stroke-width="1.5"/><text x="1045" y="333.0" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">~17%</text><text x="1045" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">começo da sessão</text><rect x="1240" y="455.0" width="130" height="45.0" rx="6" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/><text x="1305" y="441.0" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle">~5%</text><text x="1305" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">depois de 50 pedidos</text><line x1="950" y1="500" x2="1500" y2="500" stroke="#DEE2E7" stroke-width="1.5"/><text x="920" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">13,6% barrados no total · 1.053 testadores pagos, em</text><text x="920" y="582" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">experimento controlado; sabiam que eram avaliados</text><rect x="60" y="628" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">No plano, o seu produto não aparece como produto: aparece como um passo</text><text x="92" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">"Passo 3: incluir o serviço de e-mail", seguido das especificações técnicas que ele exige — e cada linha que depende de outra pessoa é um motivo para recusar</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#E7EEF4"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#2F5D8A"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O modo automático tira a pessoa do pedido de permissão. Não tira do plano, e é no plano que ela deveria estar.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Anthropic, 7 de agosto de 2026 — a fabricante do agente, no post que anunciou o modo automático como padrão</text></svg>