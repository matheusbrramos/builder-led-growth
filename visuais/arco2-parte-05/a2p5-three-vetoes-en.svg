<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="920" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="920" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE THREE VETOES OF CONSTRUCTION</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three parties can take your product out of the code, each on its own clock</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The first is not a person, and none of the three shows up on the seller's dashboard</text><line x1="60" y1="196" x2="1520" y2="196" stroke="#C7CDD5" stroke-width="2"/><polygon points="1540,196 1520,188 1520,204" fill="#C7CDD5"/><text x="60" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">FIRST LINE OF CODE</text><text x="1540" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="end" letter-spacing="1.5">PREMISE OF WHAT WAS SHIPPED</text><rect x="60.0" y="226" width="470" height="400" rx="14" fill="#F5E6E2"/><rect x="60.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="60.0" y="226" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="86.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">VETO 1 · THE MACHINE'S</text><text x="86.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The integration fails</text><text x="86.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">clock: seconds</text><text x="86.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">49 s vs 43 min</text><text x="86.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">the same task on Codex, with Firecrawl and with Circle</text><line x1="86.0" y1="442" x2="504.0" y2="442" stroke="#9C4A3C" stroke-width="1.2"/><text x="86.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The agent does not announce a veto:</text><text x="86.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">it announces it found an alternative.</text><text x="86.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">An error saying only "Request</text><text x="86.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">failed" hands the turn to the</text><text x="86.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">competitor; one naming the cause and</text><text x="86.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">expected format lets the agent fix it</text><rect x="565.0" y="226" width="470" height="400" rx="14" fill="#E7EEF4"/><rect x="565.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="565.0" y="226" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="591.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">VETO 2 · THE BUILDER'S</text><text x="591.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The plan is rejected</text><text x="591.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">clock: hours</text><text x="591.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">39% vs 3%</text><text x="591.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">plans rejected against permission prompts rejected</text><line x1="591.0" y1="442" x2="1009.0" y2="442" stroke="#2F5D8A" stroke-width="1.2"/><text x="591.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The product appears in the plan as a</text><text x="591.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">step with technical specifications.</text><text x="591.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Every line depending on someone</text><text x="591.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">outside the conversation — DNS, a</text><text x="591.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">purchase, a key from another team —</text><text x="591.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">is a reason for the person to reject</text><rect x="1070.0" y="226" width="470" height="400" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="226" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">VETO 3 · THE PAYER'S</text><text x="1096.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The cost shows up</text><text x="1096.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">clock: at sign-up or at a usage threshold</text><text x="1096.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">78%</text><text x="1096.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">IT leaders hit by unexpected usage or AI charges</text><line x1="1096.0" y1="442" x2="1514.0" y2="442" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The one deciding was not in the</text><text x="1096.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conversation between person and</text><text x="1096.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">agent. At sign-up, someone else</text><text x="1096.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">holds the card; with usage, the</text><text x="1096.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">bill crosses a threshold and</text><text x="1096.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">someone asks what it is</text><rect x="60" y="654" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">What is left, in all three cases, is a key created, a few calls and silence</text><text x="92" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">That is the discard: an exit with no cancellation, no complaint and no warning, which on the seller's dashboard looks like an account that never used the product</text><rect x="60" y="768" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="768" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="807" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Being created is not staying: between the first line of code and adoption, the product passes three vetoes.</text><line x1="60" y1="854" x2="1540" y2="854" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Lightsage (30 Aug 2026, company material) · Anthropic (7 Aug 2026, the maker on its own product) · Zylo, 2026 SaaS Management Index (vendor)</text></svg>