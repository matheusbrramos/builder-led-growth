<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="920" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="920" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">OS TRÊS VETOS DA CONSTRUÇÃO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três partes podem tirar o seu produto do código, cada uma com o seu relógio</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A primeira não é uma pessoa, e nenhuma das três aparece no painel de quem vende</text><line x1="60" y1="196" x2="1520" y2="196" stroke="#C7CDD5" stroke-width="2"/><polygon points="1540,196 1520,188 1520,204" fill="#C7CDD5"/><text x="60" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="start" letter-spacing="1.5">PRIMEIRA LINHA DE CÓDIGO</text><text x="1540" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#5B6472" text-anchor="end" letter-spacing="1.5">PREMISSA DO QUE FOI ENTREGUE</text><rect x="60.0" y="226" width="470" height="400" rx="14" fill="#F5E6E2"/><rect x="60.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="60.0" y="226" width="470" height="7" rx="0" fill="#9C4A3C"/><text x="86.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="2">VETO 1 · DA MÁQUINA</text><text x="86.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A integração falha</text><text x="86.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">relógio: segundos</text><text x="86.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">49 s × 43 min</text><text x="86.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">a mesma tarefa no Codex, com Firecrawl e com Circle</text><line x1="86.0" y1="442" x2="504.0" y2="442" stroke="#9C4A3C" stroke-width="1.2"/><text x="86.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O agente não avisa que vetou: avisa</text><text x="86.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que achou uma alternativa. Erro que</text><text x="86.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">diz só "Request failed" entrega a</text><text x="86.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">vez ao concorrente; erro que nomeia</text><text x="86.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a causa e o formato esperado deixa</text><text x="86.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o agente consertar sozinho</text><rect x="565.0" y="226" width="470" height="400" rx="14" fill="#E7EEF4"/><rect x="565.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="565.0" y="226" width="470" height="7" rx="0" fill="#2F5D8A"/><text x="591.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">VETO 2 · DE QUEM CONSTRÓI</text><text x="591.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O plano é recusado</text><text x="591.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">relógio: horas</text><text x="591.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">39% × 3%</text><text x="591.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">planos recusados contra pedidos de permissão recusados</text><line x1="591.0" y1="442" x2="1009.0" y2="442" stroke="#2F5D8A" stroke-width="1.2"/><text x="591.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O produto aparece no plano como um</text><text x="591.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">passo com especificações técnicas.</text><text x="591.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Cada linha que depende de alguém</text><text x="591.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">fora da conversa — DNS, compra,</text><text x="591.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">chave de outra área — é um motivo</text><text x="591.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">para a pessoa recusar</text><rect x="1070.0" y="226" width="470" height="400" rx="14" fill="#F5EBDD"/><rect x="1070.0" y="226" width="470" height="400" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="1070.0" y="226" width="470" height="7" rx="0" fill="#B8792E"/><text x="1096.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="2">VETO 3 · DE QUEM PAGA</text><text x="1096.0" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O custo aparece</text><text x="1096.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">relógio: na assinatura ou no limite de consumo</text><text x="1096.0" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">78%</text><text x="1096.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">líderes de TI com cobrança inesperada por consumo ou IA</text><line x1="1096.0" y1="442" x2="1514.0" y2="442" stroke="#B8792E" stroke-width="1.2"/><text x="1096.0" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Quem decide não estava na conversa</text><text x="1096.0" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">entre a pessoa e o agente. Na</text><text x="1096.0" y="518" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">assinatura, o cartão está com outra</text><text x="1096.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">pessoa; no consumo, a conta passa</text><text x="1096.0" y="562" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">de um limite e alguém pergunta o</text><text x="1096.0" y="584" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">que é aquilo</text><rect x="60" y="654" width="1480" height="88" rx="14" fill="#16213E"/><text x="92" y="690" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">O que fica, nos três casos, é uma chave criada, algumas chamadas e silêncio</text><text x="92" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">É o descarte: a saída sem cancelamento, sem reclamação e sem aviso, que no painel de quem vende parece uma conta que nunca chegou a usar o produto</text><rect x="60" y="768" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="768" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="807" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Criar não é ficar: entre a primeira linha de código e a adoção, o produto passa por três vetos.</text><line x1="60" y1="854" x2="1540" y2="854" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="880" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Lightsage (30 ago 2026, material da empresa) · Anthropic (7 ago 2026, a fabricante sobre o próprio produto) · Zylo, 2026 SaaS Management Index (fornecedor)</text></svg>