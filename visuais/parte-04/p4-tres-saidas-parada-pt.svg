<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">CADA PARADA HUMANA</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">As três saídas, e só uma é boa</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O que acontece quando o fluxo exige uma pessoa no meio do caminho</text><rect x="60" y="314" width="300" height="300" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="210.0" y="376" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle" letter-spacing="3">PARADA</text><line x1="120" y1="400" x2="300" y2="400" stroke="#DEE2E7" stroke-width="1"/><text x="210.0" y="442" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">criar conta</text>
<text x="210.0" y="472" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">confirmar e-mail</text>
<text x="210.0" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">gerar chave</text>
<text x="210.0" y="532" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">colar cartão</text><rect x="560" y="250" width="960" height="108" rx="12" fill="#E6F0EA" stroke="#2F7D5D" stroke-width="1.5"/><text x="594" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O humano responde na hora</text><text x="594" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O agente continua.</text>
<text x="594" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Você foi adotado.</text><line x1="376" y1="464.0" x2="546" y2="304.0" stroke="#2F7D5D" stroke-width="2" marker-end="url(#a)"/><rect x="560" y="380" width="960" height="108" rx="12" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/><text x="594" y="420" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O humano responde depois</text><text x="594" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A sessão terminou.</text>
<text x="594" y="474" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">O contexto se perdeu.</text><line x1="376" y1="464.0" x2="546" y2="434.0" stroke="#B8792E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="560" y="510" width="960" height="168" rx="12" fill="#101A30" stroke="#101A30" stroke-width="2.5"/><text x="594" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">O agente segue com outra coisa</text><text x="594" y="580" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Sem log. Sem erro. Sem ticket.</text>
<text x="594" y="604" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Abandonado sem registro.</text><rect x="594" y="634" width="470" height="30" rx="6" fill="#B8792E" fill-opacity="0.9"/><text x="610" y="655" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start" letter-spacing="1.5">INVISÍVEL NA SUA INSTRUMENTAÇÃO</text><line x1="376" y1="464.0" x2="546" y2="594.0" stroke="#101A30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Frequência de cada saída: desconhecida. Por construção, a terceira não aparece nos dados de quem a sofre.</text></svg>