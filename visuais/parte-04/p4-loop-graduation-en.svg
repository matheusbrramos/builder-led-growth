<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE HUMAN-MACHINE LOOP</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">When the human should step in</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Human-in-the-loop: execution pauses for a human decision at defined points</text><rect x="60" y="240" width="1480" height="122" rx="12" fill="#E6F0EA" stroke="#2F7D5D" stroke-width="1.5"/><rect x="60" y="240" width="8" height="122" rx="0" fill="#2F7D5D"/><text x="100" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">AUTOMATIC EXECUTION</text><text x="100" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">reading and checking</text><text x="100" y="340" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">no stop</text><text x="1504" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="end" letter-spacing="0">1</text><rect x="60" y="384" width="1480" height="122" rx="12" fill="#E7EEF4" stroke="#2F5D8A" stroke-width="1.5"/><rect x="60" y="384" width="8" height="122" rx="0" fill="#2F5D8A"/><text x="100" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">ASYNCHRONOUS ESCALATION</text><text x="100" y="460" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conflicting data or missing information</text><text x="100" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">records, queues and carries on</text><text x="1504" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="end" letter-spacing="0">2</text><rect x="60" y="528" width="1480" height="122" rx="12" fill="#F5EBDD" stroke="#B8792E" stroke-width="1.5"/><rect x="60" y="528" width="8" height="122" rx="0" fill="#B8792E"/><text x="100" y="572" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">MANDATORY APPROVAL</text><text x="100" y="604" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">irreversible action, high cost, regulatory exception</text><text x="100" y="628" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">synchronous gate: stops and waits</text><text x="1504" y="598" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="end" letter-spacing="0">3</text><rect x="60" y="684" width="760" height="96" rx="12" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="96" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">CRITERION</text><text x="96" y="750" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Pause exactly where the cost of the error starts to exceed the cost of the interruption.</text><rect x="852" y="684" width="688" height="96" rx="12" fill="#B8792E" fill-opacity="0.12"/><rect x="852" y="684" width="688" height="96" rx="12" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="888" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">WHAT WE ADD</text><text x="888" y="742" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The variable to optimise isn't the number of stops.</text>
<text x="888" y="764" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">It's how much context is lost at each one.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Our proposal, not validated practice. The human cost of approving everything can exceed the cost of doing the task by hand.</text></svg>