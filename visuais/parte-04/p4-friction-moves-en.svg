<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">FRICTION DOESN'T DISAPPEAR</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">It reappears in the cheapest form available</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">With no authentication path a machine can walk on its own</text><rect x="60" y="235" width="560" height="400" rx="14" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1.5"/><text x="96" y="287" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What's missing</text><line x1="96" y1="307" x2="584" y2="307" stroke="#DEE2E7" stroke-width="1"/><text x="96" y="343" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A credential the machine</text>
<text x="96" y="370" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">cannot obtain on its own.</text>
<text x="96" y="397" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start"></text>
<text x="96" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Issuing with no process:</text>
<text x="96" y="451" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">78% of organisations have no</text>
<text x="96" y="478" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">documented policy.</text><rect x="780" y="235" width="760" height="400" rx="14" fill="#101A30"/><text x="816" y="287" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Where it reappears</text><line x1="816" y1="307" x2="1504" y2="307" stroke="#2C3A55" stroke-width="1"/><text x="816" y="403" font-family="Liberation Sans, Arial, sans-serif" font-size="92" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">28.65</text><text x="1080" y="403" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="400" font-style="normal" fill="#6E9CC4" text-anchor="start">million</text><text x="816" y="443" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">new secrets pasted directly into</text>
<text x="816" y="467" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">code on public GitHub, in 2025</text><rect x="816" y="497" width="330" height="96" rx="10" fill="#B8792E" fill-opacity="0.16"/><rect x="816" y="497" width="330" height="96" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="840" y="549" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">+34%</text><text x="840" y="577" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">year over year</text><rect x="1174" y="497" width="330" height="96" rx="10" fill="#B8792E" fill-opacity="0.16"/><rect x="1174" y="497" width="330" height="96" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="1198" y="549" font-family="Liberation Sans, Arial, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">+81.5%</text><text x="1198" y="577" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">in AI service credentials</text><line x1="636" y1="435.0" x2="764" y2="435.0" stroke="#2F5D8A" stroke-width="3" marker-end="url(#a)"/><text x="700" y="413.0" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">friction migrates</text><rect x="60" y="669" width="1480" height="62" rx="10" fill="#B8792E" fill-opacity="0.14"/><rect x="60" y="669" width="1480" height="62" rx="10" fill="none" stroke="#B8792E" stroke-width="1.5"/><text x="96" y="708" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">And the key that leaks is yours.</text><line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Sources: GitGuardian (2025) · Cloud Security Alliance · KPMG. The causal link between friction and leakage is our reasoning, not a study.</text></svg>