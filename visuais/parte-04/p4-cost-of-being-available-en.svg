<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="820" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE PERMANENT COST OF BEING AVAILABLE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three formats, three orders of magnitude</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Tokens spent before any call — paid by the customer, every session</text><text x="60" y="284" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three MCP servers</text><text x="60" y="310" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">~40 tools exposed</text><rect x="540" y="256" width="900" height="62" rx="8" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><rect x="540" y="256" width="900.0" height="62" rx="8" fill="#B8792E" fill-opacity="0.85"/><text x="1416.0" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="end">144,000</text><text x="60" y="414" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">50 Agent Skills installed</text><text x="60" y="440" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">progressive disclosure in three stages</text><rect x="540" y="386" width="900" height="62" rx="8" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><rect x="540" y="386" width="372.59733032741883" height="62" rx="8" fill="#2F5D8A" fill-opacity="0.85"/><text x="932.5973303274188" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">5,000</text><text x="60" y="544" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Code Mode (Cloudflare)</text><text x="60" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">~2,500 endpoints via typed SDK</text><rect x="540" y="516" width="900" height="62" rx="8" fill="#F7F8FA" stroke="#DEE2E7" stroke-width="1"/><rect x="540" y="516" width="120.0" height="62" rx="8" fill="#2F7D5D" fill-opacity="0.85"/><text x="680.0" y="556" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">1,000</text><text x="540" y="646" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="start">tokens, on a logarithmic scale — bars compare order of magnitude, not direct proportion</text><rect x="60" y="684" width="1480" height="66" rx="10" fill="#2F5D8A" fill-opacity="0.10"/><rect x="60" y="684" width="1480" height="66" rx="10" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="96" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The format you choose is a distribution decision, not an engineering one.</text><line x1="60" y1="754" x2="1540" y2="754" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Numbers from technical blogs and from vendors with a product in the space. The order of magnitude repeats across sources; the exact value doesn't.</text></svg>