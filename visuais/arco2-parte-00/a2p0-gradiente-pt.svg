<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DOIS FENÔMENOS, UM GRADIENTE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Recomendar e construir não são caixas separadas</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">O papel da máquina muda com a especificidade do que está sendo feito</text><line x1="90" y1="300" x2="1510" y2="300" stroke="#DEE2E7" stroke-width="3"/><circle cx="400.0" cy="300" r="15" fill="#2F7D5D"/><rect x="150.0" y="346" width="500" height="176" rx="14" fill="#E6F0EA"/><rect x="150.0" y="346" width="500" height="176" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="400.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle">RECOMENDAÇÃO</text><text x="400.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">A máquina aponta.</text><text x="400.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">A pessoa vai lá e compra.</text><text x="400.0" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#2F7D5D" text-anchor="middle">ela se apoia no corpus</text><circle cx="1200.0" cy="300" r="15" fill="#2F5D8A"/><rect x="950.0" y="346" width="500" height="176" rx="14" fill="#E7EEF4"/><rect x="950.0" y="346" width="500" height="176" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1200.0" y="384" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">CONSTRUÇÃO</text><text x="1200.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">A máquina escolhe, integra,</text><text x="1200.0" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">contrata em seu nome.</text><text x="1200.0" y="502" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="italic" fill="#2F5D8A" text-anchor="middle">ela é limitada pelo harness e pelo contexto</text><text x="800.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">quanto mais específica a tarefa →</text><rect x="150" y="566" width="1300" height="92" rx="14" fill="#F5EBDD"/><rect x="150" y="566" width="6" height="92" rx="0" fill="#B8792E"/><text x="190" y="610" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">98%</text><text x="276" y="604" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">verificam a recomendação da IA antes de comprar</text><text x="276" y="632" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Só 2% compram sem conferir · Idea Grove, 2026, mil consumidores nos EUA</text><rect x="60" y="708" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="708" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="747" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Validação humana não é peculiaridade de quem constrói software. É o padrão.</text><line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Idea Grove (2026) · Semrush (dez/2025)</text></svg>