<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="780" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="780" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHO DECIDES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A builder is the pair, not the machine</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Each does one thing, and neither decides alone</text><rect x="120" y="226" width="470" height="232" rx="14" fill="#E7EEF4"/><rect x="120" y="226" width="470" height="232" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="355.0" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">THE AGENT</text><text x="355.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">selects</text><text x="355.0" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Picks the piece, writes the code,</text><text x="355.0" y="391" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">integrates and moves on</text><rect x="1010" y="226" width="470" height="232" rx="14" fill="#F5EBDD"/><rect x="1010" y="226" width="470" height="232" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><text x="1245.0" y="268" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="2">THE PERSON</text><text x="1245.0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">validates</text><text x="1245.0" y="366" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Looks at the result, accepts or</text><text x="1245.0" y="391" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">undoes it — and pays the bill</text><text x="800.0" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="46" font-weight="700" font-style="normal" fill="#C7CDD5" text-anchor="middle">+</text><rect x="120" y="496" width="1360" height="92" rx="14" fill="#16213E"/><text x="800.0" y="536" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">The decision comes out of the pair, and the weight doesn't sit still</text><text x="800.0" y="570" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">The less experience the watcher has, and the less rule around them, the more it tips toward the machine</text><rect x="60" y="628" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="628" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="667" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The agent selects. The person validates. Neither decides alone.</text><line x1="60" y1="714" x2="1540" y2="714" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="740" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the definition the whole arc uses</text></svg>