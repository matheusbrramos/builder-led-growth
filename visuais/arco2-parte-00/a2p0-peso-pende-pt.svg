<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="760" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="760" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O CENTRO DE GRAVIDADE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O peso pende conforme quem está do lado humano</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Confiança alta na saída da IA, por tempo de estrada</text><rect x="120" y="250" width="1360" height="210" rx="14" fill="#F7F8FA"/><text x="154" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Quem diz confiar muito na saída da IA — pesquisa Stack Overflow</text><text x="154" y="360" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Aprendendo a programar</text><rect x="420" y="334" width="560" height="40" rx="6" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1"/><rect x="420" y="334" width="427.0" height="40" rx="6" fill="#2F7D5D"/><text x="863.0" y="361" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">6,1%</text><text x="154" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Experientes</text><rect x="420" y="396" width="560" height="40" rx="6" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1"/><rect x="420" y="396" width="175.0" height="40" rx="6" fill="#2F5D8A"/><text x="611.0" y="423" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">2,5%</text><text x="120" y="500" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#C7CDD5" text-anchor="start" letter-spacing="2">E O MESMO DESLOCA POR AMBIENTE</text><line x1="120" y1="518" x2="1480" y2="518" stroke="#DEE2E7" stroke-width="2"/><line x1="1140" y1="518" x2="1470" y2="518" stroke="#C7CDD5" stroke-width="2" marker-end="url(#a)"/><text x="120" y="552" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Pouca regra escrita → o agente decide mais</text><text x="1480" y="552" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="end">Registro, comitê, revisão → ele propõe mais e decide menos</text><rect x="60" y="608" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="608" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="647" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O par é o mesmo. O centro de gravidade, não.</text><line x1="60" y1="694" x2="1540" y2="694" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="720" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · Stack Overflow Developer Survey</text></svg>