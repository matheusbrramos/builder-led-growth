<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="740" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="740" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHO COMPETES WITH YOU</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The set is defined by the job, not by the category</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">When the builder needs a database that comes up and connects</text><rect x="500.0" y="226" width="600" height="78" rx="14" fill="#16213E"/><text x="800.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Bring up a database and connect</text><line x1="228.0" y1="322" x2="228.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="94.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="94.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="228.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">Another</text><text x="228.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">database</text><line x1="514.0" y1="322" x2="514.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="380.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="380.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="514.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">The service already</text><text x="514.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">bundled into the</text><text x="514.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">platform</text><line x1="800.0" y1="322" x2="800.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="666.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="666.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">The local file</text><text x="800.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">that does</text><text x="800.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">for now</text><line x1="1086.0" y1="322" x2="1086.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="952.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="952.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="1086.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">The instance the</text><text x="1086.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">team already</text><text x="1086.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">runs</text><line x1="1372.0" y1="322" x2="1372.0" y2="372" stroke="#B8792E" stroke-width="2" marker-end="url(#a)"/><rect x="1238.0" y="378" width="268" height="118" rx="12" fill="#F5EBDD"/><rect x="1238.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><text x="1372.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">The agent</text><text x="1372.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">writing it</text><text x="1372.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">themselves</text><text x="800.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">None of that sits in the same industry. All of it competes for the same progress.</text><rect x="60" y="588" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="588" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">The last one is the one whose price changed — and when it wins, nobody consulted your preference.</text><line x1="60" y1="674" x2="1540" y2="674" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · jobs to be done: Ulwick (1990), Moesta, Pedi and Palmer, Christensen (2003)</text></svg>