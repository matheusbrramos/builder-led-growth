<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="740" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="740" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">QUEM DISPUTA COM VOCÊ</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O conjunto é definido pelo trabalho, não pela categoria</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quando o builder precisa de um banco que suba e conecte</text><rect x="500.0" y="226" width="600" height="78" rx="14" fill="#16213E"/><text x="800.0" y="274" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Subir um banco e conectar</text><line x1="228.0" y1="322" x2="228.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="94.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="94.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="228.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">Outro banco</text><text x="228.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">de dados</text><line x1="514.0" y1="322" x2="514.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="380.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="380.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="514.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">O serviço já</text><text x="514.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">incluso na</text><text x="514.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">plataforma</text><line x1="800.0" y1="322" x2="800.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="666.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="666.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="800.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">O arquivo local</text><text x="800.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">que resolve</text><text x="800.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">por enquanto</text><line x1="1086.0" y1="322" x2="1086.0" y2="372" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a)"/><rect x="952.0" y="378" width="268" height="118" rx="12" fill="#E7EEF4"/><rect x="952.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#2F5D8A" stroke-width="1.5"/><text x="1086.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">A instância que</text><text x="1086.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">o time já tem</text><text x="1086.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="middle">rodando</text><line x1="1372.0" y1="322" x2="1372.0" y2="372" stroke="#B8792E" stroke-width="2" marker-end="url(#a)"/><rect x="1238.0" y="378" width="268" height="118" rx="12" fill="#F5EBDD"/><rect x="1238.0" y="378" width="268" height="118" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><text x="1372.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">O agente</text><text x="1372.0" y="450" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">escrevendo</text><text x="1372.0" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="17.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">por conta própria</text><text x="800.0" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="middle">Nada disso está no mesmo setor. Tudo disputa o mesmo avanço.</text><rect x="60" y="588" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="588" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="627" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">A última é a que mudou de preço — e quando ela vence, ninguém consultou a sua preferência.</text><line x1="60" y1="674" x2="1540" y2="674" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="700" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · trabalho a ser feito: Ulwick (1990), Moesta, Pedi e Palmer, Christensen (2003)</text></svg>