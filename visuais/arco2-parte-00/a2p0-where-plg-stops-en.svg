<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="800" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="800" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHERE PLG STOPS SERVING</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Five techniques designed for a human at the end</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">None of them is wrong — all of them assume someone who is no longer there</text><rect x="60.0" y="232" width="280.0" height="340" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><rect x="60.0" y="232" width="280.0" height="6" rx="0" fill="#2F5D8A"/><text x="200.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">The value moment</text><text x="84.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The person operates</text><text x="84.0" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and feels the value</text><line x1="84.0" y1="424" x2="316.0" y2="424" stroke="#DEE2E7" stroke-width="1"/><text x="84.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">UNDER BLG</text><text x="84.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Changes recipient:</text><text x="84.0" y="507" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">whoever receives the</text><text x="84.0" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">result is who feels it</text><rect x="360.0" y="232" width="280.0" height="340" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><rect x="360.0" y="232" width="280.0" height="6" rx="0" fill="#2F5D8A"/><text x="500.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Progressive disclosure</text><text x="384.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Show a little at a</text><text x="384.0" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">time, so as not to</text><text x="384.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">overwhelm</text><line x1="384.0" y1="424" x2="616.0" y2="424" stroke="#DEE2E7" stroke-width="1"/><text x="384.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">UNDER BLG</text><text x="384.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Withheld information</text><text x="384.0" y="507" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">becomes ambiguity —</text><text x="384.0" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">and ambiguity costs</text><rect x="660.0" y="232" width="280.0" height="340" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><rect x="660.0" y="232" width="280.0" height="6" rx="0" fill="#2F5D8A"/><text x="800.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Referral</text><text x="684.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">People refer for</text><text x="684.0" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">social reasons</text><line x1="684.0" y1="424" x2="916.0" y2="424" stroke="#DEE2E7" stroke-width="1"/><text x="684.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">UNDER BLG</text><text x="684.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Becomes sedimentation</text><text x="684.0" y="507" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">in the corpus: slower</text><text x="684.0" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">and not social</text><rect x="960.0" y="232" width="280.0" height="340" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><rect x="960.0" y="232" width="280.0" height="6" rx="0" fill="#2F5D8A"/><text x="1100.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Freemium</text><text x="984.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The user converts</text><text x="984.0" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">when they feel the limit</text><line x1="984.0" y1="424" x2="1216.0" y2="424" stroke="#DEE2E7" stroke-width="1"/><text x="984.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">UNDER BLG</text><text x="984.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The agent doesn't feel it:</text><text x="984.0" y="507" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">it consumes until the</text><text x="984.0" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">bill reaches someone</text><rect x="1260.0" y="232" width="280.0" height="340" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><rect x="1260.0" y="232" width="280.0" height="6" rx="0" fill="#2F5D8A"/><text x="1400.0" y="288" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle">Compliance floor</text><text x="1284.0" y="336" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Pure self-serve lived</text><text x="1284.0" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">where there was no</text><text x="1284.0" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">compliance</text><line x1="1284.0" y1="424" x2="1516.0" y2="424" stroke="#DEE2E7" stroke-width="1"/><text x="1284.0" y="456" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1">UNDER BLG</text><text x="1284.0" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The enterprise gate</text><text x="1284.0" y="507" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">exists without the</text><text x="1284.0" y="530" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">enterprise contract</text><rect x="60" y="648" width="1480" height="62" rx="12" fill="#F5EBDD"/><rect x="60" y="648" width="6" height="62" rx="0" fill="#B8792E"/><text x="92" y="687" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">One's best practice is the other's defect.</text><line x1="60" y1="734" x2="1540" y2="734" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="760" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the gate is real where it exists: 27% enforce strict