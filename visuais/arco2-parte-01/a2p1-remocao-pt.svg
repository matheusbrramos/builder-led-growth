<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O QUE A DELEGAÇÃO FAZ COM O CONJUNTO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Não é só que a pessoa deixa de escolher</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Quatro mecanismos medidos encolhem o conjunto de onde a escolha sairia</text><rect x="60.0" y="246" width="355" height="330" rx="14" fill="#E7EEF4"/><rect x="60.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="246" width="355" height="6" rx="0" fill="#2F5D8A"/><text x="84.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">O RECUPERADOR</text><text x="84.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">1,4 ou 7,4</text><text x="84.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Quantos candidatos o modelo</text><text x="84.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">chega a ver, sobre os MESMOS</text><text x="84.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">dados. Trocar uma peça de</text><text x="84.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">infraestrutura muda isso</text><text x="84.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2605.24660 · escopo: se a certa aparece</text><rect x="435.0" y="246" width="355" height="330" rx="14" fill="#F5EBDD"/><rect x="435.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="435.0" y="246" width="355" height="6" rx="0" fill="#B8792E"/><text x="459.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">O TAMANHO DO CATÁLOGO</text><text x="459.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">95% → 20%</text><text x="459.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Acurácia de selecionar a certa:</text><text x="459.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">84-95% com ~50 ferramentas,</text><text x="459.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">41-83% com 200, e 0-20% na</text><text x="459.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">maioria dos modelos com 740</text><text x="459.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2510.00307 · laboratório, catálogo sintético</text><rect x="810.0" y="246" width="355" height="330" rx="14" fill="#E6F0EA"/><rect x="810.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="810.0" y="246" width="355" height="6" rx="0" fill="#2F7D5D"/><text x="834.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">A ORDEM</text><text x="834.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">13% a 85%</text><text x="834.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O quanto a ordem sozinha move</text><text x="834.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">o desempenho. No meio de lista</text><text x="834.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">longa, a ferramenta certa é</text><text x="834.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">escolhida em 22% a 52%</text><text x="834.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2510.00307 · mesma ressalva</text><rect x="1185.0" y="246" width="355" height="330" rx="14" fill="#F5E6E2"/><rect x="1185.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1185.0" y="246" width="355" height="6" rx="0" fill="#9C4A3C"/><text x="1209.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">A BUSCA QUE NÃO ACONTECE</text><text x="1209.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">57,8%</text><text x="1209.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Das repetições não acionaram</text><text x="1209.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">busca na web. Sem busca, o</text><text x="1209.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">conjunto vem inteiro do que o</text><text x="1209.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">modelo já traz de fábrica</text><text x="1209.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2604.07585 · via citação em revisão</text><rect x="60" y="610" width="1480" height="78" rx="14" fill="#16213E"/><text x="800.0" y="644" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">A delegação encolhe o conjunto de onde a escolha sairia</text><text x="800.0" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Quem já é padrão de categoria ganha. Quem disputa o segundo lugar não é escolhido nem comparado</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Medido no comportamento: bibliotecas populares em até 48% dos casos, Python em 58%.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · arXiv 2605.24660 · BiasBusters (ICLR 2026) · arXiv 2604.07585 · arXiv 2503.17181 (ACL 2026)</text></svg>