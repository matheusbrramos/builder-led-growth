<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="860" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">DOIS PLANOS DO MESMO FENÔMENO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Funil dentro da sessão, flywheel entre sessões</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">E o que atravessa de uma sessão para a outra vive em três camadas</text><rect x="120" y="250" width="560" height="300" rx="14" fill="#E7EEF4"/><rect x="120" y="250" width="560" height="300" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="148" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">DENTRO DA SESSÃO</text><rect x="190.0" y="324" width="420" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="400.0" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Candidatura</text><rect x="250.0" y="390" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="400.0" y="422" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Recomendação</text><rect x="310.0" y="456" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="400.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Adoção</text><text x="148" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">A eliminação é irreversível e monotônica: perde-se opção e não se recupera</text><rect x="740" y="250" width="740" height="300" rx="14" fill="#F7F8FA"/><text x="768" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">ENTRE SESSÕES</text><rect x="768" y="324" width="684" height="50" rx="8" fill="#FFFFFF" stroke="#C7CDD5" stroke-width="2"/><rect x="768" y="324" width="6" height="50" rx="0" fill="#C7CDD5"/><text x="796" y="355" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A sessão</text><text x="1424" y="355" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="end">sem dono · efêmera</text><rect x="768" y="390" width="684" height="50" rx="8" fill="#F5EBDD" stroke="#B8792E" stroke-width="2"/><rect x="768" y="390" width="6" height="50" rx="0" fill="#B8792E"/><text x="796" y="421" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A memória do projeto</text><text x="1424" y="421" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="end">quem constrói controla</text><rect x="768" y="456" width="684" height="50" rx="8" fill="#FFFFFF" stroke="#8B93A1" stroke-width="2"/><rect x="768" y="456" width="6" height="50" rx="0" fill="#8B93A1"/><text x="796" y="487" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">O corpus público</text><text x="1424" y="487" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="end">sem dono · sofre erosão</text><text x="768" y="534" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Só a do meio tem dono — e é a que era lida no começo de toda sessão</text><rect x="120" y="596" width="1360" height="84" rx="14" fill="#16213E"/><text x="800.0" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">O funil opera no nível da decisão, não no da sessão</text><text x="800.0" y="664" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">As decisões que importam são as registradas, porque essas pararam de ser decididas</text><rect x="60" y="708" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="708" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="747" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Roda que perde energia para de girar. O que se acumula entre sessões também evapora.</text><line x1="60" y1="794" x2="1540" y2="794" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="820" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · a figura do funil: atribuição disputada, Lewis (1898), Sheldon, e a sigla AIDA em 1921</text></svg>