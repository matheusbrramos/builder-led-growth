<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="830" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="830" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE VETO CHANGES IN KIND</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">From choosing among alternatives to accepting a result</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The veto power stays with the person. What they veto is what changed</text><rect x="120" y="246" width="700" height="300" rx="14" fill="#E6F0EA"/><rect x="120" y="246" width="700" height="300" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="470.0" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">AT THE ASSISTED END</text><text x="470.0" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">choose</text><rect x="195.0" y="374" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1.5"/><text x="280.0" y="409" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">Option A</text><rect x="385.0" y="374" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="470.0" y="409" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Option B</text><rect x="575.0" y="374" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#2F7D5D" stroke-width="1"/><text x="660.0" y="409" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Option C</text><text x="470.0" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">The alternatives go on existing</text><text x="470.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">should the first one disappoint</text><rect x="780" y="246" width="700" height="300" rx="14" fill="#E7EEF4"/><rect x="780" y="246" width="700" height="300" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1130.0" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">AT THE DELEGATED END</text><text x="1130.0" y="338" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">accept or reject</text><rect x="930.0" y="374" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/><text x="1130.0" y="409" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#16213E" text-anchor="middle">One already-built result</text><text x="1130.0" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">Accepting requires evaluating nothing:</text><text x="1130.0" y="488" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">it requires that nothing look wrong</text><rect x="120" y="580" width="1360" height="72" rx="14" fill="#F5EBDD"/><rect x="120" y="580" width="6" height="72" rx="0" fill="#B8792E"/><text x="160" y="610" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Cheaper to exercise, and more expensive to reverse</text><text x="160" y="636" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The moment the person accepts, the thing is already written into the code, with configuration and environment variables around it</text><rect x="60" y="678" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="678" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="717" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What you control isn't the comparison — it's what the person finds already done when they look.</text><line x1="60" y1="764" x2="1540" y2="764" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="790" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · developed in the piece on adoption</text></svg>