<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="900" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT CROSSES FROM ONE DECISION TO THE NEXT</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three layers, and only the middle one has an owner</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">And it is the brake whoever builds controls</text><rect x="120" y="246" width="1360" height="116" rx="12" fill="#FFFFFF" stroke="#C7CDD5" stroke-width="2"/><rect x="120" y="246" width="7" height="116" rx="0" fill="#C7CDD5"/><text x="156" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The session</text><text x="156" y="328" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Where elimination happens. Nobody strengthens a position in it</text><text x="1444" y="292" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="end">no owner · ephemeral</text><rect x="120" y="380" width="1360" height="116" rx="12" fill="#F5EBDD" stroke="#B8792E" stroke-width="2"/><rect x="120" y="380" width="7" height="116" rx="0" fill="#B8792E"/><text x="156" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The project memory</text><text x="156" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Specifications, decision records, instruction files for the agent</text><text x="1444" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#16213E" text-anchor="end">whoever builds controls it</text><text x="1444" y="458" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#B8792E" text-anchor="end">read at the start of every session</text><rect x="120" y="514" width="1360" height="116" rx="12" fill="#FFFFFF" stroke="#8B93A1" stroke-width="2"/><rect x="120" y="514" width="7" height="116" rx="0" fill="#8B93A1"/><text x="156" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The public corpus</text><text x="156" y="596" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">The material that trains the next model. Rises slowly and falls slowly</text><text x="1444" y="560" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#8B93A1" text-anchor="end">no owner · erodes</text><rect x="120" y="660" width="1360" height="76" rx="14" fill="#16213E"/><text x="800.0" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">A decision written into the file stops being a decision and becomes a premise</text><text x="800.0" y="722" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">It needs neither model training nor code written — it needs one line in a file</text><rect x="60" y="748" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="748" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="787" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Being written there is a more durable position than the training data, and cheaper than switching cost.</text><line x1="60" y1="834" x2="1540" y2="834" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="860" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · corrects a claim in part 4 about the session starting from zero</text></svg>