<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE THREE STAGES ALONG THE AXIS</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The same stage changes shape as delegation rises</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Candidacy, recommendation and adoption at both ends of the axis</text><text x="780.0" y="236" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">ASSISTED DECISION</text><text x="1270.0" y="236" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">DELEGATED DECISION</text><rect x="120" y="262" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Candidacy</text><text x="148" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">being in the set that gets chosen from</text><rect x="520" y="262" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="262" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A list a person reads — and a</text><text x="546" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">list that is read is auditable:</text><text x="546" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the reader notices an absence</text><rect x="1060" y="262" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="262" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The set forms inside the process</text><text x="1086" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">and is never displayed.</text><text x="1086" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Nobody notices any absence</text><rect x="120" y="420" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Recommendation</text><text x="148" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">being the one chosen within the set</text><rect x="520" y="420" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="420" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The person sees alternatives side</text><text x="546" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">by side and applies own criteria</text><rect x="1060" y="420" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="420" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">There is no comparison: there is</text><text x="1086" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a result — and it converges</text><text x="1086" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">toward the familiar</text><rect x="120" y="578" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Adoption</text><text x="148" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">surviving integration and use</text><rect x="520" y="578" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="578" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="622" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">You integrate what you chose,</text><text x="546" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">knowing what you chose</text><rect x="1060" y="578" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="578" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="622" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">You integrate what turned up, and</text><text x="1086" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">the first close look usually</text><text x="1086" y="674" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">happens when it breaks</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Visibility of loss grows down the funnel, and the ability to act on it falls in step.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · in one measured configuration, 57.8% of repetitions did not trigger a web search (arXiv 2604.07585)</text></svg>