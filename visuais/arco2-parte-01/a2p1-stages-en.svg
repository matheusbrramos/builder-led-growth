<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE BUILDER FUNNEL</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Three stages, and the cost of removing you rises at each</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">The stages say where the product is, not what happens to it</text><rect x="60" y="250" width="460" height="300" rx="14" fill="#E6F0EA"/><rect x="60" y="250" width="460" height="300" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="250" width="460" height="7" rx="0" fill="#2F7D5D"/><text x="90" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Candidacy</text><text x="90" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">You are in the set that gets</text><text x="90" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">chosen from. Known, findable,</text><text x="90" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and nobody has needed you</text><text x="90" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">yet</text><line x1="90" y1="446" x2="490" y2="446" stroke="#2F7D5D" stroke-width="1.5"/><text x="90" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">COST OF REMOVAL</text><text x="90" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">zero</text><line x1="534" y1="400.0" x2="562" y2="400.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="250" width="460" height="300" rx="14" fill="#F5EBDD"/><rect x="570" y="250" width="460" height="300" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="570" y="250" width="460" height="7" rx="0" fill="#B8792E"/><text x="600" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Construction</text><text x="600" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">You left the corpus and entered</text><text x="600" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">the code of something being</text><text x="600" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">made. It starts at the first</text><text x="600" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">line that calls you</text><line x1="600" y1="446" x2="1000" y2="446" stroke="#B8792E" stroke-width="1.5"/><text x="600" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">COST OF REMOVAL</text><text x="600" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">a few hours</text><line x1="1044" y1="400.0" x2="1072" y2="400.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="250" width="460" height="300" rx="14" fill="#E7EEF4"/><rect x="1080" y="250" width="460" height="300" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1080" y="250" width="460" height="7" rx="0" fill="#2F5D8A"/><text x="1110" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Adoption</text><text x="1110" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">You became a premise of what</text><text x="1110" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">shipped. There is data in your</text><text x="1110" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">format and people using it</text><text x="1110" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">without knowing you exist</text><line x1="1110" y1="446" x2="1510" y2="446" stroke="#2F5D8A" stroke-width="1.5"/><text x="1110" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">COST OF REMOVAL</text><text x="1110" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">a project</text><rect x="60" y="596" width="1480" height="76" rx="14" fill="#16213E"/><text x="92" y="630" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">The more the pair delegates, the faster a product crosses all three</text><text x="92" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Recommendation is not a stage: it is one of the forces acting inside candidacy</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Reaching adoption creates a competitive barrier that was never won in a comparison.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · the split between decision and implementation was already in Rogers</text></svg>