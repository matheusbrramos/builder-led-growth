<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="980" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">ONE FUNNEL, THREE DELEGATION REGIMES</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">The three conditions never change. Who satisfies them does</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Not three funnels — the same decision with delegation sitting in different places</text><text x="564.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="1.5">GOVERNED DEVELOPMENT</text><text x="966.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="1.5">SHORTLIST</text><text x="1360.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.5">DECISION REMOVED</text><text x="205.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">the three conditions</text><rect x="60" y="274" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="326" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Candidacy</text><text x="84" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">being in the set</text><text x="84" y="379" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">that gets chosen from</text><rect x="376" y="274" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="274" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="274" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">A RULE WRITTEN EARLIER</text><text x="398" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The approved-tools registry</text><text x="398" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">narrows the set before the</text><text x="398" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">machine even looks</text><rect x="778" y="274" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="274" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="274" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">THE MACHINE</text><text x="800" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">It gathers three or four</text><text x="800" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">names and shows the list</text><rect x="1180" y="274" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="274" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="274" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">THE MACHINE, UNSEEN</text><text x="1202" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">The set forms inside the</text><text x="1202" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">process and never appears</text><rect x="60" y="442" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Recommendation</text><text x="84" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">being the one chosen</text><text x="84" y="547" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">within the set</text><rect x="376" y="442" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="442" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="442" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">THE HUMAN, ON CRITERIA</text><text x="398" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A documented choice, with</text><text x="398" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">someone to ask why</text><rect x="778" y="442" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="442" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="442" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">THE HUMAN</text><text x="800" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Sees the alternatives side by</text><text x="800" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">side and applies own criteria</text><rect x="1180" y="442" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="442" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="442" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">THE MACHINE</text><text x="1202" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">No comparison: there is a</text><text x="1202" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">result, and it converges</text><text x="1202" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">toward the familiar</text><rect x="60" y="610" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Adoption</text><text x="84" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">surviving integration</text><text x="84" y="715" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">and use</text><rect x="376" y="610" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="610" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="610" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">THE PAIR, REVIEWED</text><text x="398" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Integration is watched by</text><text x="398" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">whoever approved it</text><rect x="778" y="610" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="610" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="610" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">THE PAIR</text><text x="800" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">You integrate what you chose,</text><text x="800" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">knowing what you chose</text><rect x="1180" y="610" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="610" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="610" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">THE PAIR, LATE</text><text x="1202" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">You integrate what turned up,</text><text x="1202" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">and the first close look tends</text><text x="1202" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">to happen when it breaks</text><rect x="60" y="828" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="828" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="867" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Failing any one of the three zeroes that decision — and only that one.</text><line x1="60" y1="914" x2="1540" y2="914" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="940" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · in one measured configuration, 57.8% of repetitions did not trigger a web search (arXiv 2604.07585)</text></svg>