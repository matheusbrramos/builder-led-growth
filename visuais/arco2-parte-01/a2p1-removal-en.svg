<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="840" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="840" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">THE DECISION NOBODY MADE</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">They weren't rejected. They weren't presented</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Why “at what moment did the others drop out?” has no answer</text><rect x="120" y="236" width="560" height="300" rx="14" fill="#F7F8FA"/><text x="150" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">THREE OPTIONS EXISTED</text><rect x="150" y="314" width="500" height="54" rx="10" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><circle cx="182" cy="341" r="9" fill="#C7CDD5"/><text x="208" y="347" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Provider A</text><rect x="150" y="382" width="500" height="54" rx="10" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><circle cx="182" cy="409" r="9" fill="#C7CDD5"/><text x="208" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Provider B</text><rect x="150" y="450" width="500" height="54" rx="10" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><circle cx="182" cy="477" r="9" fill="#C7CDD5"/><text x="208" y="483" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Provider C</text><line x1="714" y1="386.0" x2="808" y2="386.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="842" y="236" width="638" height="300" rx="14" fill="#FFFFFF" stroke="#DEE2E7" stroke-width="1.5"/><text x="872" y="282" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">WHAT REACHED THE PERSON</text><rect x="872" y="314" width="578" height="54" rx="10" fill="#E6F0EA" stroke="#2F7D5D" stroke-width="2"/><circle cx="904" cy="341" r="9" fill="#2F7D5D"/><text x="930" y="347" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">Became a dependency in the code</text><rect x="872" y="382" width="578" height="54" rx="10" fill="#FFFFFF" fill-opacity="0.5" stroke="#DEE2E7" stroke-width="1.5"/><circle cx="904" cy="409" r="9" fill="#C7CDD5"/><text x="930" y="415" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">never mentioned</text><rect x="872" y="450" width="578" height="54" rx="10" fill="#FFFFFF" fill-opacity="0.5" stroke="#DEE2E7" stroke-width="1.5"/><circle cx="904" cy="477" r="9" fill="#C7CDD5"/><text x="930" y="483" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">never mentioned</text><text x="872" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">No rejection, no comparison, no trace</text><rect x="120" y="570" width="1360" height="78" rx="14" fill="#16213E"/><text x="800.0" y="604" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">The decision was not delegated. It was removed from view</text><text x="800.0" y="632" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">Nobody answers “who chose?” about a choice never put in front of them</text><rect x="60" y="688" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="688" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="727" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">And when it is delegated, it converges: popular libraries in up to 48% of cases, Python in 58%.</text><line x1="60" y1="774" x2="1540" y2="774" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Supabase (Jun 2026) · Neon via Databricks (Jan 2026) · arXiv 2503.17181 (ACL 2026)</text></svg>