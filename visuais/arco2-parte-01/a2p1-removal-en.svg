<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHAT DELEGATION DOES TO THE SET</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">It is not only that the person stops choosing</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Four measured mechanisms shrink the set the choice would come from</text><rect x="60.0" y="246" width="355" height="330" rx="14" fill="#E7EEF4"/><rect x="60.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="60.0" y="246" width="355" height="6" rx="0" fill="#2F5D8A"/><text x="84.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">THE RETRIEVER</text><text x="84.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">1.4 or 7.4</text><text x="84.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">How many candidates the model</text><text x="84.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">gets to see, over the SAME data.</text><text x="84.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Swapping one piece of</text><text x="84.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">infrastructure changes it</text><text x="84.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2605.24660 · scope: whether the right one appears</text><rect x="435.0" y="246" width="355" height="330" rx="14" fill="#F5EBDD"/><rect x="435.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="435.0" y="246" width="355" height="6" rx="0" fill="#B8792E"/><text x="459.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">CATALOGUE SIZE</text><text x="459.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">95% → 20%</text><text x="459.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Accuracy at selecting the right</text><text x="459.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">one: 84-95% with ~50 tools,</text><text x="459.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">41-83% with 200, and 0-20% for</text><text x="459.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">most models with 740</text><text x="459.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2510.00307 · lab, synthetic catalogue</text><rect x="810.0" y="246" width="355" height="330" rx="14" fill="#E6F0EA"/><rect x="810.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="810.0" y="246" width="355" height="6" rx="0" fill="#2F7D5D"/><text x="834.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">ORDER</text><text x="834.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">13% to 85%</text><text x="834.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">How much ordering alone moves</text><text x="834.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">performance. Mid-way down a long</text><text x="834.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">list, the right tool is picked in</text><text x="834.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">22% to 52% of cases</text><text x="834.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2510.00307 · same caveat</text><rect x="1185.0" y="246" width="355" height="330" rx="14" fill="#F5E6E2"/><rect x="1185.0" y="246" width="355" height="330" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="1185.0" y="246" width="355" height="6" rx="0" fill="#9C4A3C"/><text x="1209.0" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start" letter-spacing="1.5">THE SEARCH THAT NEVER HAPPENS</text><text x="1209.0" y="346" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">57.8%</text><text x="1209.0" y="388" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Of repetitions triggered no web</text><text x="1209.0" y="411" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">search. Without one, the set comes</text><text x="1209.0" y="434" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">entirely from what the model</text><text x="1209.0" y="457" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">already carries</text><text x="1209.0" y="550" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">arXiv 2604.07585 · via citation in a review</text><rect x="60" y="610" width="1480" height="78" rx="14" fill="#16213E"/><text x="800.0" y="644" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="middle">Delegation shrinks the set the choice would have come from</text><text x="800.0" y="672" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="middle">The category default gains. Whoever fights for second place is neither chosen nor compared</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Measured in behaviour: popular libraries in up to 48% of cases, Python in 58%.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · arXiv 2605.24660 · BiasBusters (ICLR 2026) · arXiv 2604.07585 · arXiv 2503.17181 (ACL 2026)</text></svg>