<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="820" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">WHERE PEOPLE SIT TODAY</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">What gets delegated is the shortlist, not the choice</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Four measurements, four populations, and the same shape in all of them</text><rect x="120" y="236" width="1360" height="10" rx="5" fill="#DEE2E7"/><rect x="120" y="236" width="680.0" height="10" rx="5" fill="#2F7D5D"/><rect x="800.0" y="236" width="680.0" height="10" rx="5" fill="#2F5D8A"/><text x="120" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">ASSISTED DECISION</text><text x="1480" y="218" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="end">DELEGATED DECISION</text><text x="800.0" y="286" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">delegation is a degree, never a state</text><rect x="84.0" y="336" width="340" height="244" rx="14" fill="#F5E6E2"/><rect x="84.0" y="336" width="340" height="244" rx="14" fill="none" stroke="#9C4A3C" stroke-width="2"/><rect x="84.0" y="336" width="340" height="6" rx="0" fill="#9C4A3C"/><text x="110.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700" font-style="normal" fill="#9C4A3C" text-anchor="start">11%</text><text x="110.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">let AI make the purchase call</text><text x="110.0" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">A CEILING, not an average —</text><text x="110.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and it occurs in the lowest-stakes</text><text x="110.0" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">categories · Gartner, May 2026, n=322</text><rect x="448.0" y="336" width="340" height="244" rx="14" fill="#F5EBDD"/><rect x="448.0" y="336" width="340" height="244" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="448.0" y="336" width="340" height="6" rx="0" fill="#B8792E"/><text x="474.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">31%</text><text x="474.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">let AI narrow the options</text><text x="474.0" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">One specific category: cleaning</text><text x="474.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">and household. Personal electronics: 28%</text><text x="474.0" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Gartner, May 2026, n=322</text><rect x="812.0" y="336" width="340" height="244" rx="14" fill="#E7EEF4"/><rect x="812.0" y="336" width="340" height="244" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="812.0" y="336" width="340" height="6" rx="0" fill="#2F5D8A"/><text x="838.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">86%</text><text x="838.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">check against another source</text><text x="838.0" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Of those who researched a product</text><text x="838.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">with AI, before buying</text><text x="838.0" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">observed pattern, n unconfirmed</text><rect x="1176.0" y="336" width="340" height="244" rx="14" fill="#E6F0EA"/><rect x="1176.0" y="336" width="340" height="244" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="1176.0" y="336" width="340" height="6" rx="0" fill="#2F7D5D"/><text x="1202.0" y="424" font-family="Liberation Sans, Arial, sans-serif" font-size="52" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">69%</text><text x="1202.0" y="462" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">validate with a person</text><text x="1202.0" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">B2B buyers. This is STATED</text><text x="1202.0" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">preference, not measured behaviour</text><text x="1202.0" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Gartner, May 2026, n=645</text><rect x="120" y="612" width="1360" height="46" rx="10" fill="#F7F8FA"/><text x="800.0" y="642" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="middle">And a fourth population pointing the same way: 98% of consumers verify the AI recommendation before buying</text><rect x="60" y="668" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="668" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="707" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">This is the shortlist regime. The machine assembles the set and leaves before the decision.</text><line x1="60" y1="754" x2="1540" y2="754" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="780" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arc 2 · Gartner (May 2026) · Idea Grove (2026) · IDC (Jan 2026)</text></svg>