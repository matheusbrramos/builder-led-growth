<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="880" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="880" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">O FUNIL DO BUILDER</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Três etapas, e o custo de tirar você sobe em cada uma</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">As etapas dizem onde o produto está, não o que acontece com ele</text><rect x="60" y="250" width="460" height="300" rx="14" fill="#E6F0EA"/><rect x="60" y="250" width="460" height="300" rx="14" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="60" y="250" width="460" height="7" rx="0" fill="#2F7D5D"/><text x="90" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Candidatura</text><text x="90" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Você está no conjunto de onde</text><text x="90" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">se escolhe. É conhecido,</text><text x="90" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">encontrável, e ninguém</text><text x="90" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">precisou de você ainda</text><line x1="90" y1="446" x2="490" y2="446" stroke="#2F7D5D" stroke-width="1.5"/><text x="90" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start" letter-spacing="1.5">CUSTO DE REMOÇÃO</text><text x="90" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">zero</text><line x1="534" y1="400.0" x2="562" y2="400.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="570" y="250" width="460" height="300" rx="14" fill="#F5EBDD"/><rect x="570" y="250" width="460" height="300" rx="14" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="570" y="250" width="460" height="7" rx="0" fill="#B8792E"/><text x="600" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Construção</text><text x="600" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Você saiu do corpus e entrou</text><text x="600" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">no código de algo que está</text><text x="600" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">sendo feito. Começa na</text><text x="600" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">primeira linha que te chama</text><line x1="600" y1="446" x2="1000" y2="446" stroke="#B8792E" stroke-width="1.5"/><text x="600" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start" letter-spacing="1.5">CUSTO DE REMOÇÃO</text><text x="600" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">algumas horas</text><line x1="1044" y1="400.0" x2="1072" y2="400.0" stroke="#C7CDD5" stroke-width="3" marker-end="url(#a)"/><rect x="1080" y="250" width="460" height="300" rx="14" fill="#E7EEF4"/><rect x="1080" y="250" width="460" height="300" rx="14" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1080" y="250" width="460" height="7" rx="0" fill="#2F5D8A"/><text x="1110" y="316" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Adoção</text><text x="1110" y="356" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">Você virou premissa do que</text><text x="1110" y="380" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">foi entregue. Há dados no seu</text><text x="1110" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">formato e gente usando sem</text><text x="1110" y="428" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#5B6472" text-anchor="start">saber que você existe</text><line x1="1110" y1="446" x2="1510" y2="446" stroke="#2F5D8A" stroke-width="1.5"/><text x="1110" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="1.5">CUSTO DE REMOÇÃO</text><text x="1110" y="514" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">um projeto</text><rect x="60" y="596" width="1480" height="76" rx="14" fill="#16213E"/><text x="92" y="630" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Quanto mais o par delega, mais rápido um produto atravessa as três</text><text x="92" y="658" font-family="Liberation Sans, Arial, sans-serif" font-size="15.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">Recomendação não é etapa: é uma das forças que agem dentro da candidatura</text><rect x="60" y="728" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="728" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="767" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Chegar à adoção cria uma barreira competitiva que não foi conquistada em comparação.</text><line x1="60" y1="814" x2="1540" y2="814" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · a separação entre decisão e implementação já estava em Rogers</text></svg>