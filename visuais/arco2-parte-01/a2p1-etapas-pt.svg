<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="940" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="940" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">AS TRÊS ETAPAS AO LONGO DO EIXO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A mesma etapa muda de forma conforme a delegação sobe</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Candidatura, recomendação e adoção nas duas pontas do eixo</text><text x="780.0" y="236" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="2">DECISÃO ASSISTIDA</text><text x="1270.0" y="236" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="2">DECISÃO DELEGADA</text><rect x="120" y="262" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="318" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Candidatura</text><text x="148" y="354" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">estar no conjunto de onde se escolhe</text><rect x="520" y="262" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="262" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Uma lista que a pessoa lê —</text><text x="546" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">e lista lida é auditável:</text><text x="546" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">quem lê percebe uma ausência</text><rect x="1060" y="262" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="262" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O conjunto se forma dentro</text><text x="1086" y="332" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">do processo e nunca é exibido.</text><text x="1086" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ninguém percebe ausência</text><rect x="120" y="420" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="476" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Recomendação</text><text x="148" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">ser o escolhido dentro do conjunto</text><rect x="520" y="420" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="420" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A pessoa vê alternativas lado</text><text x="546" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a lado e aplica critério próprio</text><rect x="1060" y="420" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="420" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="464" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Não há comparação: há um</text><text x="1086" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">resultado — e ele converge</text><text x="1086" y="516" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">para o que é familiar</text><rect x="120" y="578" width="380" height="140" rx="12" fill="#16213E"/><text x="148" y="634" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Adoção</text><text x="148" y="670" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">sobreviver à integração e ao uso</text><rect x="520" y="578" width="520" height="140" rx="12" fill="#E6F0EA"/><rect x="520" y="578" width="520" height="140" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><text x="546" y="622" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Integra-se o que se escolheu,</text><text x="546" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">sabendo o que se escolheu</text><rect x="1060" y="578" width="420" height="140" rx="12" fill="#E7EEF4"/><rect x="1060" y="578" width="420" height="140" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><text x="1086" y="622" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Integra-se o que apareceu, e a</text><text x="1086" y="648" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">primeira olhada com atenção</text><text x="1086" y="674" font-family="Liberation Sans, Arial, sans-serif" font-size="16.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">costuma ser quando quebra</text><rect x="60" y="788" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="788" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="827" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">A visibilidade da perda cresce descendo o funil, e a capacidade de agir cai junto.</text><line x1="60" y1="874" x2="1540" y2="874" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="900" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · numa configuração medida, 57.8% das repetições não acionaram busca na web (arXiv 2604.07585)</text></svg>