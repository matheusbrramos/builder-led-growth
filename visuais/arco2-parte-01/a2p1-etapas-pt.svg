<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C7CDD5"/></marker></defs><rect x="0" y="0" width="1600" height="980" fill="#FFFFFF"/><rect x="0" y="0" width="10" height="980" rx="0" fill="#2F5D8A"/><text x="60" y="66" font-family="Liberation Sans, Arial, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start" letter-spacing="2">UM FUNIL, TRÊS REGIMES DE DELEGAÇÃO</text><text x="60" y="106" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">As três condições são sempre as mesmas. Quem as satisfaz, não</text><text x="60" y="138" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="400" font-style="italic" fill="#5B6472" text-anchor="start">Não são três funis — é a mesma decisão com a delegação em pontos diferentes</text><text x="564.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="middle" letter-spacing="1.5">DESENVOLVIMENTO GOVERNADO</text><text x="966.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="middle" letter-spacing="1.5">LISTA CURTA</text><text x="1360.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="middle" letter-spacing="1.5">DECISÃO REMOVIDA</text><text x="205.0" y="246" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="italic" fill="#8B93A1" text-anchor="middle">as três condições</text><rect x="60" y="274" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="326" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Candidatura</text><text x="84" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">estar no conjunto</text><text x="84" y="379" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">de onde se escolhe</text><rect x="376" y="274" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="274" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="274" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">REGRA ESCRITA ANTES</text><text x="398" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O registro de ferramentas</text><text x="398" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">aprovadas restringe o conjunto</text><text x="398" y="390" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">antes de a máquina olhar</text><rect x="778" y="274" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="274" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="274" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">MÁQUINA</text><text x="800" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Ela reúne três ou quatro</text><text x="800" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">nomes e mostra a lista</text><rect x="1180" y="274" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="274" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="274" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="314" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">MÁQUINA, SEM EXIBIR</text><text x="1202" y="344" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">O conjunto se forma dentro</text><text x="1202" y="367" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">do processo e nunca aparece</text><rect x="60" y="442" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="494" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Recomendação</text><text x="84" y="526" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">ser o escolhido</text><text x="84" y="547" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">dentro do conjunto</text><rect x="376" y="442" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="442" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="442" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">HUMANO, COM CRITÉRIO</text><text x="398" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Escolha documentada, e</text><text x="398" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">há a quem perguntar por quê</text><rect x="778" y="442" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="442" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="442" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">HUMANO</text><text x="800" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Vê as alternativas lado a</text><text x="800" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">lado e aplica critério próprio</text><rect x="1180" y="442" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="442" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="442" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="482" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">MÁQUINA</text><text x="1202" y="512" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Não há comparação: há um</text><text x="1202" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">resultado, e ele converge</text><text x="1202" y="558" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">para o que é familiar</text><rect x="60" y="610" width="290" height="150" rx="12" fill="#16213E"/><text x="84" y="662" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" font-style="normal" fill="#FFFFFF" text-anchor="start">Adoção</text><text x="84" y="694" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">sobreviver à</text><text x="84" y="715" font-family="Liberation Sans, Arial, sans-serif" font-size="13.5" font-weight="400" font-style="normal" fill="#AEB6C2" text-anchor="start">integração e ao uso</text><rect x="376" y="610" width="376" height="150" rx="12" fill="#E6F0EA"/><rect x="376" y="610" width="376" height="150" rx="12" fill="none" stroke="#2F7D5D" stroke-width="2"/><rect x="376" y="610" width="5" height="150" rx="0" fill="#2F7D5D"/><text x="398" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F7D5D" text-anchor="start">O PAR, COM REVISÃO</text><text x="398" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">A integração é acompanhada</text><text x="398" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">por quem aprovou</text><rect x="778" y="610" width="376" height="150" rx="12" fill="#F5EBDD"/><rect x="778" y="610" width="376" height="150" rx="12" fill="none" stroke="#B8792E" stroke-width="2"/><rect x="778" y="610" width="5" height="150" rx="0" fill="#B8792E"/><text x="800" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#B8792E" text-anchor="start">O PAR</text><text x="800" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Integra-se o que se escolheu,</text><text x="800" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">sabendo o que se escolheu</text><rect x="1180" y="610" width="360" height="150" rx="12" fill="#E7EEF4"/><rect x="1180" y="610" width="360" height="150" rx="12" fill="none" stroke="#2F5D8A" stroke-width="2"/><rect x="1180" y="610" width="5" height="150" rx="0" fill="#2F5D8A"/><text x="1202" y="650" font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#2F5D8A" text-anchor="start">O PAR, TARDE</text><text x="1202" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">Integra-se o que apareceu, e</text><text x="1202" y="703" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">a primeira olhada com atenção</text><text x="1202" y="726" font-family="Liberation Sans, Arial, sans-serif" font-size="14.5" font-weight="400" font-style="normal" fill="#16213E" text-anchor="start">costuma ser quando quebra</text><rect x="60" y="828" width="1480" height="62" rx="12" fill="#F7F8FA"/><rect x="60" y="828" width="6" height="62" rx="0" fill="#16213E"/><text x="92" y="867" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-weight="700" font-style="normal" fill="#16213E" text-anchor="start">Falhar em qualquer uma das três zera aquela decisão — e só aquela.</text><line x1="60" y1="914" x2="1540" y2="914" stroke="#DEE2E7" stroke-width="1"/><text x="60" y="940" font-family="Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#8B93A1" text-anchor="start">Builder-Led Growth, arco 2 · numa configuração medida, 57.8% das repetições não acionaram busca na web (arXiv 2604.07585)</text></svg>